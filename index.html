<script>
/* =========================================================================
 * IRP 포트폴리오 계산 엔진 (calc.js)
 * 원본: 아빠_퇴직_IRP_포트폴리오_관리표_V6_20260731_2.xlsx
 * 엑셀의 각 수식을 1:1로 대응 구현한다. 각 함수 주석에 원본 셀 주소를 표기.
 * 브라우저(window.IRPCalc) / Node(module.exports) 양쪽에서 사용 가능.
 * ========================================================================= */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.IRPCalc = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ---------------------------------------------------------------------
   * 0. 안전 산술 — 분모 0/결측 시 NaN·Infinity 금지 (요구사항 §6)
   * ------------------------------------------------------------------- */
  const n = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
  /** 엑셀 IF(denom=0,0,num/denom) 패턴 */
  const div = (num_, den) => {
    const a = n(num_), b = n(den);
    return b === 0 ? 0 : a / b;
  };
  const sum = (arr, f) => arr.reduce((s, x) => s + n(f ? f(x) : x), 0);
  const round = (v, p) => { const m = Math.pow(10, p || 0); return Math.round(n(v) * m) / m; };
  /** 엑셀 ROUNDDOWN(x,0) — 0 방향 절사 */
  const rounddown0 = (v) => { const x = n(v); return x < 0 ? Math.ceil(x) : Math.floor(x); };

  /* ---------------------------------------------------------------------
   * 1. 날짜 유틸 — 엑셀 EDATE / EOMONTH / DATEDIF("m") 동일 구현
   * ------------------------------------------------------------------- */
  const pad = (x) => String(x).padStart(2, '0');
  function toISO(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function parseISO(s) {
    if (!s) return null;
    if (s instanceof Date) return new Date(Date.UTC(s.getFullYear(), s.getMonth(), s.getDate()));
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
    if (!m) return null;
    return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  }
  const daysInMonth = (y, m0) => new Date(Date.UTC(y, m0 + 1, 0)).getUTCDate();
  /** 엑셀 EDATE(date, months) — 일(day)은 유지하되 월말 초과 시 월말로 절삭 */
  function edate(iso, months) {
    const d = parseISO(iso); if (!d) return null;
    const total = d.getUTCFullYear() * 12 + d.getUTCMonth() + Math.round(months);
    const y = Math.floor(total / 12), m0 = total - y * 12;
    const day = Math.min(d.getUTCDate(), daysInMonth(y, m0));
    return toISO(new Date(Date.UTC(y, m0, day)));
  }
  /** 엑셀 EOMONTH(date,0) */
  function eomonth(iso, offset) {
    const d = parseISO(iso); if (!d) return null;
    const total = d.getUTCFullYear() * 12 + d.getUTCMonth() + (offset || 0);
    const y = Math.floor(total / 12), m0 = total - y * 12;
    return toISO(new Date(Date.UTC(y, m0, daysInMonth(y, m0))));
  }
  function addDays(iso, days) {
    const d = parseISO(iso); if (!d) return null;
    d.setUTCDate(d.getUTCDate() + Math.round(days));
    return toISO(d);
  }
  function diffDays(a, b) {
    const x = parseISO(a), y = parseISO(b);
    if (!x || !y) return 0;
    return Math.round((y.getTime() - x.getTime()) / 86400000);
  }
  /** 엑셀 DATEDIF(start,end,"m") — 완전히 경과한 개월 수 */
  function datedifM(startISO, endISO) {
    const a = parseISO(startISO), b = parseISO(endISO);
    if (!a || !b) return 0;
    let m = (b.getUTCFullYear() - a.getUTCFullYear()) * 12 + (b.getUTCMonth() - a.getUTCMonth());
    if (b.getUTCDate() < a.getUTCDate()) m -= 1;
    return m;
  }
  const ymKey = (iso) => (iso ? String(iso).slice(0, 7) : '');
  const monthOf = (iso) => (iso ? parseInt(String(iso).slice(5, 7), 10) : 0);
  const yearOf = (iso) => (iso ? parseInt(String(iso).slice(0, 4), 10) : 0);
  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /* ---------------------------------------------------------------------
   * 2. 종목 단위 계산 (원본: 각 종목 시트 C27~C51, C63~C74)
   * ------------------------------------------------------------------- */

  /** 매수 합계 — 원본 C27(수량) / E27(금액). E7 = IF(OR(C7="",D7=""),0,C7*D7) */
  function buyTotals(buys) {
    const list = (buys || []).filter((b) => n(b.qty) !== 0 || n(b.price) !== 0);
    return {
      qty: sum(list, (b) => b.qty),
      amount: sum(list, (b) => n(b.qty) * n(b.price)),
      fee: sum(list, (b) => b.fee),
    };
  }

  /**
   * 보유 평단가 — 원본 C45 = IF(C27=0,0,E27/C27)
   * ★ 총평균법(매수 가중평균). 매도해도 평단은 변하지 않는다.
   *   (원본 '표지·사용안내'!C24 명시: "매도해도 이 평단은 바뀌지 않습니다.")
   *   → 이동평균법·선입선출법 아님. 반드시 원본 방식 유지.
   */
  function avgCost(buys) {
    const bt = buyTotals(buys);
    return div(bt.amount, bt.qty);
  }

  /**
   * 매도 합계 — 원본 C41(수량) / E41(금액) / F41(실현손익)
   * F31 = IF(OR(C31="",D31=""),0,C31*(D31-$C$45))
   *  → 실현손익 = 매도수량 × (매도단가 − 보유평단).  수수료는 원본에 항목 없음(0).
   *    웹에서는 fee 입력을 허용하되 기본 0이므로 원본과 동일 결과.
   */
  function sellTotals(sells, avg) {
    const list = (sells || []).filter((s) => n(s.qty) !== 0 || n(s.price) !== 0);
    return {
      qty: sum(list, (s) => s.qty),
      amount: sum(list, (s) => n(s.qty) * n(s.price)),
      fee: sum(list, (s) => s.fee),
      realized: sum(list, (s) => n(s.qty) * (n(s.price) - n(avg)) - n(s.fee)),
    };
  }

  /** 특정 시점(락일)까지의 보유주식수 — 원본 E78 = SUMIF(매수B<=락일) − SUMIF(매도B<=락일) */
  function sharesAsOf(buys, sells, iso) {
    const q1 = sum((buys || []).filter((b) => b.date && b.date <= iso), (b) => b.qty);
    const q2 = sum((sells || []).filter((s) => s.date && s.date <= iso), (s) => s.qty);
    return q1 - q2;
  }

  /**
   * ⑥ 향후 30년 배당 스케줄 — 원본 B78:G139(반기) / :G449(월) 등
   *   행수 = 연지급횟수 × 31 (과거 1년 + 향후 30년)
   *   C(락일)  = EDATE($C$70, (i - freq) * 12 / freq),  i = 0-based 행 인덱스
   *   D(지급일)= EDATE(C, m) + delta,  m = DATEDIF($C$70,$C$71,"m"),
   *              delta = $C$71 − EDATE($C$70, m)   (일 단위)
   *   E(보유수량) = 락일 기준 매수−매도 누계
   *   F(주당배당) = $C$68
   *   G(예상배당) = E × F
   */
  function buildSchedule(inst) {
    const dv = inst.dividend || {};
    const freq = Math.round(n(dv.freq));
    const out = [];
    if (freq <= 0 || !dv.nextExDate) return out;
    const m = datedifM(dv.nextExDate, dv.nextPayDate);
    const base = edate(dv.nextExDate, m);
    const delta = diffDays(base, dv.nextPayDate);
    const rows = freq * 31;
    const step = 12 / freq;
    for (let i = 0; i < rows; i++) {
      const ex = edate(dv.nextExDate, (i - freq) * step);
      const pay = addDays(edate(ex, m), delta);
      const shares = sharesAsOf(inst.buys, inst.sells, ex);
      const perShare = n(dv.perShare);
      out.push({ seq: i + 1, ym: ymKey(ex), exDate: ex, payDate: pay, shares, perShare, amount: shares * perShare });
    }
    return out;
  }

  /** 배당 지급월 집합 (스케줄 지급일에서 도출) */
  function payoutMonths(schedule) {
    const s = new Set();
    schedule.forEach((r) => s.add(monthOf(r.payDate)));
    return Array.from(s).sort((a, b) => a - b);
  }

  /**
   * ★ 누적 확정 배당금 — 원본 C143(반기)/C453(월) = IF(C63>0, C63, G143)
   *   C63 = 실제 수령내역 합계, G143 = SUMIF(락일 <= 종합!C5(오늘), 예상배당G)
   *   → 실입금 내역이 1건이라도 있으면 그 합계가 우선, 없으면 락일 경과분 자동 추정.
   */
  function cumulativeDividend(inst, schedule, todayIso) {
    const received = sum(inst.dividendReceipts || [], (d) => d.amount);
    // 락일 경과 = 받을 권리가 확정된 금액 (원본 엑셀 C143 기준)
    const accrued = sum(schedule.filter((r) => r.exDate && r.exDate <= todayIso), (r) => r.amount);
    // 지급일 경과 = 실제로 계좌에 입금되었을 금액
    const paid = sum(schedule.filter((r) => r.payDate && r.payDate <= todayIso), (r) => r.amount);
    return {
      received, accrued, paid,
      pendingPay: Math.max(accrued - paid, 0),      // 권리는 확정됐으나 아직 미입금
      value: received > 0 ? received : accrued,      // 원본 엑셀과 동일한 '누적 확정 배당금'
      valuePaid: received > 0 ? received : paid,     // 현금 계산용 (실제 입금 기준)
      source: received > 0 ? '실수령' : '락일경과추정',
    };
  }

  /**
   * 종목 1건 전체 계산.
   *  원본 대응: C44 보유수량 / C45 평단 / C46 취득원가 / C47 현재가 / C48 평가금액
   *            C49 평가손익 / C50 수익률 / C51 실현손익 / C69 배당률 / C72 연간예상배당
   */
  function computeInstrument(inst, price, todayIso) {
    const today = todayIso || todayISO();
    const bt = buyTotals(inst.buys);
    const avg = div(bt.amount, bt.qty);                 // C45
    const st = sellTotals(inst.sells, avg);
    const qty = bt.qty - st.qty;                        // C44
    const cost = qty * avg;                             // C46
    const px = n(price && price.price);                 // C47 (네이버현재가 INDEX/MATCH)
    const mv = qty * px;                                // C48
    const pl = mv - cost;                               // C49
    const plr = div(pl, cost);                          // C50
    const realized = st.realized;                       // C51 = F41
    const realizedCost = st.amount - realized;          // 종합 M열 분모 (E41 − L)
    const realizedR = div(realized, realizedCost);      // 종합 M열
    const schedule = buildSchedule(inst);
    const cum = cumulativeDividend(inst, schedule, today);
    const dv = inst.dividend || {};
    const freq = Math.round(n(dv.freq));
    const perShare = n(dv.perShare);
    const annualDiv = qty * perShare * freq;            // C72
    const annualDivAfterTax = annualDiv * (1 - 0.154);  // C74 (참고: 일반계좌 15.4%)
    const divYieldPrice = div(perShare * freq, px);     // C69 (현재가 기준)
    const divYieldCost = div(perShare * freq, avg);     // 취득원가(평단) 기준 — 웹 추가지표
    const cumDivYield = div(cum.value, cost);           // 누적배당수익률 — 웹 추가지표
    const combined = pl + cum.value + realized;         // 종합 N열
    const combinedBase = cost + realizedCost;           // 합산수익률 분모(취득원가+매도원가) — 웹 추가지표
    const combinedR = div(combined, combinedBase);
    const dayChange = n(price && price.change);
    const dayPL = qty * dayChange;                      // 금일 손익 — 웹 추가지표
    return {
      id: inst.id, sheet: inst.sheet, name: inst.name, code: inst.code,
      buyQty: bt.qty, buyAmount: bt.amount, buyFee: bt.fee,
      sellQty: st.qty, sellAmount: st.amount, sellFee: st.fee,
      qty, avg, cost, price: px, mv, pl, plr,
      realized, realizedCost, realizedR,
      cumDiv: cum.value, cumDivReceived: cum.received, cumDivAccrued: cum.accrued,
      cumDivPaid: cum.valuePaid, cumDivPendingPay: cum.received > 0 ? 0 : cum.pendingPay, cumDivSource: cum.source,
      cumDivYield, annualDiv, annualDivAfterTax, monthlyAvgDiv: annualDiv / 12,
      divYieldPrice, divYieldCost, freq, perShare,
      combined, combinedBase, combinedR,
      dayChange, dayChangeRate: n(price && price.changeRate), dayPL,
      schedule, payoutMonths: payoutMonths(schedule),
      isSafe: !!inst.isSafe, targetAmount: n(inst.target && inst.target.targetAmount),
      irpClass: (inst.target && inst.target.irpClass) || (inst.isSafe ? '안전자산' : '위험자산'),
      group: inst.target && inst.target.group, category: inst.target && inst.target.category,
      currency: (inst.target && inst.target.currency) || '원화',
      priceMeta: price || null,
    };
  }

  /* ---------------------------------------------------------------------
   * 3. 리밸런싱 (원본: '목표비중·리밸런싱' D~K, F30~F34, F37~H38)
   * ------------------------------------------------------------------- */
  function computeRebalance(rows, portfolioTarget, cash, totalAssets) {
    const P = n(portfolioTarget);
    const TA = n(totalAssets) || P;                         // 실제 총자산(평가금액 + 현금)
    // 목표비중의 분모는 '목표금액 합계' — 목표금액을 바꾸면 전 종목 목표비중이 자동 재배분되어
    // 합계가 항상 100% 가 된다. (원본 데이터는 합계 = 목표총액 4억이라 엑셀 값과 동일)
    const TS = sum(rows, (r) => n(r.targetAmount));
    const out = rows.map((r) => {
      const targetAmt = n(r.targetAmount);                  // D
      const targetW = div(targetAmt, TS);                   // E  목표비중 = 목표금액 ÷ 목표금액 합계
      const targetWOfTotal = div(targetAmt, P);             //    (참고: ÷ 목표총액)
      const mv = n(r.mv);                                   // F
      const curW = div(mv, TA);                             // 현재비중 = 평가금액 ÷ 실제 총자산
      const curWTarget = div(mv, P);                        // G  (엑셀 원본: ÷ 목표총액)
      const addBuy = Math.max(targetAmt - mv, 0);           // H = MAX(D−F,0)
      const px = n(r.price);                                // I
      const addQty = px === 0 ? 0 : rounddown0(addBuy / px); // J
      const targetQty = px === 0 ? 0 : rounddown0(targetAmt / px); // K
      return Object.assign({}, r, { targetAmt, targetW, targetWOfTotal, curW, curWTarget, addBuy, addQty, targetQty });
    });
    const targetSum = sum(out, (r) => r.targetAmt);          // D27
    const mvSum = sum(out, (r) => r.mv);                     // F27
    const addBuySum = sum(out, (r) => r.addBuy);             // H27
    const riskTarget = sum(out.filter((r) => r.irpClass === '위험자산'), (r) => r.targetAmt); // F37
    const safeTarget = sum(out.filter((r) => r.irpClass === '안전자산'), (r) => r.targetAmt); // F38
    const riskMV = sum(out.filter((r) => r.irpClass === '위험자산'), (r) => r.mv);
    const safeMV = sum(out.filter((r) => r.irpClass === '안전자산'), (r) => r.mv);
    const wAvgYield = sum(out, (r) => n(r.divYieldPrice) * n(r.targetW));  // R22 SUMPRODUCT(M,E)
    return {
      rows: out, targetSum, mvSum, addBuySum,
      totalAssets: TA,
      targetWSum: div(targetSum, targetSum || 1),            // 항상 100%
      targetWSumOfTotal: div(targetSum, P),                  // E27 (목표총액 대비)
      curWSum: div(mvSum, TA),
      curWSumTarget: div(mvSum, P),                          // G27 (엑셀 원본)
      riskTarget, riskW: div(riskTarget, P),                 // H37
      safeTarget, safeW: div(safeTarget, P),                 // H38
      riskMV, safeMV,
      riskMVW: div(riskMV, TA), safeMVW: div(safeMV, TA), cashW: div(n(cash), TA),
      cash: n(cash), fundGap: n(cash) - addBuySum,            // F34
      wAvgYield,
      checks: {
        targetSum100: Math.abs(div(targetSum, targetSum || 1) - 1) < 1e-9,
        targetEqPortfolio: Math.abs(targetSum - P) < 0.5,
        riskWithinLimit: div(riskTarget, P) <= 0.70 + 1e-9,
        mvSumMatch: true,
      },
    };
  }

  /* ---------------------------------------------------------------------
   * 4. 향후 12개월 배당 (원본: 종합 C85:N107)
   *    C85 = DATE(YEAR(오늘),MONTH(오늘),1), 이후 EDATE(+1)
   *    C86 = SUMIFS(스케줄G, 지급일D >= 월초, 지급일D <= EOMONTH(월초))
   * ------------------------------------------------------------------- */
  function next12Months(computed, todayIso) {
    const today = todayIso || todayISO();
    const start = String(today).slice(0, 8) + '01';
    const months = [];
    for (let i = 0; i < 12; i++) months.push(edate(start, i));
    const byInst = computed.map((c) =>
      months.map((m0) => {
        const m1 = eomonth(m0, 0);
        return sum(c.schedule.filter((r) => r.payDate >= m0 && r.payDate <= m1), (r) => r.amount);
      })
    );
    const totals = months.map((_, j) => sum(byInst, (row) => row[j]));
    return { months, byInst, totals, grandTotal: sum(totals) };
  }

  /** 월별 실제 수령 배당 (사용자 입력 기준) */
  function actualMonthlyDividends(instruments, months) {
    return months.map((m0) => {
      const key = ymKey(m0);
      return sum(instruments, (inst) => sum((inst.dividendReceipts || []).filter((d) => ymKey(d.date) === key), (d) => d.amount));
    });
  }

  /* ---------------------------------------------------------------------
   * 5. 장기 배당 현금흐름 (원본: '장기 배당현금흐름(2026-2050)')
   *    E6 = (목표달성주식수 × 주당분배금 × 연지급횟수) × (1+성장률)^연차
   *    E27 연간합계, E28 = ROUND(E27/12,0)
   *    C49:N69 월별 = 목표달성주식수 × 주당분배금  (지급월에만)
   * ------------------------------------------------------------------- */
  const SCENARIOS = {
    conservative: { label: '보수적', delta: -0.01 },
    base: { label: '기준', delta: 0 },
    optimistic: { label: '낙관적', delta: +0.01 },
  };

  function longTerm(computed, rebalRows, opts) {
    const o = Object.assign({
      startYear: 2026, endYear: 2050, scenario: 'base',
      reinvestRate: 0, extraContribution: 0, withdrawal: 0,
      livingCost: 0, excelMonthlyMode: false, reinvestYield: null,
    }, opts || {});
    const years = [];
    for (let y = o.startYear; y <= o.endYear; y++) years.push(y);
    const delta = (SCENARIOS[o.scenario] || SCENARIOS.base).delta;

    const perInst = computed.map((c, i) => {
      const rb = rebalRows[i] || {};
      const tq = n(rb.targetQty);
      const g = n(c.growth) + delta;
      const base = tq * n(c.perShare) * n(c.freq);
      return { name: c.name, targetQty: tq, growth: g, base, series: years.map((_, j) => base * Math.pow(1 + g, j)) };
    });

    // 재투자 복리 시뮬레이션 (원본 엑셀에는 없는 확장 기능 — 요구사항 §3-E)
    const reinvestYield = o.reinvestYield === null || o.reinvestYield === undefined
      ? (function () { const b = sum(perInst, (p) => p.base); const mv = sum(rebalRows, (r) => n(r.targetAmt)); return div(b, mv); })()
      : n(o.reinvestYield);

    let extraCapital = 0;
    const rows = years.map((y, j) => {
      const baseTotal = sum(perInst, (p) => p.series[j]);
      const reinvestDiv = baseTotal * n(o.reinvestRate);
      const extraIncome = extraCapital * reinvestYield;
      const total = baseTotal + extraIncome;
      const payout = total - reinvestDiv - n(o.withdrawal) + 0;
      extraCapital = extraCapital + reinvestDiv + n(o.extraContribution) - n(o.withdrawal);
      if (extraCapital < 0) extraCapital = 0;
      return {
        year: y, base: baseTotal, extraIncome, total,
        reinvested: reinvestDiv, netCash: Math.max(payout, 0),
        monthly: total / 12, capital: extraCapital,
        coverage: div(total / 12, o.livingCost),
      };
    });
    let acc = 0;
    rows.forEach((r) => { acc += r.total; r.cumulative = acc; });

    // 목표 달성 후 월별 (도달 첫 해 기준)
    const monthly = [];
    for (let m = 1; m <= 12; m++) {
      let v = 0;
      computed.forEach((c, i) => {
        const tq = n((rebalRows[i] || {}).targetQty);
        if (o.excelMonthlyMode) {
          // 원본 엑셀 방식: 맥쿼리인프라만 지급월 반영, 나머지는 전월 동일 배분
          const isMacq = c.sheet === '맥쿼리인프라';
          if (isMacq) { if (c.payoutMonths.indexOf(m) >= 0) v += tq * n(c.perShare); }
          else v += tq * n(c.perShare);
        } else {
          if (c.payoutMonths.indexOf(m) >= 0) v += tq * n(c.perShare);
        }
      });
      monthly.push(v);
    }
    const monthlyByInst = computed.map((c, i) => {
      const tq = n((rebalRows[i] || {}).targetQty);
      const arr = [];
      for (let m = 1; m <= 12; m++) {
        if (o.excelMonthlyMode) {
          const isMacq = c.sheet === '맥쿼리인프라';
          arr.push(isMacq ? (c.payoutMonths.indexOf(m) >= 0 ? tq * n(c.perShare) : 0) : tq * n(c.perShare));
        } else {
          arr.push(c.payoutMonths.indexOf(m) >= 0 ? tq * n(c.perShare) : 0);
        }
      }
      return arr;
    });

    return {
      years, perInst, rows, monthly, monthlyByInst,
      firstYearTotal: rows.length ? rows[0].base : 0,
      firstYearMonthlyAvg: rows.length ? Math.round(rows[0].base / 12) : 0,
      grandTotal: acc, reinvestYield,
    };
  }

  /* ---------------------------------------------------------------------
   * 6. 포트폴리오 전체 (원본: 종합 E29:R31, G56/I56, H30, P31/Q31)
   * ------------------------------------------------------------------- */
  function computePortfolio(state) {
    const today = state.baseDate || todayISO();
    const P = n(state.meta.portfolioTarget);
    // 총 납입원금 — 목표총액과 분리된 별도 입력값 (미설정 시 목표총액을 사용)
    const principal = (state.meta.contributedPrincipal === undefined || state.meta.contributedPrincipal === null)
      ? P : n(state.meta.contributedPrincipal);
    // 배당의 현금 반영 기준: 'confirmed' = 누적 확정배당(락일경과 추정 포함), 'received' = 실수령분만
    const divCashBasis = (state.settings && state.settings.dividendCashBasis) || 'confirmed';
    const computed = state.instruments.map((inst) => {
      const c = computeInstrument(inst, state.prices[inst.code], today);
      c.growth = n(inst.growth);
      c.isPlaceholder = !!inst.isPlaceholder;
      c.desc = inst.desc;
      c.dividend = inst.dividend;
      c.buys = inst.buys; c.sells = inst.sells; c.dividendReceipts = inst.dividendReceipts;
      // 맥쿼리인프라는 ETF가 아니라 개별 상장 인프라펀드라 "구성종목(바스켓)" 개념이 없음.
      // → 조회를 시도하지 않고 항상 자기 자신 100%로 취급 (Look-through 계산에서 미커버로 잡히지 않도록).
      c.holdings = (inst.holdings && inst.holdings.length) ? inst.holdings
        : (inst.sheet === '맥쿼리인프라' ? [{ code: inst.code, name: inst.name, weight: 1 }] : []);
      // 2026-08-12: 구성종목을 어느 소스(FunETF/ETF체크/KRX/네이버)에서, 언제 가져왔는지를
      // 화면에 표시하기 위해 그대로 넘긴다("데이터 출처를 화면에 표시" 원칙 — 진단 버튼 없이도
      // 어떤 소스가 채택됐는지 바로 보이도록 함).
      c.holdingsSource = inst.holdingsSource || null;
      c.holdingsAt = inst.holdingsAt || null;
      return c;
    });

    const totalCost = sum(computed, (c) => c.cost);            // E29
    const totalMV = sum(computed, (c) => c.mv);                // H29
    const totalPL = sum(computed, (c) => c.pl);                // I29
    const totalPLR = div(totalPL, totalCost);                  // J29
    const totalDiv = sum(computed, (c) => c.cumDiv);           // K29
    const totalRealized = sum(computed, (c) => c.realized);    // L29
    const totalRealizedCost = sum(computed, (c) => c.realizedCost);
    const totalRealizedR = div(totalRealized, totalRealizedCost); // M29
    const totalCombined = sum(computed, (c) => c.combined);    // N29
    const totalCombinedR = div(totalCombined, totalCost + totalRealizedCost);
    /* ── 현금성 자산: 현금흐름 기반 ─────────────────────────────────
     *   현금 = 납입원금 − 매수대금 − 매수수수료 + 매도대금 − 매도수수료 + 수령배당
     *   · 매도대금에는 실현손익이 그대로 포함되므로 실현손익이 자동 반영된다.
     *   · 배당은 계좌에 현금으로 입금되므로 그대로 가산한다.
     *   · 원본 엑셀의 정의( 종합!H30 = 표지!C6 − 종합!H29 )는 cashByTarget 으로 별도 보존.
     * ─────────────────────────────────────────────────────────── */
    const totalBuyAmount = sum(computed, (c) => c.buyAmount);
    const totalBuyFee = sum(computed, (c) => c.buyFee);
    const totalSellAmount = sum(computed, (c) => c.sellAmount);
    const totalSellFee = sum(computed, (c) => c.sellFee);
    const divReceived = sum(computed, (c) => c.cumDivReceived);
    const divPaid = sum(computed, (c) => c.cumDivPaid);
    const divPendingPay = sum(computed, (c) => c.cumDivPendingPay);
    // 현금 반영 기준
    //   confirmed = 락일 경과분(원본 엑셀과 동일) · paid = 지급일 경과분(실제 입금) · received = 실수령 입력분만
    const divCash = divCashBasis === 'received' ? divReceived : (divCashBasis === 'paid' ? divPaid : totalDiv);
    const cash = principal - totalBuyAmount - totalBuyFee + totalSellAmount - totalSellFee + divCash;
    const cashByTarget = P - totalMV;                          // 엑셀 원본 종합!H30
    const totalAssets = totalMV + cash;                        // 실제 총자산
    const totalDayPL = sum(computed, (c) => c.dayPL);
    const prevMV = totalMV - totalDayPL;
    const totalDayRate = div(totalDayPL, prevMV);
    const annualDivTotal = sum(computed, (c) => c.annualDiv);  // G56
    const cumDivTotal = sum(computed, (c) => c.cumDiv);        // I56
    const safeCost = sum(computed.filter((c) => c.isSafe || c.irpClass === '안전자산'), (c) => c.cost); // P31
    const safeRatio = div(safeCost, P);                        // Q31

    const targetSumAll = sum(computed, (c) => c.targetAmount);
    // 종목별 비중
    computed.forEach((c) => {
      c.wTotal = div(c.mv, totalAssets);                       // 전체 비중 = 평가금액 ÷ 실제 총자산
      c.w400 = div(c.mv, P);                                   // O (엑셀 원본: ÷ 목표총액)
      c.wInv = div(c.mv, totalMV);                             // P
      c.targetW = div(c.targetAmount, targetSumAll);            // Q — 목표금액 합계 대비
      c.targetWOfTotal = div(c.targetAmount, P);
      c.addBuyByMV = Math.max(c.targetAmount - c.mv, 0);       // 목표비중 H (표준)
      c.addBuyByCost = Math.max(c.targetAmount - c.cost, 0);   // 종합 S (원본, 일부 행 오류)
      c.achievement = div(c.mv, c.targetAmount);               // 목표 달성률
      c.cumDivYieldOnCost = div(c.cumDiv, c.cost);
    });

    const rebal = computeRebalance(computed, P, cash, totalAssets);
    const fwd12 = next12Months(computed, today);
    const annualDivRate = div(annualDivTotal, totalMV);
    const fwd12Rate = div(fwd12.grandTotal, totalMV);

    return {
      today, meta: state.meta, computed,
      totals: {
        totalCost, totalMV, totalPL, totalPLR, totalDiv, totalRealized, totalRealizedCost,
        totalRealizedR, totalCombined, totalCombinedR, portfolioTarget: P,
        principal, cash, cashByTarget, totalAssets,
        totalBuyAmount, totalBuyFee, totalSellAmount, totalSellFee,
        divCash, divCashBasis, divReceived, divPaid, divPendingPay,
        totalDivAccrued: totalDiv,
        // 검산: 총자산 = 납입원금 + 총손익 − 매수수수료 − (합산손익에 잡혔지만 아직 미입금인 배당)
        reconcile: (principal + totalCombined - totalBuyFee - (totalDiv - divCash)) - totalAssets,
        totalDayPL, totalDayRate, annualDivTotal, cumDivTotal, annualDivRate,
        fwd12Total: fwd12.grandTotal, fwd12Rate,
        safeCost, safeRatio,
        invRatio: div(totalMV, totalAssets), cashRatio: div(cash, totalAssets),
        invRatioTarget: div(totalMV, P), cashRatioTarget: div(cashByTarget, P),
        cumDivYield: div(totalDiv, totalCost),
      },
      rebal, fwd12,
    };
  }

  /* ---------------------------------------------------------------------
   * 6-B. ETF 구성종목 Look-through
   *   각 ETF 가 담고 있는 개별 종목을 뚫고 내려가(look-through) 실제로 내가
   *   얼마나 들고 있는지 계산한다. 여러 ETF 에 겹치는 종목은 하나로 합산한다.
   *     실질 보유금액 = Σ (ETF 평가금액 × 그 ETF 내 구성비중)
   * ------------------------------------------------------------------- */
  /** 구성종목 중 "현금" 성격 항목인지 판별 — 표에서는 값과 무관하게 항상 맨 아래로 보낸다.
   *  (2026-08-11: ETF체크 등에서 "원화현금" 은 ISIN 이 KRD 로 시작하는 특수 슬롯으로 내려옴) */
  function isCashHolding(h) {
    if (!h) return false;
    const nm = String((h && h.name) || '').replace(/\s+/g, '');
    if (/현금|예수금|미분류|^cash$/i.test(nm)) return true;
    const code = String((h && h.code) || '').trim();
    if (/^KRD/i.test(code)) return true;
    return false;
  }
  /** 2026-08-12: 시세가 원화가 아니라 달러(등 외화)로 내려오는 종목인지 — 서버 쪽 국내코드
   *  판정 규칙(DomesticCodeRe/DOMESTIC_CODE_RE = 정확히 6자리 영숫자)과 동일하게, 이 형식이
   *  아니면 해외 티커로 본다. 현재가를 원화로 환산해 보여줄지 판단하는 데 쓴다. */
  function isForeignCode(code) {
    const c = String(code || '').trim();
    return !!c && !/^[0-9A-Za-z]{6}$/.test(c);
  }
  /** 2026-08-12: 구성종목 하나가 주식/채권/파생/현금 중 무엇인지 — 회사명을 미리 외워둔 표로
   *  판정하지 않고(새 종목이 나와도 그대로 맞아야 하므로), 이름·코드에 실제로 나타나는
   *  "객관적으로 확인 가능한 표기 규칙"만으로 판단한다.
   *    · 파생(스왑/선물/옵션) — 이름에 "스왑/SWAP", "E-MINI", "FUTURE(S)", "월+4자리 연도" 만기,
   *      "옵션/OPTION/콜/풋/CALL/PUT" 표기가 있으면 — 채권 판정보다 먼저 확인해야 함
   *      (스왑은 code 필드가 한글이라 자칫 "국내채권" 규칙에 걸릴 수 있어 순서가 중요).
   *    · 채권(해외) — "<티커> <쿠폰금리> MM/DD/YY" 형태(예: "GOOGL 5.45 11/15/55")는
   *      회사채를 가리키는 표준 표기 규칙이라, 이름만 보고도 확인 가능.
   *    · 채권(국내) — 정식 상장코드/해외 티커라면 code 필드는 항상 영숫자·마침표만으로
   *      돼 있어야 하는데, 비상장 사채는 시세 조회용 코드가 없어 code 필드에 발행기관명+회차
   *      번호(한글)가 그대로 들어간다(예: "SK에너지49-2") — code 에 한글이 섞여 있으면 이 경우.
   *    · 현금 — 기존 isCashHolding 판정을 그대로 재사용(일관성 유지).
   *    · 주식 — 위 어디에도 안 걸리고 code 가 비어있지 않으면(정상적으로 거래되는 티커라는 뜻)
   *      주식/상장ETF 로 분류. 이도 저도 아니면(코드조차 없으면) 미분류.
   */
  function classifyHoldingType(h) {
    if (!h) return '미분류';
    if (isCashHolding(h)) return '현금';
    const name = String(h.name || '').trim();
    const code = String(h.code || '').trim();
    // 2026-08-12: 사용자 실측 데이터(파생 39종목 재현 테스트)로 "E-MINI"가 하이픈 없이
    // "Emini"로도 표기됨을 확인 — 하이픈을 필수로 요구하던 기존 정규식은 "Nasdaq100 Emini
    // 2026 09" 같은 실제 선물 종목명을 못 잡고 "주식"으로 잘못 분류했다. 하이픈을 선택 사항으로
    // 완화한다(자동 테스트로 재현·수정 확인).
    if (/스왑|SWAP|E-?MINI|FUTURES?\b|옵션|OPTION|콜옵션|풋옵션|\bCALL\b|\bPUT\b/i.test(name)) return '파생';
    if (/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|SEPT|OCT|NOV|DEC)\.?\s?20\d{2}\b/i.test(name)) return '파생';
    if (/\d+(?:\.\d+)?\s+\d{1,2}\/\d{1,2}\/\d{2,4}\s*$/.test(name)) return '채권';
    if (/[가-힣]/.test(code)) return '채권';
    // 2026-08-12: FunETF JSON API는 국내 비상장 사채도 (예전 HTML 스크래핑판과 달리) 실제
    // ISIN을 grpItmNo로 내려준다(예: "키움증권8-2" → "KR6039492E36") — 이 경우 code 필드에
    // 더 이상 한글이 섞이지 않아 바로 위 규칙에 안 걸리고 "주식"으로 잘못 분류되는 버그가
    // 실측 확인됨(구분 필터로 "채권"을 골라도 이런 종목들이 안 보여 "필터가 반응 없다"는
    // 것처럼 느껴졌던 원인). 처음엔 "임의 국가 ISIN이면 채권"으로 넣었다가 자동 테스트에서
    // "US46654Q2030"(JPMorgan Nasdaq Equity Premium Income ETF — 실제로는 주식형 ETF) 같은
    // 해외 ISIN까지 채권으로 잘못 묶이는 걸 발견해 "KR"로 시작하는 ISIN(국내)만으로 좁혔다 —
    // 국내 비상장 사채만 이 code 형식(발행기관 코드+회차)을 쓰기 때문에 안전하게 특정 가능.
    if (/^KR[A-Z0-9]{9}[0-9]$/.test(code)) return '채권';
    if (/\b(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|SEPT|OCT|NOV|DEC)\.?\s?20\d{2}\b/i.test(name)) return '파생';
    if (code) return '주식';
    return '미분류';
  }
  /** 비중 내림차순 정렬하되, 현금성 항목은 값과 무관하게 항상 맨 뒤로 */
  function sortHoldings(list) {
    return (list || []).slice().sort((a, b) => {
      const ca = isCashHolding(a), cb = isCashHolding(b);
      if (ca !== cb) return ca ? 1 : -1;
      return n(b.weight) - n(a.weight);
    });
  }

  function lookThrough(computed, totalAssets, cprices, topN) {
    const N = topN || 8;
    const map = {};
    let coveredMV = 0, uncoveredMV = 0, totalMV = 0;
    computed.forEach((c) => {
      const mv = n(c.mv);
      if (mv <= 0) return;
      totalMV += mv;
      const hs = sortHoldings((c.holdings || []).filter((h) => h && h.code && n(h.weight) > 0)).slice(0, N);
      if (!hs.length) { uncoveredMV += mv; return; }
      coveredMV += mv;
      hs.forEach((h) => {
        const code = String(h.code).trim();
        const amt = mv * n(h.weight);
        if (!map[code]) map[code] = { code, name: h.name || code, amount: 0, sources: [] };
        map[code].amount += amt;
        if (!map[code].name && h.name) map[code].name = h.name;
        map[code].sources.push({ etf: c.name, etfId: c.id, weight: n(h.weight), amount: amt });
      });
    });
    const rows = Object.keys(map).map((code) => {
      const r = map[code];
      const px = (cprices && cprices[code]) || null;
      const base = px && px.base ? n(px.base.price) : 0;
      const cur = px ? n(px.price) : 0;
      r.price = cur;
      r.change = px ? n(px.change) : 0;
      r.changeRate = px ? n(px.changeRate) : 0;
      r.basePrice = base;
      r.baseDate = px && px.base ? px.base.date : null;
      r.baseReturn = base > 0 && cur > 0 ? (cur - base) / base : 0;
      r.dayPL = r.price > 0 ? r.amount * r.changeRate / (1 + r.changeRate || 1) : 0;
      r.etfCount = r.sources.length;
      r.wTotal = div(r.amount, totalAssets);
      r.wCovered = div(r.amount, coveredMV);
      r.sources.sort((a, b) => b.amount - a.amount);
      return r;
    }).sort((a, b) => b.amount - a.amount);
    const sumAmt = sum(rows, (r) => r.amount);
    return {
      rows, topN: N,
      uniqueCount: rows.length,
      overlapCount: rows.filter((r) => r.etfCount > 1).length,
      coveredMV, uncoveredMV, totalMV,
      coverage: div(coveredMV, totalMV),
      lookThroughAmount: sumAmt,
      top10Share: div(sum(rows.slice(0, 10), (r) => r.amount), sumAmt),
      dayPL: sum(rows, (r) => r.dayPL),
      etfWithData: computed.filter((c) => (c.holdings || []).length && n(c.mv) > 0).length,
      etfTotal: computed.filter((c) => n(c.mv) > 0).length,
    };
  }

  /* ---------------------------------------------------------------------
   * 7. 거래 통합 조회 (요구사항 §3-F)
   * ------------------------------------------------------------------- */
  function allTransactions(computed) {
    const out = [];
    computed.forEach((c) => {
      (c.buys || []).forEach((b) => out.push({
        id: b.id, instId: c.id, name: c.name, code: c.code, type: '매수',
        date: b.date, qty: n(b.qty), price: n(b.price), amount: n(b.qty) * n(b.price),
        fee: n(b.fee), pl: null, plr: null, memo: b.memo || '',
      }));
      (c.sells || []).forEach((s) => {
        const pl = n(s.qty) * (n(s.price) - c.avg) - n(s.fee);
        out.push({
          id: s.id, instId: c.id, name: c.name, code: c.code, type: '매도',
          date: s.date, qty: n(s.qty), price: n(s.price), amount: n(s.qty) * n(s.price),
          fee: n(s.fee), pl, plr: div(pl, n(s.qty) * c.avg), memo: s.memo || '',
        });
      });
      (c.dividendReceipts || []).forEach((d) => out.push({
        id: d.id, instId: c.id, name: c.name, code: c.code, type: '배당',
        date: d.date, qty: null, price: null, amount: n(d.amount), fee: 0,
        pl: n(d.amount), plr: null, memo: d.memo || '',
        // 2026-08-11: 지급일 지나면 자동 반영되는 배당(가정치 기준)을 화면에서 구분 표시하기 위한 플래그.
        // verified === false 인 것만 "자동추정·미검증"이고, 그 외(수동 등록 · 과거 데이터)는 전부 확인된 것으로 취급.
        auto: !!d.auto, verified: d.verified === false ? false : true,
      }));
    });
    return out.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  }

  /* ---------------------------------------------------------------------
   * 8. 입력값 검증 (요구사항 §5)
   * ------------------------------------------------------------------- */
  function validateTrade(t, existing, type) {
    const errs = [];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(t.date || ''))) errs.push('거래일 형식이 올바르지 않습니다 (YYYY-MM-DD).');
    if (!(n(t.qty) > 0)) errs.push('수량은 0보다 커야 합니다.');
    if (!(n(t.price) > 0)) errs.push('단가는 0보다 커야 합니다.');
    if (n(t.fee) < 0) errs.push('수수료는 음수일 수 없습니다.');
    const dup = (existing || []).some((x) => x.id !== t.id && x.date === t.date && n(x.qty) === n(t.qty) && n(x.price) === n(t.price));
    if (dup) errs.push('동일 날짜·수량·단가의 거래가 이미 있습니다 (중복 가능성).');
    return errs;
  }
  function validateDividend(d, existing) {
    const errs = [];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(d.date || ''))) errs.push('지급일 형식이 올바르지 않습니다 (YYYY-MM-DD).');
    if (!(n(d.amount) > 0)) errs.push('수령금액은 0보다 커야 합니다.');
    const dup = (existing || []).some((x) => x.id !== d.id && x.date === d.date && n(x.amount) === n(d.amount));
    if (dup) errs.push('동일 지급일·금액의 배당 내역이 이미 있습니다 (중복 가능성).');
    return errs;
  }

  return {
    n, div, sum, round, rounddown0,
    edate, eomonth, addDays, diffDays, datedifM, ymKey, monthOf, yearOf, todayISO, parseISO, toISO,
    buyTotals, avgCost, sellTotals, sharesAsOf, buildSchedule, payoutMonths, cumulativeDividend,
    computeInstrument, computeRebalance, next12Months, actualMonthlyDividends, longTerm, computePortfolio, lookThrough,
    isCashHolding, sortHoldings, classifyHoldingType, isForeignCode,
    allTransactions, validateTrade, validateDividend, SCENARIOS,
  };
});

</script>
<script>
/* =========================================================================
 * IRP 포트폴리오 관리 대시보드 — 애플리케이션 (app.js)
 * 외부 의존성 0. 순수 브라우저 JS + 자체 SVG 차트.
 * ========================================================================= */
'use strict';
const K = IRPCalc;

/* ===================== 0. 포맷터 ===================== */
const FMT = {
  won(v, dec) { const x = K.n(v); return x.toLocaleString('ko-KR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }) + '원'; },
  won0(v) { return Math.round(K.n(v)).toLocaleString('ko-KR') + '원'; },
  amt(v) { return Math.round(K.n(v)).toLocaleString('ko-KR'); },
  amtS(v) { const x = Math.round(K.n(v)); return (x > 0 ? '+' : '') + x.toLocaleString('ko-KR'); },
  eok(v) {
    const x = K.n(v);
    if (Math.abs(x) >= 1e8) return (x / 1e8).toFixed(2) + '억';
    if (Math.abs(x) >= 1e4) return Math.round(x / 1e4).toLocaleString('ko-KR') + '만';
    return Math.round(x).toLocaleString('ko-KR');
  },
  eokW(v) { return FMT.eok(v) + '원'; },
  qty(v) { return K.n(v).toLocaleString('ko-KR') + '주'; },
  qtyN(v) { return K.n(v).toLocaleString('ko-KR'); },
  price(v) { return Math.round(K.n(v)).toLocaleString('ko-KR'); },
  pct(v, d) { return (K.n(v) * 100).toFixed(d === undefined ? 2 : d) + '%'; },
  pctS(v, d) { const x = K.n(v) * 100; return (x > 0 ? '+' : '') + x.toFixed(d === undefined ? 2 : d) + '%'; },
  date(v) { return v ? String(v).slice(0, 10) : '-'; },
  dt(v) { if (!v) return '-'; const s = String(v).replace('T', ' '); return s.slice(0, 19); },
  ym(v) { if (!v) return '-'; const p = String(v).slice(0, 7).split('-'); return p[0] + '년 ' + parseInt(p[1], 10) + '월'; },
  ymS(v) { if (!v) return '-'; return String(v).slice(2, 7).replace('-', '.'); },
};
const sgn = (v) => (K.n(v) > 0 ? 'up' : K.n(v) < 0 ? 'down' : 'flat');
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const uid = (p) => (p || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ===================== 1. 저장소 (IndexedDB + localStorage 폴백) ===================== */
const VIEWER_MODE = (typeof VIEWER !== 'undefined' && VIEWER === true);
const CAN_EDIT = !VIEWER_MODE;
/** 편집 가능할 때만 컨트롤을 내보내고, 열람 모드에서는 값만 표시 */
function ed(html, readonlyHtml) { return CAN_EDIT ? html : (readonlyHtml === undefined ? '' : readonlyHtml); }

const DB = (function () {
  const NAME = VIEWER_MODE ? 'irp_portfolio_viewer_db' : 'irp_portfolio_db', VER = 1, STORE = 'kv';
  let db = null, useLS = false;
  function open() {
    return new Promise((res) => {
      if (db) return res(db);
      if (!window.indexedDB) { useLS = true; return res(null); }
      let rq;
      try { rq = indexedDB.open(NAME, VER); } catch (e) { useLS = true; return res(null); }
      rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
      rq.onsuccess = () => { db = rq.result; res(db); };
      rq.onerror = () => { useLS = true; res(null); };
      setTimeout(() => { if (!db) { useLS = true; res(null); } }, 2500);
    });
  }
  async function get(k) {
    await open();
    if (useLS || !db) { try { const v = localStorage.getItem(NAME + ':' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    return new Promise((res) => {
      try {
        const tx = db.transaction(STORE, 'readonly').objectStore(STORE).get(k);
        tx.onsuccess = () => res(tx.result === undefined ? null : tx.result);
        tx.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  }
  async function set(k, v) {
    await open();
    if (useLS || !db) { try { localStorage.setItem(NAME + ':' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
    return new Promise((res) => {
      try {
        const tx = db.transaction(STORE, 'readwrite').objectStore(STORE).put(v, k);
        tx.onsuccess = () => res(true); tx.onerror = () => res(false);
      } catch (e) { res(false); }
    });
  }
  async function del(k) {
    await open();
    if (useLS || !db) { localStorage.removeItem(NAME + ':' + k); return; }
    try { db.transaction(STORE, 'readwrite').objectStore(STORE).delete(k); } catch (e) {}
  }
  return { get, set, del, mode: () => (useLS ? 'localStorage' : 'IndexedDB') };
})();

/* ===================== 2. 정규화 데이터 모델 ===================== */
/*
 * Instruments        : 종목 마스터 (id, sheet, name, code, desc, isPlaceholder)
 * Holdings           : 파생(계산) — 별도 저장하지 않고 계산 엔진이 산출
 * BuyTransactions    : inst.buys[]
 * SellTransactions   : inst.sells[]
 * DividendReceipts   : inst.dividendReceipts[]
 * PriceSnapshots     : state.prices{code} + state.priceHistory[]
 * AllocationTargets  : inst.target{targetAmount,irpClass,group,category,currency}
 * CashBalances       : state.meta.portfolioTarget 및 파생 cash (= 목표총액 − 평가금액합)
 * DividendAssumptions: inst.dividend{cycle,payMonthsText,freq,perShare,nextExDate,nextPayDate}
 * LongTermScenarios  : state.scenario{...}
 * AuditLogs          : state.audit[]
 */
const Store = {
  state: null, view: null, dirty: false,
  seed() {
    const s = JSON.parse(JSON.stringify(SEED));
    return {
      schemaVersion: 1,
      meta: Object.assign({ contributedPrincipal: s.meta.portfolioTarget }, s.meta),
      instruments: s.instruments.map((i) => ({
        id: i.id, sheet: i.sheet, name: i.name, code: i.code, desc: i.desc,
        isPlaceholder: i.isPlaceholder, growth: i.growth, isSafe: i.isSafe,
        buys: i.buys, sells: i.sells, dividendReceipts: i.dividendReceipts,
        dividend: i.dividend, target: i.target, holdings: i.holdings || [],
      })),
      prices: s.prices,
      priceHistory: [], constituentPrices: {},
      tickers: s.tickers,
      tradeLog: s.tradeLog,
      scenario: { scenario: 'base', reinvestRate: 0, extraContribution: 0, withdrawal: 0, livingCost: 3000000, startYear: 2026, endYear: 2050, excelMonthlyMode: false },
      settings: { theme: 'light',
        proxyUrl: (VIEWER_MODE && typeof BUILD_META !== 'undefined' && BUILD_META && BUILD_META.syncUrl) ? (BUILD_META.syncUrl + '/api/price?codes={codes}') : '',
        autoRefresh: false, baseDateMode: 'today', baseDate: K.todayISO(),
        dividendCashBasis: 'confirmed', weightBase: 'assets',
        syncEnabled: !!(VIEWER_MODE && typeof BUILD_META !== 'undefined' && BUILD_META && BUILD_META.sync),
        syncUrl: (VIEWER_MODE && typeof BUILD_META !== 'undefined' && BUILD_META && BUILD_META.syncUrl) || '',
        syncInterval: (VIEWER_MODE && typeof BUILD_META !== 'undefined' && BUILD_META && BUILD_META.syncInterval) || 15,
        adminToken: '' },
      audit: [{ ts: new Date().toISOString(), kind: '초기화', target: '전체', before: null, after: null, memo: '원본 엑셀 초기 데이터 적재' }],
      snapshots: [],
    };
  },
  async load() {
    const saved = await DB.get('state');
    if (VIEWER_MODE) {
      // 열람 모드: 포트폴리오 데이터는 항상 파일에 박힌 값을 쓰고 저장하지 않는다.
      //            현재가·시뮬레이션 가정·화면 설정만 로컬에 유지한다.
      this.state = this.seed();
      if (saved) {
        if (saved.prices) Object.keys(saved.prices).forEach((k) => { if (this.state.prices[k]) this.state.prices[k] = saved.prices[k]; });
        if (saved.scenario) this.state.scenario = Object.assign(this.state.scenario, saved.scenario);
        if (saved.settings) this.state.settings = Object.assign(this.state.settings, saved.settings);
        this.state.savedAt = saved.savedAt;
      }
    } else {
      this.state = saved && saved.schemaVersion ? saved : this.seed();
    }
    // 신규 필드 마이그레이션
    const d = this.seed();
    ['scenario', 'settings'].forEach((k) => { this.state[k] = Object.assign({}, d[k], this.state[k] || {}); });
    if (this.state.meta.contributedPrincipal === undefined || this.state.meta.contributedPrincipal === null) {
      this.state.meta.contributedPrincipal = K.n(this.state.meta.portfolioTarget);
    }
    if (!this.state.priceHistory) this.state.priceHistory = [];
    if (!this.state.constituentPrices) this.state.constituentPrices = {};
    this.state.instruments.forEach((i) => { if (!i.holdings) i.holdings = []; });
    // 2026-08-11: 맥쿼리인프라는 ETF가 아니라 개별 상장 인프라펀드라 NAV 개념이 없음.
    // Price.refresh() 는 이제 이 종목의 NAV 를 조회하지 않지만, 이 수정 이전에 저장된 기존 데이터에는
    // 예전에 잘못 채워진 NAV 값이 남아 있을 수 있으므로 매 로드 시 확실히 지운다.
    this.state.instruments.filter((i) => i.sheet === '맥쿼리인프라').forEach((i) => {
      const p = this.state.prices[i.code];
      if (p) { p.nav = null; p.navSource = null; p.navRealtime = false; p.navStale = false; p.navOfficial = false; p.navAsOf = ''; }
    });
    if (!this.state.snapshots) this.state.snapshots = [];
    if (!this.state.audit) this.state.audit = [];
    this.recompute();
  },
  async save() {
    this.state.savedAt = new Date().toISOString();
    if (VIEWER_MODE) {
      await DB.set('state', { schemaVersion: 1, viewer: true, savedAt: this.state.savedAt,
        prices: this.state.prices, scenario: this.state.scenario, settings: this.state.settings });
      return;
    }
    await DB.set('state', this.state);
  },
  baseDate() {
    const st = this.state.settings;
    return st.baseDateMode === 'fixed' && st.baseDate ? st.baseDate : K.todayISO();
  },
  recompute() {
    this.view = K.computePortfolio({
      meta: this.state.meta, instruments: this.state.instruments,
      prices: this.state.prices, baseDate: this.baseDate(),
      settings: this.state.settings,
    });
    this.view.longTerm = K.longTerm(this.view.computed, this.view.rebal.rows, this.state.scenario);
    this.view.tx = K.allTransactions(this.view.computed);
  },
  log(kind, target, before, after, memo) {
    this.state.audit.unshift({ ts: new Date().toISOString(), kind, target, before, after, memo: memo || '' });
    if (this.state.audit.length > 500) this.state.audit.length = 500;
  },
  async commit(kind, target, before, after, memo) {
    if (kind) this.log(kind, target, before, after, memo);
    this.recompute();
    await this.save();
    Router.render();
    // 관리자 파일에서 데이터가 바뀌면 열람자 화면에 자동 반영
    if (kind && !VIEWER_MODE && typeof Sync !== 'undefined') Sync.schedulePush();
  },
  inst(id) { return this.state.instruments.find((i) => i.id === id); },
  cinst(id) { return this.view.computed.find((c) => c.id === id); },
  async snapshot(label) {
    const snap = { id: uid('snap'), ts: new Date().toISOString(), label: label || '자동 백업', data: JSON.stringify({ meta: this.state.meta, instruments: this.state.instruments, prices: this.state.prices, scenario: this.state.scenario }) };
    this.state.snapshots.unshift(snap);
    if (this.state.snapshots.length > 20) this.state.snapshots.length = 20;
    await this.save();
    return snap;
  },
};

/* ===================== 3. 토스트 / 모달 ===================== */
function toast(msg, kind) {
  let box = $('.toast'); if (!box) { box = document.createElement('div'); box.className = 'toast'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = kind || ''; el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 320); }, 2600);
}
function modal(title, bodyHtml, buttons, onReady) {
  return new Promise((res) => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal"><header><h3>' + esc(title) + '</h3></header><div class="mb">' + bodyHtml + '</div><footer></footer></div>';
    const foot = $('footer', bg);
    (buttons || [{ label: '닫기', value: null }]).forEach((b) => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (b.cls || ''); btn.textContent = b.label;
      btn.onclick = () => {
        if (b.collect) { const v = b.collect(bg); if (v === false) return; bg.remove(); res(v); }
        else { bg.remove(); res(b.value); }
      };
      foot.appendChild(btn);
    });
    bg.onclick = (e) => { if (e.target === bg) { bg.remove(); res(null); } };
    document.body.appendChild(bg);
    if (onReady) { try { onReady(bg); } catch (e) { console.error(e); } }
    const f = $('input,select,textarea', bg); if (f) f.focus();
  });
}
async function confirmBox(title, msg, danger) {
  const r = await modal(title, '<div style="font-size:13.5px;line-height:1.8">' + msg + '</div>',
    [{ label: '취소', value: false }, { label: '확인', value: true, cls: danger ? 'dgr' : 'pri' }]);
  return r === true;
}

/* ===================== 4. SVG 차트 라이브러리 (자체 구현) ===================== */
const PALETTE = ['#1f5fbf', '#2e9e6b', '#d4842a', '#8e5bc4', '#c0455e', '#1a9aa8', '#7a8b3f', '#c96a1f', '#4a5fa8', '#b0417f',
  '#3f8f5c', '#a5763a', '#6b5fc0', '#c05a45', '#2b7f9e', '#8a9440', '#9c4fa0', '#5a7fb5', '#b8703a', '#3d9c85', '#8a5a90'];
const Chart = {
  esc, 
  _wrap(w, h, inner, extra) {
    return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid meet" role="img" ' + (extra || '') + '>' + inner + '</svg>';
  },
  /** 도넛차트 */
  donut(data, opts) {
    const o = Object.assign({ size: 210, thick: 34, center: '', centerSub: '', legend: true, max: 12 }, opts || {});
    let items = data.filter((d) => K.n(d.value) > 0).sort((a, b) => b.value - a.value);
    if (items.length > o.max) {
      const head = items.slice(0, o.max - 1), tail = items.slice(o.max - 1);
      items = head.concat([{ label: '기타 ' + tail.length + '종목', value: K.sum(tail, (t) => t.value) }]);
    }
    const total = K.sum(items, (i) => i.value);
    const S = o.size, R = S / 2 - 4, r = R - o.thick, cx = S / 2, cy = S / 2;
    if (total <= 0) return '<div class="empty">표시할 데이터가 없습니다</div>';
    let a0 = -Math.PI / 2, paths = '';
    items.forEach((it, i) => {
      const frac = it.value / total, a1 = a0 + frac * Math.PI * 2;
      const big = frac > 0.5 ? 1 : 0;
      const col = it.color || PALETTE[i % PALETTE.length];
      const p = ['M', cx + R * Math.cos(a0), cy + R * Math.sin(a0),
        'A', R, R, 0, big, 1, cx + R * Math.cos(a1), cy + R * Math.sin(a1),
        'L', cx + r * Math.cos(a1), cy + r * Math.sin(a1),
        'A', r, r, 0, big, 0, cx + r * Math.cos(a0), cy + r * Math.sin(a0), 'Z'].join(' ');
      paths += '<path d="' + p + '" fill="' + col + '" opacity=".92"><title>' + esc(it.label) + ' · ' + FMT.eokW(it.value) + ' (' + FMT.pct(frac, 1) + ')</title></path>';
      a0 = a1;
    });
    let center = '';
    if (o.center) center = '<text x="' + cx + '" y="' + (cy - (o.centerSub ? 5 : -4)) + '" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--tx)">' + esc(o.center) + '</text>';
    if (o.centerSub) center += '<text x="' + cx + '" y="' + (cy + 13) + '" text-anchor="middle" style="font-size:10.5px;fill:var(--tx3)">' + esc(o.centerSub) + '</text>';
    const svg = this._wrap(S, S, paths + center, 'style="max-width:' + S + 'px"');
    if (!o.legend) return svg;
    const lg = '<div class="chlegend">' + items.map((it, i) =>
      '<span><i style="background:' + (it.color || PALETTE[i % PALETTE.length]) + '"></i>' + esc(it.label.length > 20 ? it.label.slice(0, 19) + '…' : it.label) + ' ' + FMT.pct(it.value / total, 1) + '</span>').join('') + '</div>';
    return '<div>' + svg + lg + '</div>';
  },
  /** 가로 막대 (종목 라벨이 긴 경우) */
  hbar(data, opts) {
    const o = Object.assign({ w: 640, rowH: 22, labelW: 210, fmt: FMT.eokW, colorFn: null, zeroLine: false }, opts || {});
    if (!data.length) return '<div class="empty">표시할 데이터가 없습니다</div>';
    const h = data.length * o.rowH + 26;
    const vals = data.map((d) => K.n(d.value));
    const maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
    const span = (maxV - minV) || 1;
    const x0 = o.labelW, bw = o.w - o.labelW - 88;
    const zx = x0 + (0 - minV) / span * bw;
    let s = '';
    data.forEach((d, i) => {
      const y = i * o.rowH + 6, v = K.n(d.value);
      const vx = x0 + (v - minV) / span * bw;
      const bx = Math.min(zx, vx), bwid = Math.max(1.5, Math.abs(vx - zx));
      const col = d.color || (o.colorFn ? o.colorFn(d) : (v < 0 ? 'var(--down)' : PALETTE[i % PALETTE.length]));
      s += '<text x="' + (x0 - 7) + '" y="' + (y + o.rowH / 2 + 1) + '" text-anchor="end" style="font-size:10.5px">' + esc(d.label.length > 26 ? d.label.slice(0, 25) + '…' : d.label) + '</text>';
      s += '<rect x="' + bx + '" y="' + (y + 3) + '" width="' + bwid + '" height="' + (o.rowH - 9) + '" rx="2.5" fill="' + col + '" opacity=".88"><title>' + esc(d.label) + ': ' + o.fmt(v) + '</title></rect>';
      s += '<text x="' + (Math.max(vx, zx) + 6) + '" y="' + (y + o.rowH / 2 + 1) + '" class="lbl-v">' + esc(o.fmt(v)) + '</text>';
    });
    if (minV < 0 || o.zeroLine) s += '<line class="axis" x1="' + zx + '" y1="2" x2="' + zx + '" y2="' + (h - 20) + '"/>';
    return this._wrap(o.w, h, s);
  },
  /** 그룹 세로 막대 (현재 vs 목표 등) */
  gbar(cats, series, opts) {
    const o = Object.assign({ w: 720, h: 260, fmt: FMT.eokW, rotate: true, pad: 44 }, opts || {});
    if (!cats.length) return '<div class="empty">표시할 데이터가 없습니다</div>';
    const L = 56, R = 8, T = 12, B = o.rotate ? 96 : 30;
    const pw = o.w - L - R, ph = o.h - T - B;
    let maxV = 0; series.forEach((s) => s.data.forEach((v) => { maxV = Math.max(maxV, K.n(v)); }));
    maxV = maxV || 1;
    const nice = Math.pow(10, Math.floor(Math.log10(maxV)));
    const top = Math.ceil(maxV / nice * 1.05) * nice;
    const gw = pw / cats.length, bw = Math.min(26, (gw - 8) / series.length);
    let s = '';
    for (let i = 0; i <= 4; i++) {
      const y = T + ph - ph * i / 4, v = top * i / 4;
      s += '<line class="grid" x1="' + L + '" y1="' + y + '" x2="' + (L + pw) + '" y2="' + y + '"/>';
      s += '<text x="' + (L - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + esc(FMT.eok(v)) + '</text>';
    }
    cats.forEach((c, i) => {
      const gx = L + i * gw + (gw - bw * series.length) / 2;
      series.forEach((se, j) => {
        const v = K.n(se.data[i]), bh = Math.max(0, v / top * ph);
        s += '<rect x="' + (gx + j * bw) + '" y="' + (T + ph - bh) + '" width="' + (bw - 2) + '" height="' + bh + '" rx="2" fill="' + se.color + '" opacity=".9"><title>' + esc(c) + ' · ' + esc(se.label) + ': ' + o.fmt(v) + '</title></rect>';
      });
      const lx = L + i * gw + gw / 2, ly = T + ph + 10;
      const txt = esc(c.length > 16 ? c.slice(0, 15) + '…' : c);
      s += o.rotate
        ? '<text x="' + lx + '" y="' + ly + '" transform="rotate(-42 ' + lx + ' ' + ly + ')" text-anchor="end" style="font-size:9.5px">' + txt + '</text>'
        : '<text x="' + lx + '" y="' + (ly + 4) + '" text-anchor="middle">' + txt + '</text>';
    });
    s += '<line class="axis" x1="' + L + '" y1="' + (T + ph) + '" x2="' + (L + pw) + '" y2="' + (T + ph) + '"/>';
    const lg = '<div class="chlegend">' + series.map((se) => '<span><i style="background:' + se.color + '"></i>' + esc(se.label) + '</span>').join('') + '</div>';
    return '<div>' + this._wrap(o.w, o.h, s) + lg + '</div>';
  },
  /** 라인/영역 차트 */
  line(cats, series, opts) {
    const o = Object.assign({ w: 720, h: 260, fmt: FMT.eokW, area: false, everyX: 1 }, opts || {});
    if (!cats.length) return '<div class="empty">표시할 데이터가 없습니다</div>';
    const L = 60, R = 10, T = 12, B = 34;
    const pw = o.w - L - R, ph = o.h - T - B;
    let maxV = 0, minV = 0;
    series.forEach((s) => s.data.forEach((v) => { maxV = Math.max(maxV, K.n(v)); minV = Math.min(minV, K.n(v)); }));
    maxV = maxV || 1;
    const nice = Math.pow(10, Math.floor(Math.log10(Math.max(1, maxV))));
    const top = Math.ceil(maxV / nice * 1.05) * nice, bot = minV < 0 ? Math.floor(minV / nice) * nice : 0;
    const X = (i) => L + (cats.length === 1 ? pw / 2 : i / (cats.length - 1) * pw);
    const Y = (v) => T + ph - (K.n(v) - bot) / ((top - bot) || 1) * ph;
    let s = '';
    for (let i = 0; i <= 4; i++) {
      const y = T + ph - ph * i / 4, v = bot + (top - bot) * i / 4;
      s += '<line class="grid" x1="' + L + '" y1="' + y + '" x2="' + (L + pw) + '" y2="' + y + '"/>';
      s += '<text x="' + (L - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + esc(FMT.eok(v)) + '</text>';
    }
    series.forEach((se) => {
      const pts = se.data.map((v, i) => X(i) + ',' + Y(v));
      if (o.area) s += '<polygon points="' + (X(0) + ',' + Y(bot) + ' ' + pts.join(' ') + ' ' + X(cats.length - 1) + ',' + Y(bot)) + '" fill="' + se.color + '" opacity=".12"/>';
      s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + se.color + '" stroke-width="2" stroke-linejoin="round"/>';
      se.data.forEach((v, i) => { s += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="2.6" fill="' + se.color + '"><title>' + esc(cats[i]) + ' · ' + esc(se.label) + ': ' + o.fmt(v) + '</title></circle>'; });
    });
    cats.forEach((c, i) => { if (i % o.everyX === 0 || i === cats.length - 1) s += '<text x="' + X(i) + '" y="' + (T + ph + 15) + '" text-anchor="middle">' + esc(c) + '</text>'; });
    s += '<line class="axis" x1="' + L + '" y1="' + (T + ph) + '" x2="' + (L + pw) + '" y2="' + (T + ph) + '"/>';
    const lg = '<div class="chlegend">' + series.map((se) => '<span><i style="background:' + se.color + '"></i>' + esc(se.label) + '</span>').join('') + '</div>';
    return '<div>' + this._wrap(o.w, o.h, s) + lg + '</div>';
  },
  /** 100% 누적 가로바 (위험/안전 비중) */
  stack100(items, opts) {
    const o = Object.assign({ w: 640, h: 40 }, opts || {});
    const total = K.sum(items, (i) => i.value) || 1;
    let x = 0, s = '';
    items.forEach((it, i) => {
      const wpx = it.value / total * o.w;
      s += '<rect x="' + x + '" y="6" width="' + Math.max(0, wpx - 1) + '" height="' + (o.h - 16) + '" rx="3" fill="' + (it.color || PALETTE[i]) + '" opacity=".9"><title>' + esc(it.label) + ': ' + FMT.eokW(it.value) + ' (' + FMT.pct(it.value / total, 1) + ')</title></rect>';
      if (wpx > 62) s += '<text x="' + (x + wpx / 2) + '" y="' + (o.h / 2 + 2) + '" text-anchor="middle" style="fill:#fff;font-size:10.5px;font-weight:700">' + esc(it.label) + ' ' + FMT.pct(it.value / total, 1) + '</text>';
      x += wpx;
    });
    return this._wrap(o.w, o.h, s);
  },
};

/* ===================== 5. 데이터 테이블 컴포넌트 ===================== */
const TableState = {};
function tstate(id, cfg) {
  if (!TableState[id]) {
    const saved = (Store.state.settings.tables || {})[id] || {};
    const d = cfg || {};
    TableState[id] = {
      sort: saved.sort !== undefined ? saved.sort : (d.defaultSort ? d.defaultSort.k : null),
      dir: saved.dir || (d.defaultSort ? d.defaultSort.dir : 'desc'),
      q: '',
      hidden: saved.hidden || (d.defaultHidden ? d.defaultHidden.slice() : []),
      filters: Object.assign({}, d.defaultFilters || {}, saved.filters || {}),
      group: saved.group !== undefined ? saved.group : (d.groupBy ? true : false),
      order: saved.order || null,      // 사용자가 드래그로 바꾼 컬럼 순서 (컬럼 key 배열)
      widths: saved.widths || {},      // 사용자가 조절한 컬럼 너비 { key: px }
      menu: false,
    };
  }
  return TableState[id];
}
function tpersist(id) {
  const st = TableState[id];
  Store.state.settings.tables = Store.state.settings.tables || {};
  Store.state.settings.tables[id] = { sort: st.sort, dir: st.dir, hidden: st.hidden, filters: st.filters, group: st.group, order: st.order, widths: st.widths };
  Store.save();
}
/**
 * cols: {k,label,cls,val(row),fmt(row,val),sticky,hideable,tip,srcClass}
 */
function DataTable(cfg) {
  const id = cfg.id, st = tstate(id, cfg);
  // 2026-08-12: 위임(delegation) 방식 포인터 핸들러(너비조절/컬럼순서변경)가 렌더 시점과 무관하게
  // 항상 최신 cfg 를 찾을 수 있도록, TableState(렌더마다 초기화되지 않고 계속 남아있음)에 cfg 를
  // 같이 저장해둔다. REG 는 Router.render() 때마다 비워지므로 그 시점의 cfg 를 참조할 수 없다.
  st.__cfg = cfg;
  cfg.cols = cfg.cols.filter((c) => !c.hide);
  // 사용자가 드래그로 바꾼 컬럼 순서(st.order)를 적용 — 정의에 없거나 새로 추가된 컬럼은 뒤에 붙인다
  if (st.order && st.order.length) {
    const byKey = {}; cfg.cols.forEach((c) => { byKey[c.k] = c; });
    const seen = {};
    const ordered = st.order.map((k) => byKey[k]).filter((c) => { if (!c || seen[c.k]) return false; seen[c.k] = true; return true; });
    cfg.cols.forEach((c) => { if (!seen[c.k]) { ordered.push(c); seen[c.k] = true; } });
    cfg.cols = ordered;
  }
  const cols = cfg.cols.filter((c) => st.hidden.indexOf(c.k) < 0);
  let rows = cfg.rows.slice();
  // 검색
  if (st.q) {
    const q = st.q.toLowerCase();
    rows = rows.filter((r) => cfg.cols.some((c) => String(c.val ? c.val(r) : r[c.k]).toLowerCase().indexOf(q) >= 0));
  }
  // 필터
  (cfg.filters || []).forEach((f) => { const v = st.filters[f.k]; if (v && v !== '__all__') rows = rows.filter((r) => f.test(r, v)); });
  const totalBefore = cfg.rows.length;
  // 기본 숨김 규칙 (예: 목표금액 0 종목)
  const hideRule = cfg.hideRule;
  let hiddenRows = [];
  if (hideRule && st.filters.__showAll !== 'on') {
    hiddenRows = rows.filter((r) => hideRule.test(r));
    rows = rows.filter((r) => !hideRule.test(r));
  }
  const hiddenByRule = hiddenRows.length;
  const allRows = rows.concat(hiddenRows);        // 합계는 숨긴 행까지 포함해야 KPI 와 맞는다
  // 정렬
  const grouping = !!(cfg.groupBy && st.group);
  const sortCmp = (() => {
    const c = st.sort ? cfg.cols.find((x) => x.k === st.sort) : null;
    if (!c) return null;
    const m = st.dir === 'asc' ? 1 : -1;
    return (a, b) => {
      const x = c.val ? c.val(a) : a[c.k], y = c.val ? c.val(b) : b[c.k];
      if (typeof x === 'number' && typeof y === 'number') return (x - y) * m;
      return String(x).localeCompare(String(y), 'ko') * m;
    };
  })();
  if (sortCmp) rows.sort(sortCmp);
  if (grouping) {
    const ord = cfg.groupBy.order || [];
    const gi = (r) => { const k = cfg.groupBy.key(r); const i = ord.indexOf(k); return i < 0 ? ord.length : i; };
    rows.sort((a, b) => { const d = gi(a) - gi(b); if (d) return d; return sortCmp ? sortCmp(a, b) : 0; });
  }
  // 값·정렬방향과 무관하게 항상 맨 아래로 보내야 하는 행(예: 현금) — 사용자가 다른 컬럼으로
  // 정렬을 바꿔도 그 규칙이 유지되도록 정렬 이후에 한 번 더 분리해 뒤로 보낸다.
  if (cfg.pinBottom && !grouping) {
    const pinned = [], rest = [];
    rows.forEach((r) => (cfg.pinBottom(r) ? pinned : rest).push(r));
    if (pinned.length) rows = rest.concat(pinned);
  }
  // 2026-08-11: table.dt 는 table-layout:auto 라, 셀에 width/max-width 를 줘도
  // "실제 컬럼 너비"는 그 컬럼의 모든 행 중 가장 넓은 내용물(white-space:nowrap 이라 줄바꿈도 안 됨)에
  // 맞춰 브라우저가 다시 계산해버린다 — 그래서 드래그 중엔(이미 그려진 셀을 직접 style 로 건드리므로)
  // 움직이는 것처럼 보이다가, Router.render() 로 표를 통째로 다시 그리는 순간 원래 폭으로 돌아가
  // "저장이 안 되는 것처럼" 보였다. table-layout:fixed(app.css) 로 바꾸고, 모든 열에 예외 없이
  // width 를 명시해야 그 값이 실제로 유지된다 — 그래서 여기서도 w가 없으면 기본폭으로라도 채운다.
  const DEFW = (c) => (st.widths || {})[c.k] || c.width || 190;
  let stickLeft = 0;
  const head = cols.map((c) => {
    const mark = st.sort === c.k ? '<span class="sortmk">' + (st.dir === 'asc' ? '▲' : '▼') + '</span>' : '';
    const w = DEFW(c);
    const styleParts = ['width:' + w + 'px', 'max-width:' + w + 'px'];
    if (c.sticky) { styleParts.push('left:' + stickLeft + 'px'); stickLeft += w; }
    const style = ' style="' + styleParts.join(';') + '"';
    return '<th class="' + (c.cls || '') + (c.sticky ? ' stick' : '') + '" data-sk="' + c.k + '"' + style + (c.tip ? ' title="' + esc(c.tip) + '"' : '') + '>' +
      '<div class="thwrap"><span class="thlb">' + esc(c.label) + mark + '</span><span class="colrz" data-rk="' + c.k + '" draggable="false" title="드래그해서 너비 조절"></span></div></th>';
  }).join('');
  // pos: 실제 화면에 그려지는 순서(1부터) — 정렬·pinBottom 이 다 반영된 뒤의 위치.
  // "#" 같은 순위 컬럼이 (원래 데이터 순서가 아니라) 진짜 표시 위치를 보여주도록 val/fmt 에 넘겨준다.
  const trOf = (r, ri, pos) => {
    let sl = 0;
    return '<tr data-i="' + ri + '">' + cols.map((c) => {
      const v = c.val ? c.val(r, pos) : r[c.k];
      const w = DEFW(c);
      const styleParts = ['width:' + w + 'px', 'max-width:' + w + 'px', 'overflow:hidden', 'text-overflow:ellipsis'];
      if (c.sticky) { styleParts.push('left:' + sl + 'px'); sl += w; }
      const style = ' style="' + styleParts.join(';') + '"';
      const cls = (c.cls || '') + (c.sticky ? ' stick' : '') + (c.srcClass ? ' ' + c.srcClass : '');
      return '<td class="' + cls + '"' + style + '>' + (c.fmt ? c.fmt(r, v, pos) : esc(v)) + '</td>';
    }).join('') + '</tr>';
  };
  let body = '';
  if (!rows.length) body = '';
  else if (!grouping) body = rows.map((r, ri) => trOf(r, cfg.rows.indexOf(r), ri + 1)).join('');
  else {
    let cur = null;
    rows.forEach((r, ri) => {
      const k = cfg.groupBy.key(r);
      if (k !== cur) {
        cur = k;
        const members = rows.filter((x) => cfg.groupBy.key(x) === k);
        const meta = cfg.groupBy.summary ? cfg.groupBy.summary(members) : '';
        body += '<tr class="grouphd"><td class="l" colspan="' + cols.length + '">' +
          '<span class="gtag ' + (cfg.groupBy.cls ? cfg.groupBy.cls(k) : '') + '">' + esc(k) + '</span>' +
          '<span class="gcnt">' + members.length + '종목</span>' +
          (meta ? '<span class="gmeta">' + meta + '</span>' : '') + '</td></tr>';
      }
      body += trOf(r, cfg.rows.indexOf(r), ri + 1);
    });
  }
  // 숨긴 행을 한 줄로 요약 (실현손익 등이 사라지지 않도록)
  let aggHtml = '';
  if (hiddenRows.length && cfg.aggregate) {
    const a = cfg.aggregate(hiddenRows);
    if (a && a.show) {
      let sl = 0;
      aggHtml = '<tr class="aggrow">' + cols.map((c) => {
        const w = DEFW(c);
        const styleParts = ['width:' + w + 'px', 'max-width:' + w + 'px'];
        if (c.sticky) { styleParts.push('left:' + sl + 'px'); sl += w; }
        return '<td class="' + (c.cls || '') + (c.sticky ? ' stick' : '') + '" style="' + styleParts.join(';') + '">' + (a.cells[c.k] || '') + '</td>';
      }).join('') + '</tr>';
    }
  }
  body += aggHtml;
  let foot = '';
  if (cfg.footer) {
    let sl = 0;
    foot = '<tfoot><tr>' + cols.map((c) => {
      const w = DEFW(c);
      const styleParts = ['width:' + w + 'px', 'max-width:' + w + 'px'];
      if (c.sticky) { styleParts.push('left:' + sl + 'px'); sl += w; }
      return '<td class="' + (c.cls || '') + (c.sticky ? ' stick' : '') + '" style="' + styleParts.join(';') + '">' + (cfg.footer(c, allRows) || '') + '</td>';
    }).join('') + '</tr></tfoot>';
  }
  const filterHtml = (cfg.filters || []).map((f) =>

    { k: 'group', label: '구분' + (CAN_EDIT ? ' ✏️' : ''), cls: 'l', srcClass: CAN_EDIT ? 'src-in' : '', val: (r) => r.group || '',
      fmt: (r, v) => ed('<input type="text" style="width:118px" data-group-name="' + r.id + '" value="' + esc(v) + '" placeholder="구분 입력">', esc(v || '-')) },
    { k: 'name', label: '종목명', cls: 'l', sticky: true, width: 236, hideable: false, val: (r) => r.name,
      fmt: (r, v) => '<a href="#/inst/' + r.id + '" class="nm" style="max-width:' + (r.qty === 0 && r.buyQty > 0 ? 156 : 214) + 'px">' + esc(v) + '</a>' +
        (r.qty === 0 && r.buyQty > 0 ? ' <span class="chip" title="전량 매도해 보유수량은 0이지만 실현손익·배당은 합계에 포함됩니다">전량매도</span>' : '') },
    { k: 'code', label: '종목코드', cls: 'c', val: (r) => r.code || '-' },
    { k: 'irpClass', label: 'IRP', cls: 'c', val: (r) => r.irpClass || '-', fmt: (r, v) => '<span class="chip ' + (v === '안전자산' ? 'safe' : 'risk') + '">' + esc(v === '안전자산' ? '안전' : '위험') + '</span>' },
    { k: 'qty', label: '보유수량', val: (r) => r.qty, fmt: CELL.qty },
    { k: 'avg', label: '보유평단', val: (r) => r.avg, fmt: (r, v) => '<span class="num">' + K.n(v).toLocaleString('ko-KR', { maximumFractionDigits: 2 }) + '</span>' },
    { k: 'cost', label: '취득원가', val: (r) => r.cost, fmt: CELL.money },
    { k: 'price', label: '현재가', val: (r) => r.price, fmt: CELL.price, srcClass: 'src-ex', tip: '외부 연동값(네이버현재가)' },
    { k: 'dayChange', label: '전일대비', val: (r) => r.dayChange, fmt: (r, v) => '<span class="num ' + sgn(v) + '">' + (K.n(v) > 0 ? '▲' : K.n(v) < 0 ? '▼' : '-') + ' ' + FMT.amt(Math.abs(K.n(v))) + '</span>', srcClass: 'src-ex' },
    { k: 'dayChangeRate', label: '금일 등락률', val: (r) => r.dayChangeRate, fmt: CELL.pctS, srcClass: 'src-ex' },
    { k: 'nav', label: 'NAV', val: (r) => K.n((r.priceMeta || {}).nav), srcClass: 'src-ex',
      tip: 'ETF 순자산가치 — 실시간 추정치를 우선 사용하고, 없으면 전일 종가 기준값을 씁니다',
      fmt: (r, v) => v
        ? '<span class="num">' + FMT.price(v) + '</span>' +
          ((r.priceMeta || {}).navStale ? ' <span class="chip warn" title="' + esc((r.priceMeta || {}).navSource || '') + '">전일</span>' : '')
        : '<span style="color:var(--tx3)">-</span>' },
    { k: 'navGap', label: '괴리율', val: (r) => K.div(r.price - K.n((r.priceMeta || {}).nav), K.n((r.priceMeta || {}).nav)),
      tip: '(현재가 − NAV) ÷ NAV',
      fmt: (r, v) => K.n((r.priceMeta || {}).nav) > 0 ? '<span class="num ' + (Math.abs(v) < 0.005 ? 'flat' : v > 0 ? 'up' : 'down') + '">' + FMT.pctS(v) + '</span>' : '<span style="color:var(--tx3)">-</span>' },
    { k: 'mv', label: '평가금액', val: (r) => r.mv, fmt: CELL.money },
    { k: 'pl', label: '평가손익', val: (r) => r.pl, fmt: CELL.moneyS },
    { k: 'plr', label: '평가손익률', val: (r) => r.plr, fmt: CELL.pctS },
    { k: 'cumDiv', label: '누적배당금액', val: (r) => r.cumDiv, fmt: CELL.money },
    { k: 'cumDivYieldOnCost', label: '누적배당수익률', val: (r) => r.cumDivYieldOnCost, fmt: CELL.pct },
    { k: 'realized', label: '누적실현손익', val: (r) => r.realized, fmt: CELL.moneyS },
    { k: 'realizedR', label: '실현손익률', val: (r) => r.realizedR, fmt: CELL.pctS },
    { k: 'combined', label: '합산손익금액', val: (r) => r.combined, fmt: CELL.moneyS },
    { k: 'combinedR', label: '합산수익률', val: (r) => r.combinedR, fmt: CELL.pctS },
    { k: 'wTotal', label: '전체 비중', val: (r) => r.wTotal, fmt: CELL.pct, tip: '실제 총자산(평가금액 + 현금) 대비' },
    { k: 'wInv', label: '투자자산 내 비중', val: (r) => r.wInv, fmt: CELL.pct, tip: '종합!P열 — 평가금액 합계 대비' },
    { k: 'w400', label: '목표총액 대비 비중', val: (r) => r.w400, fmt: CELL.pct, tip: '원본 엑셀 종합!O열 — 목표 총액 대비' },
    { k: 'targetW', label: '목표비중', val: (r) => r.targetW, fmt: CELL.pct },
    { k: 'targetAmount', label: '목표금액', val: (r) => r.targetAmount, fmt: CELL.money, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'addBuyByMV', label: '추가매수 필요금액', val: (r) => r.addBuyByMV, fmt: CELL.money },
    { k: 'achievement', label: '목표 달성률', cls: 'c', val: (r) => r.achievement, fmt: CELL.bar },
  ];
  REG.holdings = {
    id: 'holdings', cols, rows, csvName: '종목별_보유현황.csv',
    defaultSort: { k: 'targetW', dir: 'desc' },
    groupBy: {
      label: '위험/안전 구분', order: ['위험자산', '안전자산'],
      key: (r) => r.irpClass || '미분류',
      cls: (k) => (k === '안전자산' ? 'safe' : k === '위험자산' ? 'risk' : ''),
      summary: (ms) => '평가 ' + FMT.eokW(K.sum(ms, (m) => m.mv)) + ' · 목표 ' + FMT.eokW(K.sum(ms, (m) => m.targetAmount)) +
        ' · 목표비중 ' + FMT.pct(K.sum(ms, (m) => m.targetW), 1),
    },
    hideRule: { label: '미보유·목표없는 종목 표시',
      test: (r) => K.n(r.qty) === 0 && K.n(r.mv) === 0 && K.n(r.targetAmount) === 0 },
    aggregate: (hs) => {
      const S = (f) => K.sum(hs, f);
      const re = S((r) => r.realized), dv = S((r) => r.cumDiv), cb = S((r) => r.combined);
      const traded = hs.filter((r) => r.buyQty > 0);
      if (!re && !dv && !cb) return { show: false };
      return { show: true, cells: {
        name: '<b>미보유자산 실현손익</b> <span class="chip">' + traded.length + '종목 전량매도</span>',
        code: '<span style="font-size:11px;color:var(--tx3)">숨김</span>',
        realized: '<span class="num ' + sgn(re) + '">' + FMT.amtS(re) + '</span>',
        cumDiv: '<span class="num">' + FMT.amt(dv) + '</span>',
        combined: '<span class="num ' + sgn(cb) + '">' + FMT.amtS(cb) + '</span>',
        realizedR: '<span class="num ' + sgn(K.div(re, S((r) => r.realizedCost))) + '">' + FMT.pctS(K.div(re, S((r) => r.realizedCost))) + '</span>',
        group: '<span style="font-size:11px;color:var(--tx2)" title="' + esc(traded.map((r) => r.name).join(', ')) + '">' +
          esc(traded.slice(0, 2).map((r) => r.name.length > 12 ? r.name.slice(0, 11) + '…' : r.name).join(', ')) +
          (traded.length > 2 ? ' 외 ' + (traded.length - 2) : '') + '</span>',
      } };
    },
    filters: [
      { k: 'irp', label: 'IRP분류', options: ['위험자산', '안전자산'], test: (r, v) => r.irpClass === v },
      { k: 'hold', label: '보유상태', options: ['보유중', '미보유'], test: (r, v) => (v === '보유중' ? r.qty > 0 : r.qty === 0) },
      { k: 'cyc', label: '배당주기', options: ['월배당', '분기배당', '반기배당', '연배당'], test: (r, v) => (r.dividend || {}).cycle === v },
    ],
    footer: (c, rs) => {
      const S = (f) => K.sum(rs, f);
      switch (c.k) {
        case 'name': return '합계 (' + rs.length + '종목)';
        case 'cost': return '<span class="num">' + FMT.amt(S((r) => r.cost)) + '</span>';
        case 'mv': return '<span class="num">' + FMT.amt(S((r) => r.mv)) + '</span>';
        case 'pl': return '<span class="num ' + sgn(S((r) => r.pl)) + '">' + FMT.amtS(S((r) => r.pl)) + '</span>';
        case 'plr': return '<span class="num ' + sgn(T.totalPLR) + '">' + FMT.pctS(K.div(S((r) => r.pl), S((r) => r.cost))) + '</span>';
        case 'cumDiv': return '<span class="num">' + FMT.amt(S((r) => r.cumDiv)) + '</span>';
        case 'realized': return '<span class="num ' + sgn(S((r) => r.realized)) + '">' + FMT.amtS(S((r) => r.realized)) + '</span>';
        case 'combined': return '<span class="num ' + sgn(S((r) => r.combined)) + '">' + FMT.amtS(S((r) => r.combined)) + '</span>';
        case 'wTotal': return '<span class="num">' + FMT.pct(K.div(S((r) => r.mv), T.totalAssets)) + '</span>';
        case 'w400': return '<span class="num">' + FMT.pct(K.div(S((r) => r.mv), T.portfolioTarget)) + '</span>';
        case 'wInv': return '<span class="num">' + FMT.pct(K.div(S((r) => r.mv), T.totalMV)) + '</span>';
        case 'targetW': return '<span class="num">' + FMT.pct(K.div(S((r) => r.targetAmount), T.portfolioTarget)) + '</span>';
        case 'targetAmount': return '<span class="num">' + FMT.amt(S((r) => r.targetAmount)) + '</span>';
        case 'addBuyByMV': return '<span class="num">' + FMT.amt(S((r) => r.addBuyByMV)) + '</span>';
        case 'qty': return '';
        default: return '';
      }
    },
  };

  // 현금 정산표
  const cashRows = [
    ['납입원금', T.principal, '+', '설정에서 직접 입력', 'src-in'],
    ['총 매수대금', -T.totalBuyAmount, '−', '전 종목 매수금액 합계', ''],
    ['매수 수수료', -T.totalBuyFee, '−', '거래비용', ''],
    ['총 매도대금', T.totalSellAmount, '+', '실현손익 ' + FMT.amtS(T.totalRealized) + '원 포함', ''],
    ['매도 수수료', -T.totalSellFee, '−', '거래비용', ''],
    ['수령 배당금', T.divCash, '+',
      T.divCashBasis === 'received' ? '실제 수령내역으로 등록한 것만'
      : T.divCashBasis === 'paid' ? '지급일이 지난 회차 (실제 입금 기준)'
      : '배당락일이 지난 회차 (원본 엑셀과 동일 기준)', ''],
  ];
  const pendPay = T.divCashBasis === 'confirmed' ? K.n(T.divPendingPay) : 0;
  const cashPanel = '<div class="panel"><header><h2>현금성 자산 정산</h2>' +
    '<span class="sub">실현손익과 배당이 현금에 반영됩니다</span><span class="sp"></span>' +
    '<span class="chip">배당 반영 기준: ' + (T.divCashBasis === 'received' ? '실수령분만' : '확정(락일경과 포함)') + '</span>' +
    '<a class="btn sm" href="#/data">기준 변경</a></header><div class="body p0"><div class="tw"><table class="dt">' +
    '<thead><tr><th class="l">항목</th><th class="c">부호</th><th>금액</th><th class="l">설명</th></tr></thead><tbody>' +
    cashRows.map((r) => '<tr><td class="l ' + r[4] + '">' + esc(r[0]) + '</td><td class="c" style="color:var(--tx3)">' + r[2] + '</td>' +
      '<td class="num ' + (r[1] < 0 ? 'down' : '') + '">' + FMT.amt(r[1]) + '</td>' +
      '<td class="l" style="font-size:11.5px;color:var(--tx3)">' + esc(r[3]) + '</td></tr>').join('') +
    '</tbody><tfoot>' +
    '<tr><td class="l">= 현금성 자산</td><td></td><td class="num">' + FMT.amt(T.cash) + '</td><td class="l" style="font-size:11.5px;color:var(--tx3)">총자산의 ' + FMT.pct(T.cashRatio, 1) + '</td></tr>' +
    '<tr><td class="l">+ 평가금액</td><td></td><td class="num">' + FMT.amt(T.totalMV) + '</td><td class="l" style="font-size:11.5px;color:var(--tx3)">총자산의 ' + FMT.pct(T.invRatio, 1) + '</td></tr>' +
    '<tr><td class="l"><b>= 총자산</b></td><td></td><td class="num"><b>' + FMT.amt(T.totalAssets) + '</b></td>' +
    '<td class="l" style="font-size:11.5px">검산: 납입원금 ' + FMT.amt(T.principal) + ' + 총손익 ' + FMT.amtS(T.totalCombined) +
    (T.totalBuyFee ? ' − 매수수수료 ' + FMT.amt(T.totalBuyFee) : '') + ' = <b>' + FMT.amt(T.totalAssets) + '</b> ' +
    (Math.abs(T.reconcile) < 0.5 ? '<span class="chip ok">일치</span>' : '<span class="chip err">불일치 ' + FMT.amt(T.reconcile) + '</span>') + '</td></tr>' +
    '</tfoot></table></div></div>' +
    (pendPay > 0
      ? '<div class="body" style="padding-top:0"><div class="callout warn" style="margin:0">' +
        '<b>이 중 ' + FMT.won0(pendPay) + ' 은 아직 통장에 들어오지 않았습니다.</b><br>' +
        '배당락일은 지났지만 지급일이 아직 오지 않은 회차입니다. 권리는 확정됐지만 실제 입금은 나중입니다. ' +
        '실제 입금 기준으로 보시려면 <a href="#/data">데이터·설정</a> 에서 <b>배당의 현금 반영 기준</b>을 ' +
        '<b>지급일 경과분</b>으로 바꾸세요 (현금 ' + FMT.won0(T.cash - pendPay) + ' 로 조정됨).' +
        (CAN_EDIT ? ' 실제 수령액을 등록하시려면 <button class="btn sm pri" data-act="divUpdate">💰 배당 업데이트</button>' : '') +
        '</div></div>'
      : '') +
    '<div class="body" style="padding-top:0"><div class="note">참고 · 원본 엑셀의 정의(<code>종합!H30 = 표지!C6 − 종합!H29</code>)로 계산하면 <b>' + FMT.won0(T.cashByTarget) + '</b> 입니다. ' +
    '이 값은 실현손익·배당을 반영하지 않는 \u2018목표 대비 미투자 여력\u2019 이며, 엑셀 대조 검증에서는 이 값을 사용합니다.</div></div></div>';

  // 자산배분 도넛 (종합 ③ + 현금)
  const donutData = rows.filter((r) => r.mv > 0).map((r) => ({ label: r.name, value: r.mv }))
    .concat(T.cash > 0 ? [{ label: '현금성·미투자', value: T.cash, color: '#9aa7b8' }] : []);
  // 월별 배당 막대 (종합 ④)
  const f12 = V.fwd12;

  return '<div class="kpis">' + kpis + '</div>' +
    cashPanel +
    '<div class="panel"><header><h2>① 종목별 보유 현황</h2><span class="sub">원본: 종합!B7:S31 — 전 종목 자동 연동</span><span class="sp"></span>' +
    ed('<button class="btn sm pri" data-act="addInst">＋ 종목 추가</button>') +
    '<span class="legend"><span><i class="src-in" style="background:var(--input);border:1px solid var(--input-bd)"></i>사용자 입력</span>' +
    '<span><i class="src-ex" style="background:var(--ext);border:1px solid var(--ext-bd)"></i>외부 연동</span>' +
    '<span><i style="background:var(--panel);border:1px solid var(--line)"></i>자동 계산</span></span>' +
    '</header><div class="body p0">' + DataTable(REG.holdings) + '</div>' +
    (function () {
      const sold = rows.filter((r) => K.n(r.qty) === 0 && K.n(r.mv) === 0 && K.n(r.targetAmount) === 0 && r.buyQty > 0);
      if (!sold.length) return '';
      return '<div class="body" style="padding-top:0"><div class="note">' +
        '<b>미보유·목표없는 ' + sold.length + '종목</b>은 기본으로 숨기고 <b>「미보유자산 실현손익」 한 줄</b>로 묶어 표시합니다 — ' +
        '실현손익 <b class="' + sgn(K.sum(sold, (r) => r.realized)) + '">' + FMT.amtS(K.sum(sold, (r) => r.realized)) + '원</b>' +
        (K.sum(sold, (r) => r.cumDiv) ? ' · 누적배당 <b>' + FMT.amt(K.sum(sold, (r) => r.cumDiv)) + '원</b>' : '') +
        ' 은 합계와 KPI에 그대로 들어갑니다. 개별로 보시려면 위 <b>미보유·목표없는 종목 표시</b>를 켜세요.<br>' +
        '<span style="color:var(--tx3)">' + sold.map((r) => esc(r.name)).join(' · ') + '</span>' +
        '</div></div>';
    })() + '</div>' +
    '<div class="grid g2">' +
    '<div class="panel"><header><h2>자산 배분 (총자산 기준)</h2><span class="sub">원본 차트: 종합 PieChart</span></header><div class="body" style="display:flex;justify-content:center">' +
    Chart.donut(donutData, { size: 240, center: FMT.eok(T.totalAssets), centerSub: '총자산', max: 12 }) + '</div></div>' +
    '<div class="panel"><header><h2>현재 보유 기준 월별 배당 현금흐름</h2><span class="sub">원본 차트: 종합 BarChart · 세전</span></header><div class="body">' +
    Chart.gbar(f12.months.map(FMT.ymS), [{ label: '월 예상 배당(세전)', data: f12.totals, color: '#2e9e6b' }], { w: 700, h: 250, rotate: false }) +
    '<div class="note">향후 12개월 합계 <b>' + FMT.won0(f12.grandTotal) + '</b> · 월평균 <b>' + FMT.won0(f12.grandTotal / 12) + '</b></div>' +
    '</div></div>' +
    '</div>' +
    '<div class="panel"><header><h2>손익 구성</h2><span class="sub">평가손익 · 실현손익 · 누적배당</span></header><div class="body">' +
    Chart.hbar(rows.filter((r) => r.combined !== 0).sort((a, b) => b.combined - a.combined).map((r) => ({ label: r.name, value: r.combined })),
      { w: 760, labelW: 250, fmt: (v) => FMT.amtS(v) + '원', colorFn: (d) => (d.value >= 0 ? 'var(--up)' : 'var(--down)') }) +
    '</div></div>';
}

/* ===================== 7. 화면 B — 자산배분 및 리밸런싱 ===================== */
function ScreenRebalance() {
  const V = Store.view, T = V.totals, RB = V.rebal;
  const P = T.portfolioTarget;
  const rows = RB.rows.slice();

  const chk = RB.checks;
  const checks = [
    { ok: chk.targetSum100, label: '목표비중 합계 100%', v: FMT.pct(RB.targetWSum, 2), detail: '목표금액을 바꾸면 전 종목 비중이 자동 재배분됩니다' },
    { ok: chk.targetEqPortfolio, label: '목표금액 합계 = 목표총액', v: FMT.eokW(RB.targetSum), detail: '목표총액 ' + FMT.eokW(P) + ' 대비 ' + FMT.amtS(RB.targetSum - P) + '원' },
    { ok: Math.abs(T.totalMV - K.sum(V.computed, (c) => c.mv)) < 0.5, label: '평가금액 합계 = 종목별 합산', v: FMT.won0(T.totalMV), detail: '차이 ' + FMT.amt(T.totalMV - K.sum(V.computed, (c) => c.mv)) + '원' },
    { ok: Math.abs(T.reconcile) < 0.5, label: '총자산 = 납입원금 + 총손익', v: FMT.won0(T.totalAssets), detail: '납입 ' + FMT.eokW(T.principal) + ' + 총손익 ' + FMT.amtS(T.totalCombined) + '원' + (T.totalBuyFee ? ' − 수수료 ' + FMT.amt(T.totalBuyFee) + '원' : '') },
    { ok: chk.riskWithinLimit, label: 'IRP 위험자산 70% 한도', v: FMT.pct(RB.riskW, 1), detail: '위험 ' + FMT.eokW(RB.riskTarget) + ' / 안전 ' + FMT.eokW(RB.safeTarget) + ' (목표 기준)' },
    { ok: Math.abs(T.invRatio + T.cashRatio - 1) < 1e-9, label: '현금성 포함 전체 비중 = 100%', v: FMT.pct(T.invRatio, 2) + ' + ' + FMT.pct(T.cashRatio, 2), detail: '투자자산 + 현금성 (총자산 ' + FMT.eokW(T.totalAssets) + ' 기준)' },

  const cols = [
    { k: 'group', label: '구분' + (CAN_EDIT ? ' ✏️' : ''), cls: 'l', srcClass: CAN_EDIT ? 'src-in' : '', val: (r) => r.group || '',

    { k: 'targetAmt', label: '목표금액' + (CAN_EDIT ? ' ✏️' : ''), val: (r) => r.targetAmt, srcClass: CAN_EDIT ? 'src-in' : '', tip: '사용자 입력 — 수정 시 전체 즉시 재계산',
