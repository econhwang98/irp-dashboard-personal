    { k: 'targetW', label: '목표비중' + (CAN_EDIT ? ' ✏️' : ''), val: (r) => r.targetW, srcClass: CAN_EDIT ? 'src-in' : '',
      fmt: (r, v) => ed('<input type="number" class="key num" style="width:78px;text-align:right" data-tgtw="' + r.id + '" value="' + (K.n(v) * 100).toFixed(2) + '" step="0.25">%', CELL.pct(r, v)) },
    { k: 'mv', label: '현재 평가금액', val: (r) => r.mv, fmt: CELL.money },
    { k: 'curW', label: '현재비중', val: (r) => r.curW, fmt: CELL.pct, tip: '평가금액 ÷ 실제 총자산' },
    { k: 'curWTarget', label: '현재비중(목표총액 대비)', val: (r) => r.curWTarget, fmt: CELL.pct, tip: '원본 엑셀 목표비중·리밸런싱!G열' },
    { k: 'gap', label: '비중 격차', val: (r) => r.curW - r.targetW, fmt: (r, v) => '<span class="num ' + (Math.abs(v) < 0.005 ? 'flat' : v > 0 ? 'up' : 'down') + '">' + FMT.pctS(v) + '</span>' },

        '<span class="chip ' + (v === '안전자산' ? 'safe' : 'risk') + '">' + esc(v) + '</span>') },
    { k: 'cycle', label: '배당주기', cls: 'c', val: (r) => (r.dividend || {}).cycle || '-' },
    { k: 'divYieldPrice', label: '연 배당률', val: (r) => r.divYieldPrice, fmt: CELL.pct },
    { k: 'payMonths', label: '배당 입금월', cls: 'l', val: (r) => (r.dividend || {}).payMonthsText || '-' },
    { k: 'achievement', label: '달성률', cls: 'c', val: (r) => r.achievement, fmt: CELL.bar },
  ];
  REG.rebal = { id: 'rebal', cols, rows, csvName: '목표비중_리밸런싱.csv',
    defaultSort: { k: 'targetW', dir: 'desc' },
    defaultHidden: ['curWTarget'],
    groupBy: {
      label: '위험/안전 구분', order: ['위험자산', '안전자산'],
      key: (r) => r.irpClass || '미분류',
      cls: (k) => (k === '안전자산' ? 'safe' : k === '위험자산' ? 'risk' : ''),

        ' · 현재 ' + FMT.eokW(K.sum(ms, (m) => m.mv)) + ' (' + FMT.pct(K.sum(ms, (m) => m.curW), 1) + ')' +

    hideRule: { label: '미보유·목표없는 종목 표시',

        case 'curW': return '<span class="num">' + FMT.pct(K.div(S((r) => r.mv), RB.totalAssets)) + '</span>';
        case 'curWTarget': return '<span class="num">' + FMT.pct(K.div(S((r) => r.mv), P)) + '</span>';

  const curDonut = rows.filter((r) => r.mv > 0).map((r) => ({ label: r.name, value: r.mv })).concat(T.cash > 0 ? [{ label: '현금성·미투자', value: T.cash, color: '#9aa7b8' }] : []);
  const tgtDonut = rows.filter((r) => r.targetAmt > 0).map((r) => ({ label: r.name, value: r.targetAmt }));
  const cats = rows.filter((r) => r.targetAmt > 0 || r.mv > 0).map((r) => r.name);

  const addBuyRows = rows.filter((r) => r.addBuy > 0).sort((a, b) => b.addBuy - a.addBuy).map((r) => ({ label: r.name, value: r.addBuy }));

  return (CAN_EDIT ? '<div class="callout info">목표금액 또는 목표비중을 수정하면 <b>모든 화면의 계산이 즉시 갱신</b>됩니다. 목표비중을 입력하면 목표금액이 목표총액 ' + FMT.eokW(P) + ' 기준으로 자동 환산됩니다.<br>' +
    '<b>목표비중</b> = 목표금액 ÷ <b>목표금액 합계 ' + FMT.eokW(RB.targetSum) + '</b> — 목표금액을 바꾸면 나머지 종목 비중이 자동 재배분되어 합계가 항상 100%가 됩니다.<br>' +
    '<b>현재비중</b> = 평가금액 ÷ <b>실제 총자산 ' + FMT.eokW(T.totalAssets) + '</b>(평가금액 + 현금, 실현손익·배당 반영). 원본 엑셀 기준(목표총액 분모) 현재비중은 열 선택에서 켤 수 있습니다.</div>'
    : '<div class="callout info"><b>목표비중</b> = 목표금액 ÷ 목표금액 합계 ' + FMT.eokW(RB.targetSum) +
      ' · <b>현재비중</b> = 평가금액 ÷ 실제 총자산 ' + FMT.eokW(T.totalAssets) + ' (평가금액 + 현금)</div>') +
    checkHtml +
    '<div class="panel" style="margin-top:14px"><header><h2>목표 비중 · 리밸런싱</h2><span class="sub">원본: 목표비중·리밸런싱!B5:R27</span><span class="sp"></span>' +
    ed('<button class="btn sm pri" data-act="addInst">＋ 종목 추가</button>' +
      '<button class="btn sm" data-act="syncTotal">목표총액을 합계에 맞추기</button>' +
      '<button class="btn sm" data-act="equalize">현재 평가금액으로 목표 맞추기</button>' +
      '<button class="btn sm" data-act="resetTarget">원본 엑셀 목표값 복원</button>') +
    '</header><div class="body p0">' + DataTable(REG.rebal) + '</div></div>' +
    '<div class="grid g2">' +
    '<div class="panel"><header><h2>현재 자산배분</h2></header><div class="body" style="display:flex;justify-content:center">' + Chart.donut(curDonut, { size: 230, center: FMT.eok(T.totalAssets), centerSub: '현재 총자산' }) + '</div></div>' +
    '<div class="panel"><header><h2>목표 자산배분</h2><span class="sub">원본 차트: 목표비중·리밸런싱 PieChart</span></header><div class="body" style="display:flex;justify-content:center">' + Chart.donut(tgtDonut, { size: 230, center: FMT.eok(RB.targetSum), centerSub: '목표' }) + '</div></div>' +
    '</div>' +
    '<div class="panel"><header><h2>현재 평가 vs 목표금액</h2><span class="sub">원본 차트: 목표비중·리밸런싱 BarChart</span></header><div class="body">' +
    Chart.gbar(cats, [
      { label: '현재 평가금액', data: cmp.map((r) => r.mv), color: '#1f5fbf' },
      { label: '목표금액', data: cmp.map((r) => r.targetAmt), color: '#9aa7b8' },
    ], { w: 900, h: 300 }) + '</div></div>' +
    '<div class="grid g2">' +
    '<div class="panel"><header><h2>현재비중 vs 목표비중</h2></header><div class="body">' +
    Chart.gbar(cats, [
      { label: '현재비중', data: cmp.map((r) => r.curW * 100), color: '#1f5fbf' },
      { label: '목표비중', data: cmp.map((r) => r.targetW * 100), color: '#d4842a' },
    ], { w: 780, h: 300, fmt: (v) => v.toFixed(2) + '%' }) + '</div></div>' +
    '<div class="panel"><header><h2>종목별 추가매수 필요금액</h2><span class="sub">합계 ' + FMT.won0(RB.addBuySum) + '</span></header><div class="body">' +
    (addBuyRows.length ? Chart.hbar(addBuyRows, { w: 700, labelW: 240, fmt: FMT.eokW }) : '<div class="empty">모든 종목이 목표금액에 도달했습니다</div>') + '</div></div>' +
    '</div>' +
    '<div class="panel"><header><h2>위험자산 · 안전자산 비중</h2><span class="sub">IRP 위험자산 한도 70% · 안전자산 100% 가능</span></header><div class="body">' +
    '<div style="font-size:12px;color:var(--tx2);margin-bottom:4px">목표 기준</div>' +
    Chart.stack100([{ label: '위험자산', value: RB.riskTarget, color: '#c0455e' }, { label: '안전자산', value: RB.safeTarget, color: '#1f5fbf' }], { w: 900, h: 40 }) +
    '<div style="font-size:12px;color:var(--tx2);margin:12px 0 4px">현재 기준 (실제 총자산 ' + FMT.eokW(T.totalAssets) + ' — 현금성 자산 포함)</div>' +
    Chart.stack100([{ label: '위험자산', value: RB.riskMV, color: '#c0455e' }, { label: '안전자산', value: RB.safeMV, color: '#1f5fbf' }, { label: '현금성', value: Math.max(T.cash, 0), color: '#9aa7b8' }], { w: 900, h: 40 }) +
    '<div class="note">현재 기준 위험자산 <b>' + FMT.pct(RB.riskMVW, 1) + '</b> · 안전자산 <b>' + FMT.pct(RB.safeMVW, 1) + '</b> · 현금성 <b>' + FMT.pct(RB.cashW, 1) + '</b><br>' +
    '목표 기준 위험자산 비중 <b>' + FMT.pct(RB.riskW, 1) + '</b> · 안전자산 <b>' + FMT.pct(RB.safeW, 1) + '</b> → ' +
    (RB.checks.riskWithinLimit ? '<span class="chip ok">IRP 위험자산 70% 한도 충족</span>' : '<span class="chip err">한도 초과</span>') +
    ' · 목표 가중평균 배당률 <b>' + FMT.pct(RB.wAvgYield) + '</b> (원본 목표비중·리밸런싱!R22)</div>' +
    '</div></div>';
}

/* ===================== 8. 화면 C — 종목 상세 ===================== */
function ScreenInstrument(id) {
  const c = Store.cinst(id), inst = Store.inst(id);
  if (!c) return '<div class="empty">종목을 찾을 수 없습니다. <a href="#/dashboard">대시보드로</a></div>';
  const V = Store.view, T = V.totals;
  const pm = c.priceMeta || {};
  const f12idx = V.computed.findIndex((x) => x.id === id);
  const f12 = V.fwd12.byInst[f12idx] || [];
  const f12sum = K.sum(f12);
  const recvSorted = (inst.dividendReceipts || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  const perShareList = c.schedule.filter((r) => r.exDate <= V.today).slice(-6);

  const head =
    '<div class="panel"><header><h2>' + esc(c.name) + '</h2>' +
    '<span class="chip">' + esc(c.code || '코드없음') + '</span>' +
    '<span class="chip ' + (c.irpClass === '안전자산' ? 'safe' : 'risk') + '">' + esc(c.irpClass) + '</span>' +
    (c.group ? '<span class="chip">' + esc(c.group) + '</span>' : '') +
    (c.category ? '<span class="chip">' + esc(c.category) + '</span>' : '') +
    '<span class="sp"></span>' +
    ed('<button class="btn sm" data-act="editInst" data-inst-id="' + id + '">종목 정보 수정</button>' +
       '<button class="btn sm dgr" data-act="delInst" data-inst-id="' + id + '">종목 삭제</button>') +
    '<a class="btn sm" href="#/dashboard">← 목록</a></header>' +
    '<div class="body">' +
    (c.qty === 0 && c.buyQty > 0
      ? '<div class="callout" style="margin-bottom:10px"><b>전량 매도한 종목입니다.</b> 보유수량은 0이지만 ' +
        '실현손익 <b class="' + sgn(c.realized) + '">' + FMT.amtS(c.realized) + '원</b>' +
        (c.cumDiv ? ' 과 누적배당 <b>' + FMT.amt(c.cumDiv) + '원</b>' : '') +
        ' 이 전체 합계와 현금성 자산에 그대로 반영되어 있습니다.</div>'
      : '') +
    '<div style="font-size:12.5px;color:var(--tx2);line-height:1.7">' + esc(c.desc || '') + '</div></div></div>';

  const kpis = '<div class="kpis">' + [
    kpi('현재가', FMT.price(c.price) + '원',
      '<span class="' + sgn(c.dayChange) + '">' + (K.n(c.dayChange) > 0 ? '▲' : K.n(c.dayChange) < 0 ? '▼' : '') + ' ' + FMT.amt(Math.abs(c.dayChange)) + ' (' + FMT.pctS(c.dayChangeRate) + ')</span>' +
      '<span class="chip">' + esc(pm.marketStatus || '-') + '</span>', sgn(c.dayChange) === 'up' ? 'up' : sgn(c.dayChange) === 'down' ? 'down' : 'mut',
      '기준시각: ' + FMT.dt(pm.asOf) + ' / 출처: ' + (pm.source || '-')),
    kpi('보유수량 · 평균단가', FMT.qtyN(c.qty) + '주', '평단 <b class="num">' + K.n(c.avg).toLocaleString('ko-KR', { maximumFractionDigits: 2 }) + '</b>원 (총평균법)', 'mut'),
    kpi('취득원가', FMT.amt(c.cost) + '원', '매수 ' + FMT.qtyN(c.buyQty) + '주 / 매도 ' + FMT.qtyN(c.sellQty) + '주', 'mut'),
    kpi('평가금액', FMT.amt(c.mv) + '원', '포트폴리오 내 <b>' + FMT.pct(c.wInv) + '</b> · 4억 대비 <b>' + FMT.pct(c.w400) + '</b>', 'mut'),
    kpi('평가손익', '<span class="' + sgn(c.pl) + '">' + FMT.amtS(c.pl) + '원</span>', '<span class="' + sgn(c.plr) + '">' + FMT.pctS(c.plr) + '</span>', sgn(c.pl) === 'up' ? 'up' : 'down'),

    kpi('추가매수 필요금액', FMT.amt(c.addBuyByMV) + '원', '≈ ' + FMT.qtyN(c.price ? K.rounddown0(c.addBuyByMV / c.price) : 0) + '주', c.addBuyByMV > 0 ? 'warn' : 'ok'),
  ].join('') + '</div>';

  // 매수 내역
  REG.buys = { id: 'buys_' + id, noBar: true, rows: (inst.buys || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1)), cols: [
    { k: 'date', label: '거래일', cls: 'l', val: (r) => r.date, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'qty', label: '수량', val: (r) => K.n(r.qty), fmt: CELL.qty, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'price', label: '매수가격', val: (r) => K.n(r.price), fmt: CELL.price, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'amount', label: '거래금액', val: (r) => K.n(r.qty) * K.n(r.price), fmt: CELL.money },
    { k: 'fee', label: '수수료', val: (r) => K.n(r.fee), fmt: CELL.money, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'memo', label: '메모', cls: 'l', val: (r) => r.memo || '' },

  ], footer: (col, rs) => col.k === 'date' ? '합계' : col.k === 'qty' ? '<span class="num">' + FMT.qtyN(K.sum(rs, (r) => r.qty)) + '</span>' : col.k === 'amount' ? '<span class="num">' + FMT.amt(K.sum(rs, (r) => K.n(r.qty) * K.n(r.price))) + '</span>' : '' };

  REG.sells = { id: 'sells_' + id, noBar: true, rows: (inst.sells || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1)), cols: [
    { k: 'date', label: '거래일', cls: 'l', val: (r) => r.date, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'qty', label: '수량', val: (r) => K.n(r.qty), fmt: CELL.qty, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'price', label: '매도가격', val: (r) => K.n(r.price), fmt: CELL.price, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'amount', label: '매도금액', val: (r) => K.n(r.qty) * K.n(r.price), fmt: CELL.money },
    { k: 'pl', label: '실현손익', val: (r) => K.n(r.qty) * (K.n(r.price) - c.avg) - K.n(r.fee), fmt: CELL.moneyS },
    { k: 'plr', label: '실현수익률', val: (r) => K.div(K.n(r.qty) * (K.n(r.price) - c.avg) - K.n(r.fee), K.n(r.qty) * c.avg), fmt: CELL.pctS },
    { k: 'fee', label: '수수료', val: (r) => K.n(r.fee), fmt: CELL.money, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'memo', label: '메모', cls: 'l', val: (r) => r.memo || '' },
    { k: 'act', label: '관리', cls: 'c', val: () => '', hide: !CAN_EDIT, fmt: (r) => '<button class="btn sm" data-edit-sell="' + r.id + '">수정</button> <button class="btn sm dgr" data-del-sell="' + r.id + '">삭제</button>' },
  ], footer: (col, rs) => col.k === 'date' ? '합계' : col.k === 'qty' ? '<span class="num">' + FMT.qtyN(K.sum(rs, (r) => r.qty)) + '</span>' : col.k === 'amount' ? '<span class="num">' + FMT.amt(K.sum(rs, (r) => K.n(r.qty) * K.n(r.price))) + '</span>' : col.k === 'pl' ? '<span class="num ' + sgn(c.realized) + '">' + FMT.amtS(c.realized) + '</span>' : '' };

  REG.recv = { id: 'recv_' + id, noBar: true, rows: recvSorted, cols: [
    { k: 'date', label: '지급일', cls: 'l', val: (r) => r.date, srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'shares', label: '기준 보유수량', val: (r) => K.sharesAsOf(inst.buys, inst.sells, r.date), fmt: CELL.qty },
    { k: 'per', label: '주당 분배금', val: (r) => K.div(K.n(r.amount), K.sharesAsOf(inst.buys, inst.sells, r.date)), fmt: (r, v) => '<span class="num">' + K.n(v).toLocaleString('ko-KR', { maximumFractionDigits: 2 }) + '</span>' },

    { k: 'kind', label: '구분', cls: 'c', val: (r) => r.kind || '실수령', srcClass: CAN_EDIT ? 'src-in' : '' },
    { k: 'memo', label: '메모', cls: 'l', val: (r) => r.memo || '' },
    { k: 'act', label: '관리', cls: 'c', val: () => '', hide: !CAN_EDIT, fmt: (r) => '<button class="btn sm" data-edit-div="' + r.id + '">수정</button> <button class="btn sm dgr" data-del-div="' + r.id + '">삭제</button>' },
  ], footer: (col, rs) => col.k === 'date' ? '누적 수령배당금' : col.k === 'amount' ? '<span class="num">' + FMT.amt(K.sum(rs, (r) => r.amount)) + '</span>' : '' };

  const dv = c.dividend || {};
  const recentPer = perShareList.length ? perShareList[perShareList.length - 1].perShare : dv.perShare;
  const divInfo = '<dl class="kv">' + [
    ['배당주기', esc(dv.cycle || '-')],
    ['배당 입금월', esc(dv.payMonthsText || '-')],
    ['연 지급 횟수', K.n(dv.freq) + '회'],
    ['최근 주당 분배금', FMT.amt(recentPer) + '원'],
    ['평균 주당 분배금 (누적평균)', '<span class="src-in" style="padding:1px 5px;border-radius:4px">' + FMT.amt(dv.perShare) + '원</span>'],
    ['연환산 주당 분배금', FMT.amt(K.n(dv.perShare) * K.n(dv.freq)) + '원'],
    ['현재가 기준 배당률', FMT.pct(c.divYieldPrice)],
    ['취득원가(평단) 기준 배당률', FMT.pct(c.divYieldCost)],
    ['연간 예상 배당금 (세전)', '<b>' + FMT.amt(c.annualDiv) + '원</b>'],
    ['월평균 예상 배당금', FMT.amt(c.monthlyAvgDiv) + '원'],
    ['(참고) 일반계좌 세후 15.4% 차감', FMT.amt(c.annualDivAfterTax) + '원'],
    ['다음 배당락일', esc(dv.nextExDate || '-')],
    ['다음 지급예정일', esc(dv.nextPayDate || '-')],
    ['향후 12개월 예상 배당금', '<b>' + FMT.amt(f12sum) + '원</b>'],
  ].map((x) => '<dt>' + x[0] + '</dt><dd>' + x[1] + '</dd>').join('') + '</dl>';

  const schedRows = c.schedule.filter((r) => r.payDate >= V.today).slice(0, 24);
  const schedTbl = '<div class="tw" style="max-height:280px"><table class="dt"><thead><tr>' +
    '<th class="c">회차</th><th class="c">배당락일</th><th class="c">지급일</th><th>보유수량(락일)</th><th>주당배당</th><th>예상배당(세전)</th></tr></thead><tbody>' +
    schedRows.map((r) => '<tr><td class="c">' + r.seq + '</td><td class="c">' + r.exDate + '</td><td class="c">' + r.payDate + '</td>' +
      '<td class="num">' + FMT.qtyN(r.shares) + '</td><td class="num">' + FMT.amt(r.perShare) + '</td><td class="num">' + FMT.amt(r.amount) + '</td></tr>').join('') +
    '</tbody></table></div>';

  return head + kpis +
    '<div class="panel"><header><h2>① 매수 내역</h2><span class="sub">원본: ' + esc(c.sheet) + '!B7:F26 · 총평균법 평단 산출</span><span class="sp"></span>' +
    ed('<button class="btn sm pri" data-add-buy="' + id + '">＋ 매수 추가</button>') + '</header><div class="body p0">' + DataTable(REG.buys) + '</div></div>' +
    '<div class="panel"><header><h2>② 매도 내역</h2><span class="sub">원본: ' + esc(c.sheet) + '!B31:G40 · 실현손익 = 수량 × (매도단가 − 보유평단)</span><span class="sp"></span>' +
    ed('<button class="btn sm pri" data-add-sell="' + id + '">＋ 매도 추가</button>') + '</header><div class="body p0">' + DataTable(REG.sells) + '</div></div>' +
    '<div class="grid g2">' +
    '<div class="panel"><header><h2>⑤ 배당(분배금) 기본 정보</h2><span class="sub">원본: ' + esc(c.sheet) + '!B65:C74</span><span class="sp"></span>' +
    ed('<button class="btn sm" data-edit-divinfo="' + id + '">가정치 수정</button>') + '</header><div class="body">' + divInfo + '</div></div>' +
    '<div class="panel"><header><h2>향후 12개월 예상 배당</h2><span class="sub">지급일 기준 · 세전</span></header><div class="body">' +
    Chart.gbar(V.fwd12.months.map(FMT.ymS), [{ label: '예상 배당', data: f12, color: '#2e9e6b' }], { w: 640, h: 220, rotate: false }) + '</div></div>' +
    '</div>' +
    '<div class="panel"><header><h2>④ 실제 배당 수령내역</h2><span class="sub">입력 시 누적배당 · 합산손익 · 대시보드가 즉시 갱신됩니다</span><span class="sp"></span>' +
    ed('<button class="btn sm" data-act="divUpdate">💰 배당 업데이트</button>' +
       '<button class="btn sm pri" data-add-div="' + id + '">＋ 배당 수령 추가</button>') + '</header><div class="body p0">' + DataTable(REG.recv) + '</div>' +
    '<div class="body" style="padding-top:0"><div class="note">누적 확정 배당금 계산 (원본 ' + esc(c.sheet) + '!C' + (78 + K.n(dv.freq) * 31 + 3) + '): 실제 수령내역이 1건이라도 있으면 그 합계를 우선 적용하고, 없으면 배당락일이 경과한 회차의 예상배당 합계를 사용합니다. 현재 적용값 <b>' + FMT.won0(c.cumDiv) + '</b> (' + esc(c.cumDivSource) + ' · 실수령 ' + FMT.won0(c.cumDivReceived) + ' / 락일경과 추정 ' + FMT.won0(c.cumDivAccrued) + ')</div></div></div>' +
    (typeof InstrumentHoldingsPanel === 'function' ? InstrumentHoldingsPanel(c) : '') +
    '<div class="panel"><header><h2>⑥ 배당 스케줄 (향후 24회차)</h2><span class="sub">원본: ' + esc(c.sheet) + '!B78:G' + (78 + K.n(dv.freq) * 31 - 1) + ' — 과거 1년 + 향후 30년 자동 생성</span></header><div class="body p0">' + schedTbl + '</div></div>';
}

/* ===================== 9. 화면 D — 배당 대시보드 ===================== */
function ScreenDividends() {
  const V = Store.view, T = V.totals, RB = V.rebal;
  // 2026-08-11: 목표금액도 없고 보유(평가금액)도 없는 종목은 배당 대시보드에 표시할 이유가 없어 숨김.
  const rows = V.computed.filter((c) => !(c.isPlaceholder && c.annualDiv === 0 && c.cumDiv === 0))
    .filter((c) => K.n(c.targetAmount) > 0 || K.n(c.mv) > 0);
  const months = V.fwd12.months;
  const actual = K.actualMonthlyDividends(Store.state.instruments, months);
  const expected = V.fwd12.totals;
  const diff = expected.map((e, i) => actual[i] - e);
  const cycles = {};
  rows.forEach((c) => { const k = (c.dividend || {}).cycle || '미지정'; cycles[k] = (cycles[k] || 0) + c.annualDiv; });
  const wAvgCur = K.div(K.sum(rows, (c) => c.annualDiv), T.totalMV);
  const wAvgCost = K.div(K.sum(rows, (c) => c.annualDiv), T.totalCost);

  const kpis = '<div class="kpis">' + [
    kpi('연간 예상 배당금 (세전)', FMT.eokW(T.annualDivTotal), '원본 종합!G56 · 현재 보유 기준', 'ok'),
    kpi('향후 12개월 예상 배당', FMT.eokW(V.fwd12.grandTotal), '지급일 롤링 기준 · 월평균 ' + FMT.won0(V.fwd12.grandTotal / 12), 'ok'),
    kpi('누적 배당금 (락일경과)', FMT.amt(T.cumDivTotal) + '원', '실수령 등록 ' + FMT.won0(T.divReceived) + ' · 추정 포함', 'ok'),
    kpi('이미 입금된 배당', FMT.amt(T.divPaid) + '원', T.divPendingPay > 0 ? '<b style="color:var(--warn)">미입금 ' + FMT.won0(T.divPendingPay) + '</b> (지급일 미도래)' : '전액 입금 완료', T.divPendingPay > 0 ? 'warn' : 'ok'),
    kpi('월평균 배당금', FMT.won0(T.annualDivTotal / 12), '연간 예상 ÷ 12', 'mut'),
    kpi('현재가 기준 배당률', FMT.pct(wAvgCur), '연간 예상배당 ÷ 평가금액', 'mut'),
    kpi('취득원가 기준 배당률', FMT.pct(wAvgCost), '연간 예상배당 ÷ 취득원가', 'mut'),
    kpi('목표 가중평균 배당률', FMT.pct(RB.wAvgYield), '원본 목표비중·리밸런싱!R22 · SUMPRODUCT(배당률, 목표비중)', 'mut'),
    kpi('실제 vs 예상 (12개월)', '<span class="' + sgn(K.sum(diff)) + '">' + FMT.amtS(K.sum(diff)) + '원</span>', '실제 ' + FMT.won0(K.sum(actual)) + ' / 예상 ' + FMT.won0(K.sum(expected)), K.sum(diff) >= 0 ? 'ok' : 'warn'),
  ].join('') + '</div>';

  REG.divtbl = { id: 'divtbl', rows, csvName: '배당_요약.csv',
    filters: [{ k: 'cyc', label: '배당주기', options: ['월배당', '분기배당', '반기배당', '연배당'], test: (r, v) => (r.dividend || {}).cycle === v }],
    cols: [
      { k: 'name', label: '종목명', cls: 'l', sticky: true, width: 240, hideable: false, val: (r) => r.name, fmt: (r, v) => '<a href="#/inst/' + r.id + '" class="nm" style="max-width:224px">' + esc(v) + '</a>' },
      { k: 'cycle', label: '배당주기', cls: 'c', val: (r) => (r.dividend || {}).cycle || '-' },
      { k: 'payMonths', label: '배당 입금월', cls: 'l', val: (r) => (r.dividend || {}).payMonthsText || '-' },
      { k: 'freq', label: '연 지급횟수', val: (r) => r.freq, fmt: (r, v) => '<span class="num">' + v + '회</span>' },
      { k: 'perShare', label: '주당 1회 분배금', val: (r) => r.perShare, fmt: (r, v) => '<span class="num">' + K.n(v).toLocaleString('ko-KR', { maximumFractionDigits: 2 }) + '</span>', srcClass: 'src-in' },
      { k: 'qty', label: '보유수량', val: (r) => r.qty, fmt: CELL.qty },
      { k: 'annualDiv', label: '연 배당(세전)', val: (r) => r.annualDiv, fmt: CELL.money },
      { k: 'monthlyAvgDiv', label: '월평균 배당', val: (r) => r.monthlyAvgDiv, fmt: CELL.money },
      { k: 'divYieldPrice', label: '현재가 기준 배당률', val: (r) => r.divYieldPrice, fmt: CELL.pct },
      { k: 'divYieldCost', label: '취득원가 기준 배당률', val: (r) => r.divYieldCost, fmt: CELL.pct },
      { k: 'cumDiv', label: '누적 수령배당', val: (r) => r.cumDiv, fmt: CELL.money },
      { k: 'cumDivYieldOnCost', label: '누적 배당수익률', val: (r) => r.cumDivYieldOnCost, fmt: CELL.pct },
      { k: 'contrib', label: '배당 기여도', cls: 'c', val: (r) => K.div(r.annualDiv, T.annualDivTotal), fmt: CELL.bar },
      { k: 'nextEx', label: '다음 배당락일', cls: 'c', val: (r) => (r.dividend || {}).nextExDate || '-' },
      { k: 'nextPay', label: '다음 지급일', cls: 'c', val: (r) => (r.dividend || {}).nextPayDate || '-' },
    ],
    footer: (c, rs) => c.k === 'name' ? '합계' :
      c.k === 'annualDiv' ? '<span class="num">' + FMT.amt(K.sum(rs, (r) => r.annualDiv)) + '</span>' :
      c.k === 'monthlyAvgDiv' ? '<span class="num">' + FMT.amt(K.sum(rs, (r) => r.monthlyAvgDiv)) + '</span>' :
      c.k === 'cumDiv' ? '<span class="num">' + FMT.amt(K.sum(rs, (r) => r.cumDiv)) + '</span>' :
      c.k === 'divYieldPrice' ? '<span class="num">' + FMT.pct(wAvgCur) + '</span>' : '' };

  // 12개월 캘린더
  const calItems = months.map((m, i) => {
    const list = rows.map((c, ci) => ({ name: c.name, v: V.fwd12.byInst[V.computed.indexOf(c)][i] })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v);
    return { m, total: expected[i], actual: actual[i], list };
  });
  const cal = '<div class="cal">' + calItems.map((it, i) =>
    '<div class="m' + (i === 0 ? ' hi' : '') + '"><b>' + FMT.ym(it.m) + (i === 0 ? ' (당월)' : '') + '</b>' +
    '<div class="amt num">' + FMT.amt(it.total) + '원</div>' +
    (it.actual > 0 ? '<div style="font-size:11px;color:var(--ok)">실수령 ' + FMT.amt(it.actual) + '원</div>' : '') +
    '<ul>' + it.list.slice(0, 5).map((x) => '<li>' + esc(x.name.length > 17 ? x.name.slice(0, 16) + '…' : x.name) + ' ' + FMT.amt(x.v) + '</li>').join('') +
    (it.list.length > 5 ? '<li>외 ' + (it.list.length - 5) + '종목</li>' : '') + '</ul></div>').join('') + '</div>';

/* 2026-08-12: 변경 이력(AuditLogs)의 "변경 전/후" 칸은 자유 형식 객체를 그대로 JSON.stringify 로
 * 찍고 있어서, 그 안에 금액이 들어 있으면 "450000000"처럼 천단위 콤마 없이 노출되는 문제가 있었음
 * (사용자 실측 지적). 문자열 리터럴 안의 숫자는 건드리지 않도록 따옴표 구간을 건너뛰면서, JSON
 * 숫자 값(4자리 이상 정수부)에만 천단위 콤마를 넣어준다. */
function fmtAuditJSON(obj) {
  if (obj === null || obj === undefined) return '';
  let s; try { s = JSON.stringify(obj); } catch (e) { return String(obj); }
  if (!s) return '';
  let out = '', inStr = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '"' && s[i - 1] !== '\\') { inStr = !inStr; out += ch; continue; }
    if (!inStr && (ch === '-' || (ch >= '0' && ch <= '9'))) {
      let j = i, numStr = '';
      if (ch === '-') { numStr += ch; j++; }
      while (j < s.length && s[j] >= '0' && s[j] <= '9') { numStr += s[j]; j++; }
      let frac = '';
      if (s[j] === '.') { frac = '.'; j++; while (j < s.length && s[j] >= '0' && s[j] <= '9') { frac += s[j]; j++; } }
      const neg = numStr.charAt(0) === '-';
      const digits = neg ? numStr.slice(1) : numStr;
      out += (digits.length >= 4 ? (neg ? '-' : '') + digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : numStr) + frac;
      i = j - 1;
      continue;
    }
    out += ch;
  }
  return out;
}

// 국내: 6자리 영숫자 종목코드. 해외: "NVDA.O" 처럼 티커+거래소 접미사(1~3자) 형태.
// (2026-08-11 해외 구성종목 시세 조회 지원 — 서버 쪽 규칙과 반드시 동일하게 유지해야 함)
// 2026-08-12: FunETF 구성종목 API가 거래소 접미사 없이 "NVDA" 같은 순수 티커만 주는 경우가
// 흔하다는 걸 사용자 실측으로 확인(해외주식 대부분이 "미조회"로 남는 원인) — 이런 접미사 없는
// 순수 영문 티커(1~5자, 숫자 없음 — 국내 코드는 항상 숫자를 포함하므로 겹치지 않음)도 유효한
// 코드로 인정한다. 접미사는 서버 쪽 Get-WorldCodeCandidates/worldCodeCandidates 에서 붙여 시도.
const VALID_CODE = /^(?:[0-9A-Za-z]{6}|[A-Za-z][A-Za-z0-9.\-]{0,9}\.[A-Za-z]{1,3}|[A-Za-z]{1,5})$/;
const IS_MAC = (function () {

  catch (e) { return false; }
})();
const Price = {
  busy: {}, lastReport: null, fx: null,
  proxy() { return (Store.state.settings.proxyUrl || '').trim(); },
  /** 2026-08-12: 해외 구성종목 현재가(달러)를 원화로 환산해 보여달라는 요청 — 프록시가 있는
   *  호스트(주소·포트)에 /api/fx 를 붙여 호출한다(별도 설정 없이 기존 프록시 주소를 재사용). */
  async fetchFx() {
    const p = this.proxy();
    if (!p) throw new Error('프록시 URL이 설정되지 않았습니다.');
    let origin;
    try { origin = new URL(p, location.href).origin; } catch (e) { throw new Error('프록시 주소를 해석할 수 없습니다: ' + p); }
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 9000);
    let res;
    try { res = await fetch(origin + '/api/fx', { signal: ctl.signal, cache: 'no-store' }); }
    finally { clearTimeout(to); }
    let j = null; try { j = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((j && j.error) || ('HTTP ' + res.status));
    const rate = K.n(j && j.usdkrw);
    if (!(rate > 0)) throw new Error('환율 값을 해석할 수 없습니다');
    this.fx = { rate, date: j.date, source: j.source, at: Date.now() };
    // 2026-08-12: Price.fx 는 메모리에만 있어서 페이지를 새로고침하면 사라지는데, 구성종목
    // 시세(constituentPrices)는 저장돼 남아있으니 "환율만 다시 못 받아온" 상태로 보이는 화면이
    // 나올 수 있었다(달러 그대로 표시) — Store 에도 남겨 새로고침 후에도 최근 환율을 쓴다.
    try { Store.state.fx = this.fx; Store.save(); } catch (e) {}
    return this.fx;
  },
  /** 현재 쓸 수 있는 환율 — 이번 세션에서 막 받은 값이 있으면 그걸, 없으면 저장된 마지막 값 */
  currentFx() { return this.fx || (Store.state && Store.state.fx) || null; },
  naverUrl(code) { return 'https://polling.finance.naver.com/api/realtime/domestic/stock/' + code; },
  /** 실제 조회 대상 — 6자리 종목코드가 유효한 종목만. '(종목코드 입력)' 같은 예비 슬롯은 제외 */
  targets() { return Store.state.instruments.filter((i) => VALID_CODE.test(String(i.code || '').trim())); },
  isValid(code) { return VALID_CODE.test(String(code || '').trim()); },

  /** 프록시 URL 조립 — {code} / {codes} 치환 지원 */
  buildUrl(codes) {
    const p = this.proxy();
    if (!p) return null;
    const one = codes.length === 1;
    if (p.indexOf('{codes}') >= 0) return p.replace('{codes}', encodeURIComponent(codes.join(',')));
    if (p.indexOf('{code}') >= 0) {
      if (one) return p.replace('{code}', encodeURIComponent(codes[0]));
      return null;                               // 일괄 불가 → 개별 호출
    }
    return p + (p.indexOf('?') >= 0 ? '&' : '?') + (one ? 'code=' + encodeURIComponent(codes[0]) : 'codes=' + encodeURIComponent(codes.join(',')));
  },

  /** 실패 원인을 사람이 읽을 수 있게 분류 */
  explain(e, url) {
    const msg = String((e && e.message) || e || '');
    if (/프록시 URL/.test(msg)) return { kind: 'noproxy', short: '프록시 미설정', detail: msg };
    if (/aborted|abort|timeout/i.test(msg)) return { kind: 'timeout', short: '응답 시간 초과', detail: '프록시 서버가 응답하지 않습니다. 서버가 실행 중인지, 주소가 맞는지 확인하세요.' };
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(msg)) return {
      kind: 'network', short: '연결 실패 (프록시 미실행 또는 CORS 차단)',
      detail: '브라우저가 ' + (url || '프록시 주소') + ' 에 접속하지 못했습니다.\n① 프록시 서버가 실행 중인지 (node server.js)\n② 주소·포트가 맞는지\n③ https 페이지에서 http 주소를 부르고 있지 않은지 확인하세요.' };
    if (/^HTTP 404/.test(msg)) return { kind: 'http', short: 'HTTP 404 — 경로 오류', detail: '프록시 주소의 경로가 잘못되었습니다. 예: http://127.0.0.1:8787/api/price?code={code}' };
    if (/^HTTP 5/.test(msg)) return { kind: 'http', short: msg + ' — 프록시 내부 오류', detail: '프록시 서버가 시세 제공원에서 데이터를 받지 못했습니다. 서버 콘솔 로그를 확인하세요.' };
    if (/^HTTP/.test(msg)) return { kind: 'http', short: msg, detail: '프록시 서버가 오류 응답을 반환했습니다.' };
    if (/JSON|Unexpected token|해석/.test(msg)) return { kind: 'parse', short: '응답 형식 오류', detail: '프록시가 JSON이 아닌 응답을 반환했습니다. 주소가 프록시 API가 맞는지 확인하세요.' };
    return { kind: 'other', short: msg || '알 수 없는 오류', detail: msg };
  },

  normalize(d, code, srcHint) {
    const num = (x) => K.n(parseFloat(String(x === undefined || x === null ? 0 : x).replace(/,/g, '')));
    const price = num(d.closePrice !== undefined ? d.closePrice : (d.price !== undefined ? d.price : d.now));
    if (!(price > 0)) throw new Error('가격 데이터를 해석할 수 없습니다');
    // NAV(순자산가치) — ETF 만 제공되며 시세원에 따라 없을 수 있다
    const nav = num(d.nav !== undefined ? d.nav : (d.navPrice !== undefined ? d.navPrice : d.netAssetValue));
    let rate = d.changeRate;
    if (rate === undefined || rate === null) rate = num(d.fluctuationsRatio !== undefined ? d.fluctuationsRatio : d.rate) / 100;
    return {
      code, name: d.stockName || d.name || d.itemName || null, price,
      change: num(d.compareToPreviousClosePrice !== undefined ? d.compareToPreviousClosePrice : (d.change !== undefined ? d.change : d.diff)),
      changeRate: K.n(rate),
      volume: num(d.accumulatedTradingVolume !== undefined ? d.accumulatedTradingVolume : (d.volume !== undefined ? d.volume : d.quant)),
      marketStatus: d.marketStatus || d.status || 'UNKNOWN',
      nav: nav > 0 ? nav : null,
      asOf: d.localTradedAt || d.asOf || new Date().toISOString(),
      source: d.source || srcHint || '프록시 경유',
    };
  },

  async request(codes, timeoutMs) {
    const url = this.buildUrl(codes);
    if (!url) throw new Error('프록시 URL이 설정되지 않았습니다.');
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), timeoutMs || 9000);
    let res;
    try { res = await fetch(url, { signal: ctl.signal, headers: { Accept: 'application/json' }, cache: 'no-store' }); }
    catch (e) { e.__url = url; throw e; }
    finally { clearTimeout(to); }
    if (!res.ok) { const e = new Error('HTTP ' + res.status); e.__url = url; throw e; }
    let j;
    try { j = await res.json(); } catch (e) { const x = new Error('JSON 파싱 실패'); x.__url = url; throw x; }
    return { json: j, url };
  },

  async fetchOne(code) {
    const { json, url } = await this.request([code]);
    const d = json && json.datas && json.datas[0] ? json.datas[0] : json;
    if (d && d.error) { const e = new Error(d.error); e.__url = url; throw e; }
    return this.normalize(d, code, json.source);
  },

  /** 일괄 조회 — 프록시가 codes 파라미터를 지원하면 1회 호출로 끝낸다 */
  async fetchMany(codes) {
    const { json } = await this.request(codes, 15000);
    const arr = json && json.datas ? json.datas : (Array.isArray(json) ? json : null);
    if (!arr) throw new Error('일괄 응답 형식이 아닙니다');
    const out = {};
    arr.forEach((d, i) => {
      const code = String(d.code || codes[i] || '').trim();
      if (!code) return;
      if (d.error) { out[code] = { error: d.error }; return; }
      try { out[code] = this.normalize(d, code, json.source); }
      catch (e) { out[code] = { error: String(e.message || e) }; }
    });
    return out;
  },

      '실패했을 때만 공식값으로 채웁니다. 어느 쪽을 썼는지는 <b>NAV 출처</b> 열에 표시됩니다.</div>',
      [{ label: '닫기', value: null }, { label: '연결 상태 다시 확인', value: 'again', cls: 'pri' }])
      .then((x) => { if (x === 'again') this.officialNavGuide(); });
  },

  async ping(base, ms) {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), ms || 2500);
    try {
      const r = await fetch(base + '/health', { signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) return false;
      const j = await r.json();
      return !!(j && j.ok);
    } catch (e) { return false; } finally { clearTimeout(to); }
  },
  /** 후보 주소를 순서대로 두드려 살아있는 프록시를 찾는다. 찾으면 설정에 저장. */
  async autoDetect(save) {
    for (const url of this.candidates()) {
      const base = url.split('/api/')[0];
      if (await this.ping(base)) {
        if (save !== false) { Store.state.settings.proxyUrl = url; await Store.save(); }
        return url;
      }
    }
    return null;
  },

  /** 프록시의 다른 API 경로 만들기 (/api/price → /api/nav 등) */
  apiUrl(path, qs) {
    const p = this.proxy(); if (!p) return null;
    const base = p.split('?')[0].replace(/\/api\/(price|prices)$/, '/api/' + path);
    const url = base === p.split('?')[0] ? p.split('?')[0] : base;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + qs;
  },

  /** NAV 일괄 조회 — 서버가 KRX·네이버를 순서대로 시도한다 */
  async fetchNav(codes) {
    const url = this.apiUrl('nav', 'codes=' + encodeURIComponent(codes.join(',')));
    if (!url) throw new Error('프록시 URL이 설정되지 않았습니다.');
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 20000);
    let r; try { r = await fetch(url, { signal: ctl.signal, cache: 'no-store' }); }
    catch (e) { e.__url = url; throw e; } finally { clearTimeout(to); }
    if (!r.ok) { const e = new Error('HTTP ' + r.status); e.__url = url; throw e; }
    return r.json();
  },

  /** 종목명 또는 종목코드로 검색 — 프록시의 /api/search 사용 */
  async search(q) {
    const p = this.proxy();
    if (!p) throw new Error('프록시 URL이 설정되지 않았습니다.');
    const base = p.split('?')[0].replace(/\/api\/(price|prices)$/, '/api/search');
    const url = base === p.split('?')[0]
      ? p.split('?')[0] + (p.indexOf('?') >= 0 ? '?' : '?') + 'q=' + encodeURIComponent(q)   // Vercel 단일 함수형
      : base + '?q=' + encodeURIComponent(q);
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 9000);
    let res; try { res = await fetch(url, { signal: ctl.signal, headers: { Accept: 'application/json' } }); }
    catch (e) { e.__url = url; throw e; } finally { clearTimeout(to); }
    if (!res.ok && res.status !== 404) { const e = new Error('HTTP ' + res.status); e.__url = url; throw e; }
    const j = await res.json();
    if (j && j.items && j.items.length) return j.items;
    if (VALID_CODE.test(q)) return [{ code: q, name: '', market: '', source: '직접 입력' }];
    return [];
  },

  /** 종목 기본정보(현재가·종목명·배당수익률 시도) */
  async meta(code) {
    const p = this.proxy();
    if (!p) throw new Error('프록시 URL이 설정되지 않았습니다.');
    const base = p.split('?')[0].replace(/\/api\/(price|prices)$/, '/api/meta');
    const url = base === p.split('?')[0]
      ? p.split('?')[0] + '?meta=' + encodeURIComponent(code)
      : base + '?code=' + encodeURIComponent(code);
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 9000);
    let res; try { res = await fetch(url, { signal: ctl.signal, headers: { Accept: 'application/json' } }); }
    catch (e) { e.__url = url; throw e; } finally { clearTimeout(to); }
    if (!res.ok) { const e = new Error('HTTP ' + res.status); e.__url = url; throw e; }
    return res.json();
  },

  /** 프록시 연결 진단 — 실패 원인을 구체적으로 알려준다 */
  async diagnose() {
    const steps = [];
    const p = this.proxy();
    steps.push({ ok: !!p, label: '프록시 URL 설정', detail: p || '설정되지 않음 — [데이터·설정] 화면에서 입력하세요' });
    if (!p) return { ok: false, steps };
    const isHttp = /^http:\/\//i.test(p), pageHttps = location.protocol === 'https:';
    if (isHttp && pageHttps) steps.push({ ok: false, label: '프로토콜 점검', detail: 'https 페이지에서 http 프록시를 호출하면 브라우저가 차단합니다(혼합 콘텐츠). 프록시도 https로 배포하거나, 대시보드를 http로 여세요.' });
    else steps.push({ ok: true, label: '프로토콜 점검', detail: '문제 없음 (' + (location.protocol || 'file:') + ' → ' + (isHttp ? 'http' : 'https') + ')' });
    // health
    try {
      const base = p.split('/api/')[0];
      const r = await fetch(base + '/health', { cache: 'no-store' });
      const j = await r.json();
      steps.push({ ok: true, label: '프록시 서버 응답', detail: '정상 · 시세원 ' + (j.source || '-') + ' · 가동 ' + Math.round(j.uptime || 0) + '초' });
    } catch (e) {
      const x = this.explain(e, p);
      steps.push({ ok: false, label: '프록시 서버 응답', detail: x.short + ' — ' + x.detail });
    }
    // 실제 1건 조회
    const t = this.targets()[0];
    if (t) {
      try {
        const d = await this.fetchOne(t.code);
        steps.push({ ok: true, label: '시세 조회 테스트 (' + t.code + ')', detail: t.name + ' ' + FMT.price(d.price) + '원 · ' + (d.source || '') });
      } catch (e) {
        const x = this.explain(e, e.__url);
        steps.push({ ok: false, label: '시세 조회 테스트 (' + t.code + ')', detail: x.short + '\n' + x.detail });
      }
    }
    return { ok: steps.every((s) => s.ok), steps };
  },

  async showGuide() {
    const here = location.protocol === 'file:' ;
    await modal('현재가 자동 조회 설정이 필요합니다',
      '<div class="callout info" style="margin-bottom:12px">현재가는 네이버 금융에서 가져오는데, 브라우저 보안정책(CORS) 때문에 웹페이지가 네이버를 직접 부를 수 없습니다. ' +
      '중간에서 대신 불러주는 <b>시세 서버</b>가 필요합니다. (원본 엑셀에서 Power Query가 하던 역할입니다)</div>' +
      '<div style="font-size:13.5px;line-height:2">' +
      '<b>단 두 번이면 됩니다.</b><br>' +
      '<b>①</b> 받으신 <code>배포</code> 폴더에서 <b>시세서버_실행' + (IS_MAC ? '.command' : '.bat') + '</b> 를 <b>더블클릭</b><br>' +
      '<span style="font-size:12px;color:var(--tx3)">→ 검은 창이 뜨고 브라우저가 자동으로 열립니다. 이 창은 켜 둔 채로 두세요.</span><br>' +
      '<b>②</b> 열린 화면에서 상단 <b>🔄 시세</b> 버튼을 누릅니다<br>' +
      '<span style="font-size:12px;color:var(--tx3)">→ 주소는 앱이 자동으로 찾습니다. 붙여넣을 필요 없습니다.</span>' +
      '</div>' +
      '<div class="note">Node.js 가 없다면 <code>nodejs.org</code> 에서 LTS 버전을 먼저 설치하세요. ' +
      '실행 파일이 알아서 확인하고 안내합니다.</div>' +
      (here ? '<div class="callout" style="margin-top:12px">지금 파일을 직접 열어 두셨습니다(<code>file://</code>). 프록시 서버를 켠 뒤 <code>http://127.0.0.1:8787/</code> 로 접속하시면 더 안정적으로 동작합니다.</div>' : '') +
      '<div class="note">서버를 켜기 어려우시면 <b>현재가 연동</b> 화면에서 현재가를 직접 입력하셔도 모든 계산이 동일하게 동작합니다.</div>',
      [{ label: '나중에', value: null }, { label: '설정 화면으로', value: 'go', cls: 'pri' }]).then((r) => { if (r === 'go') location.hash = '#/data'; });
  },

  async refresh(codes) {
    const targets = this.targets();
    const list = (codes || targets.map((i) => i.code)).filter((c) => this.isValid(c));
    const skipped = Store.state.instruments.length - targets.length;
    if (!list.length) { toast('조회할 종목이 없습니다. 종목코드를 먼저 입력하세요.', 'err'); return; }

    // ── 사전 점검: 프록시가 없으면 먼저 자동 감지를 시도한다 ──
    if (!this.proxy()) {
      toast('시세 서버를 찾는 중…');
      const found = await this.autoDetect();
      if (found) {
        toast('시세 서버를 자동으로 찾았습니다: ' + found.split('/api/')[0], 'ok');
      } else {
        this.lastReport = { at: new Date().toISOString(), ok: 0, ng: 0, skipped, reason: 'noproxy',
          summary: '시세 서버를 찾지 못해 조회를 시작하지 않았습니다.' };
        Router.render();
        this.showGuide();
        return;
      }
    }

    let ok = 0, ng = 0; const errs = {};
    const apply = (code, d) => {
      const prev = Store.state.prices[code] || { code };
      Store.state.prices[code] = Object.assign({}, prev, d, { status: 'ok', error: null, fetchedAt: new Date().toISOString() });
      Store.state.priceHistory.unshift({ ts: new Date().toISOString(), code, price: d.price });
      ok++;
    };
    const failOne = (code, e) => {
      const x = this.explain(e, e && e.__url);
      const prev = Store.state.prices[code] || { code };
      Store.state.prices[code] = Object.assign({}, prev, { status: 'error', error: x.short, errorDetail: x.detail, triedAt: new Date().toISOString() });
      errs[x.kind] = (errs[x.kind] || 0) + 1;
      errs.__last = x; ng++;
    };

    // ① 일괄 조회 시도 (프록시가 codes 를 지원하는 경우 1회 호출)
    let batchDone = false;
    if (list.length > 1 && this.buildUrl(list)) {
      list.forEach((c) => { this.busy[c] = true; }); Router.render();
      try {
        const map = await this.fetchMany(list);
        if (Object.keys(map).length) {
          list.forEach((c) => { const d = map[c]; if (d && !d.error) apply(c, d); else failOne(c, new Error((d && d.error) || '응답에 종목이 없습니다')); });
          batchDone = true;
        }
      } catch (e) { /* 개별 조회로 폴백 */ }
      finally { list.forEach((c) => { this.busy[c] = false; }); }
    }

    // ② 개별 조회 (일괄 미지원·실패 시)
    if (!batchDone) {
      for (const code of list) {
        this.busy[code] = true; Router.render();
        try { apply(code, await this.fetchOne(code)); }
        catch (e) {
          failOne(code, e);
          // 첫 종목부터 연결 자체가 안 되면 나머지는 시도하지 않고 즉시 중단
          const x = this.explain(e, e && e.__url);
          if (ok === 0 && (x.kind === 'network' || x.kind === 'timeout' || x.kind === 'http')) {
            list.slice(list.indexOf(code) + 1).forEach((c) => failOne(c, e));
            this.busy[code] = false;
            break;
          }
        }
        finally { this.busy[code] = false; }
      }
    }

    // ── 시세를 받았으면 NAV 도 함께 갱신 ──
    // 2026-08-11: 맥쿼리인프라는 ETF가 아니라 개별 상장 인프라펀드라 NAV 개념 자체가 없음.
    // (주의: 종목코드를 주석에 직접 적지 말 것 — 암호화 공유 파일의 평문 코드 노출 검증에 걸림)
    // 여기서 NAV 조회 대상에서 제외해야 Store.state.prices[해당코드].nav 가 절대 채워지지 않고,
    // computeInstrument() 의 priceMeta 는 이 객체를 그대로 참조하므로 화면(NAV·괴리율) 모두 자동으로 빈 값이 된다.
    const nonEtfCodes = new Set(Store.state.instruments.filter((i) => i.sheet === '맥쿼리인프라').map((i) => i.code));
    const navList = list.filter((c) => !nonEtfCodes.has(c));
    let navOk = 0; this.lastNavErr = null;
    if (ok > 0 && navList.length) {
      try {
        const j = await this.fetchNav(navList);
        Object.keys(j.navs || {}).forEach((c) => {
          if (nonEtfCodes.has(c)) return;             // 방어적 이중 체크 — 혹시 서버가 돌려줘도 무시
          const p2 = Store.state.prices[c]; if (!p2) return;
          p2.nav = K.n(j.navs[c].nav); p2.navSource = j.navs[c].source;
          p2.navRealtime = !!j.navs[c].realtime; p2.navStale = !!j.navs[c].stale;
          p2.navOfficial = !!j.navs[c].official; p2.navAsOf = j.navs[c].asOf || '';
          p2.navAt = new Date().toISOString(); navOk++;
        });
        if (!navOk) this.lastNavErr = 'NAV 를 제공하는 소스를 찾지 못했습니다' + ((j.tried || []).length ? ' (' + j.tried.join(' / ') + ')' : '');
      } catch (e) {
        const x = this.explain(e, e && e.__url);
        this.lastNavErr = (String(e.message || e).indexOf('404') >= 0)
          ? '서버에 NAV 기능이 없습니다 — 최신 server.js / server.ps1 로 교체하세요'
          : x.short;
      }
    }
    this.lastNavCount = navOk;
    if (Store.state.priceHistory.length > 2000) Store.state.priceHistory.length = 2000;
    Store.state.settings.lastRefresh = new Date().toISOString();
    const last = errs.__last;
    this.lastReport = { at: new Date().toISOString(), ok, ng, skipped, batch: batchDone,
      reason: last ? last.kind : null, summary: last ? last.short : null, detail: last ? last.detail : null };
    await Store.commit('현재가 갱신', list.length + '종목', null, { 성공: ok, 실패: ng, 제외: skipped }, last ? last.short : '');
    if (ng && !ok) {
      toast('시세 조회 실패 — ' + (last ? last.short : '원인 미상'), 'err');
      modal('현재가를 가져오지 못했습니다',
        '<div class="callout err" style="margin-bottom:12px"><b>' + esc(last ? last.short : '원인 미상') + '</b><br>' +
        esc(last ? last.detail : '').replace(/\n/g, '<br>') + '</div>' +
        '<div class="note">조회 실패와 관계없이 <b>마지막 정상 가격이 그대로 유지</b>되며 모든 계산은 정상 동작합니다. ' +
        '현재가 연동 화면에서 직접 입력하셔도 됩니다.</div>',
        [{ label: '닫기', value: null }, { label: '연결 진단 실행', value: 'diag', cls: 'pri' }]).then((r) => { if (r === 'diag') runDiagnose(); });
    } else if (ng) {
      toast('현재가 갱신: 성공 ' + ok + '건 / 실패 ' + ng + '건 — ' + (last ? last.short : ''), 'err');
    } else {
      toast('현재가 갱신 완료: ' + ok + '건' + (navOk ? ' · NAV ' + navOk + '건' : (this.lastNavErr ? ' · NAV 실패' : '')) +
        (skipped ? ' (종목코드 없는 ' + skipped + '건 제외)' : ''), 'ok');
    }
  },
};

async function runDiagnose() {
  const bg = await modal('연결 진단', '<div class="loading"><span class="spin"></span>프록시 연결을 확인하는 중…</div>', [{ label: '닫기', value: null }]);
  const r = await Price.diagnose();
  await modal('연결 진단 결과',
    r.steps.map((s) => '<div style="display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line2)">' +
      '<span style="flex:0 0 18px;font-size:14px;color:' + (s.ok ? 'var(--ok)' : 'var(--err)') + '">' + (s.ok ? '✔' : '✗') + '</span>' +
      '<div><b style="font-size:12.5px">' + esc(s.label) + '</b>' +

          : '<div class="callout err" style="margin-top:12px">위의 ✗ 항목을 해결한 뒤 다시 시도하세요. 해결이 어려우면 <b>현재가 연동</b> 화면에서 현재가를 직접 입력하셔도 모든 계산이 동일하게 동작합니다.</div>'),

}

/* =========================================================================
 * 17. 공유 — 열람자용 파일 생성 & 실시간 동기화
 * ========================================================================= */

/* ---------- 17-A. 실시간 동기화 ----------------------------------------
 *  관리자 파일이 변경될 때마다 시세 서버(server.js / server.ps1)의
 *  /api/state 에 상태를 올리고, 열람자 파일은 주기적으로 버전을 확인해
 *  바뀌었으면 내려받아 화면을 갱신한다.
 *  · 서버가 꺼져 있으면 열람자는 파일에 박힌 스냅샷으로 계속 동작한다.
 *  · 쓰기(PUT)는 관리자 토큰이 있어야 하므로 열람자는 수정할 수 없다.
 * --------------------------------------------------------------------- */
const BM = (typeof BUILD_META !== 'undefined' && BUILD_META) || {};
const CLOUD_VIEWER = !!(VIEWER_MODE && BM.cloud);
const ENC_PAYLOAD = (typeof PAYLOAD !== 'undefined' && PAYLOAD) || null;
const ENC_VIEWER = !!(VIEWER_MODE && BM.encrypted && ENC_PAYLOAD);
const LOCKED = CLOUD_VIEWER || ENC_VIEWER;

const Sync = {
  timer: null, pushTimer: null, busy: false, lastErr: null,
  lastPull: null, lastPush: null, remoteVersion: null, lastCode: null, lastVersionInfo: null,

  /** 열람 비밀번호 — 세션 동안만 브라우저에 유지 (창을 닫으면 사라짐) */
  viewToken() { try { return sessionStorage.getItem('irp_view_token') || ''; } catch (e) { return this._vt || ''; } },
  setViewToken(v) { try { sessionStorage.setItem('irp_view_token', v || ''); } catch (e) { this._vt = v || ''; } },
  clearViewToken() { try { sessionStorage.removeItem('irp_view_token'); } catch (e) { this._vt = ''; } },

  base() {
    const st = Store.state.settings;
    if (BM.syncUrl) return String(BM.syncUrl).replace(/\/+$/, '');
    if (st.syncUrl) return String(st.syncUrl).replace(/\/+$/, '');
    const p = (st.proxyUrl || '').trim();
    if (p) return p.split('/api/')[0];
    if (/^https?:$/.test(location.protocol) && location.origin && location.origin !== 'null') return location.origin;
    return '';
  },
  enabled() { return !!((Store.state.settings.syncEnabled || CLOUD_VIEWER) && this.base()); },
  statusText() {
    if (!this.base()) return '시세 서버 주소를 찾지 못했습니다';
    if (!Store.state.settings.syncEnabled) return '설정에서 켤 수 있습니다';
    if (this.lastErr) return '오류: ' + this.lastErr;
    if (VIEWER_MODE) return this.lastPull ? '마지막 수신 ' + FMT.dt(this.lastPull) : '서버 연결 대기 중';
    return this.lastPush ? '마지막 전송 ' + FMT.dt(this.lastPush) : '변경이 생기면 전송합니다';
  },
  /** 동기화 대상 — 포트폴리오 데이터만. 화면설정·테마 등 개인 설정은 제외 */
  payload() {
    const S = Store.state;
    return { meta: S.meta, instruments: S.instruments, prices: S.prices, tradeLog: S.tradeLog,
      audit: (S.audit || []).slice(0, 100) };
  },
  async req(path, opt) {
    const b = this.base();
    if (!b) throw new Error('서버 주소 없음');
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), (opt && opt.ms) || 6000);
    try {
      const o = Object.assign({ signal: ctl.signal, cache: 'no-store', headers: { Accept: 'application/json' } }, opt || {});
      if (o.body) o.headers = Object.assign({ 'Content-Type': 'application/json' }, o.headers);
      const tok = Store.state.settings.adminToken;
      if (tok) o.headers['X-Admin-Token'] = tok;
      const vt = this.viewToken();
      if (vt) o.headers['X-View-Token'] = vt;
      const r = await fetch(b + path, o);
      this.lastCode = r.status;
      if (!r.ok) {
        let msg = 'HTTP ' + r.status;
        try { const j = await r.json(); if (j && j.error) msg = j.error; if (j && j.code) msg = '[' + j.code + '] ' + msg; } catch (e) {}
        const err = new Error(msg); err.status = r.status; throw err;
      }
      return r.json();
    } finally { clearTimeout(to); }
  },

  /* --- 관리자: 변경 사항 전송 (0.8초 디바운스) --- */
  schedulePush() {
    if (VIEWER_MODE || !this.enabled()) return;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.push(), 800);
  },
  async push(silent) {
    if (VIEWER_MODE || !this.enabled()) return false;
    try {
      const j = await this.req('/api/state', { method: 'PUT', body: JSON.stringify(this.payload()) });
      this.remoteVersion = j && j.version; this.lastPush = new Date().toISOString(); this.lastErr = null;
      if (!silent) toast('열람자 화면에 반영했습니다 (v' + this.remoteVersion + ')', 'ok');
      return true;
    } catch (e) {
      this.lastErr = String(e.message || e);
      if (!silent) toast('동기화 전송 실패 — ' + this.lastErr, 'err');
      return false;
    }
  },

  /* --- 열람자: 주기적으로 버전 확인 후 변경분 수신 --- */
  start() {
    this.stop();
    if (!this.enabled()) return;
    const ms = Math.max(5, K.n(Store.state.settings.syncInterval) || 15) * 1000;
    const tick = async () => { await this.pull(true); };
    this.timer = setInterval(tick, ms);
    tick();
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  async pull(silent, force) {
    if (this.busy || !this.enabled()) return false;
    this.busy = true;
    try {
      const v = await this.req('/api/state/version', { ms: 4000 });
      this.lastVersionInfo = v || null;
      if (!v || !v.version) { this.lastErr = null; return false; }
      if (this.remoteVersion === v.version && !force) { this.lastErr = null; return false; }
      const j = await this.req('/api/state', { ms: 10000 });
      if (!j || !j.state || !j.state.instruments) return false;
      const d = j.state;
      Store.state.meta = Object.assign(Store.state.meta, d.meta || {});
      Store.state.instruments = d.instruments;
      if (d.prices) Store.state.prices = Object.assign({}, Store.state.prices, d.prices);
      if (d.tradeLog) Store.state.tradeLog = d.tradeLog;
      if (d.audit) Store.state.audit = d.audit;
      this.remoteVersion = j.version; this.lastPull = new Date().toISOString(); this.lastErr = null;
      Store.recompute(); await Store.save();
      if ($('#view')) Router.render();
      if (!force) toast('관리자가 수정한 내용을 받았습니다 (' + FMT.dt(j.updatedAt) + ')', 'ok');
      return true;
    } catch (e) {
      this.lastErr = String(e.message || e);
      if (!silent) toast('동기화 수신 실패 — ' + this.lastErr, 'err');
      return false;
    } finally { this.busy = false; }
  },

  panel() {
    const S = Store.state.settings, on = !!S.syncEnabled, b = this.base();
    const role = VIEWER_MODE ? '열람자' : '관리자';
    return '<div class="panel"><header><h2>실시간 동기화 <span class="chip ' + (on ? 'ok' : '') + '">' + (on ? '켜짐' : '꺼짐') + '</span></h2>' +
      '<span class="sub">' + role + ' 모드 · ' + esc(this.statusText()) + '</span><span class="sp"></span>' +
      (VIEWER_MODE ? '<button class="btn sm" data-act="syncPull">지금 받기</button>'
                   : '<button class="btn sm" data-act="syncPush">지금 보내기</button>') +
      '</header><div class="body">' +
      '<div class="frow">' +
      '<div><label class="fl">동기화 사용</label><select data-set="syncEnabled"><option value=""' + (on ? '' : ' selected') + '>끄기</option><option value="1"' + (on ? ' selected' : '') + '>켜기</option></select></div>' +
      '<div><label class="fl">서버 주소 (비우면 자동)</label><input type="text" data-set="syncUrl" placeholder="' + esc(b || 'http://127.0.0.1:8787') + '" value="' + esc(S.syncUrl || '') + '"></div>' +
      (VIEWER_MODE ? '<div><label class="fl">확인 주기 (초)</label><input type="number" data-set="syncInterval" value="' + (K.n(S.syncInterval) || 15) + '" min="5" step="5"></div>'
                   : '<div><label class="fl">관리자 토큰 (선택)</label><input type="text" class="key" data-set="adminToken" placeholder="서버 ADMIN_TOKEN 과 동일하게" value="' + esc(S.adminToken || '') + '"></div>') +
      '</div>' +
      '<div class="note">' +
      (VIEWER_MODE
        ? '동기화를 켜면 <b>' + ((K.n(S.syncInterval) || 15)) + '초마다</b> 서버를 확인해 관리자가 수정한 내용을 자동으로 받아옵니다. ' +
          '서버가 꺼져 있으면 이 파일에 저장된 시점의 데이터로 계속 동작하며, 화면이 멈추거나 오류가 나지 않습니다.'
        : '동기화를 켜면 매수·매도·배당·목표 등을 <b>수정할 때마다</b> 자동으로 서버에 올려 열람자 화면에 반영됩니다. ' +
          '시세 서버(<code>시세서버_실행.bat</code>)가 켜져 있어야 하며, 열람자도 같은 서버에 접속할 수 있어야 합니다. ' +
          '서버에 <code>ADMIN_TOKEN</code> 환경변수를 설정하면 이 토큰을 가진 관리자만 데이터를 바꿀 수 있습니다.') +
      '</div>' +
      '<div class="note">현재 서버 주소: <b>' + esc(b || '(찾지 못함)') + '</b>' +
      (this.remoteVersion ? ' · 서버 데이터 버전 v' + this.remoteVersion : '') + '</div>' +
      '</div></div>';
  },
};

  out = out.replace(/<title>[\s\S]*?<\/title>/, '<title>IRP 포트폴리오 대시보드' + (cloud ? '' : ' (열람용)') + '</title>');

  await Store.save();

  if (cloud) {

      '<b>3.</b> Vercel 대시보드 → <b>Storage</b> → <b>KV</b> 생성 후 프로젝트에 연결<br>' +
      '<b>4.</b> <b>Settings → Environment Variables</b> 에 아래 두 개 추가<br>' +
      '<div style="background:var(--input);border:1px solid var(--input-bd);border-radius:7px;padding:9px 11px;margin:7px 0;font-family:var(--mono);font-size:12px">' +
      'VIEW_PASSCODE = 아버지께 알려드릴 번호<br>ADMIN_TOKEN = 나만 아는 긴 문자열</div>' +
      '<b>5.</b> 이 관리자 파일의 <b>데이터·설정 → 실시간 동기화</b> 에<br>' +
      '&nbsp;&nbsp;&nbsp;서버 주소 <code>' + esc(meta.syncUrl) + '</code> 와 관리자 토큰을 입력<br>' +
      '<b>6.</b> 아버지께 <b>' + esc(meta.syncUrl) + '</b> 링크와 비밀번호를 알려드리면 끝' +
      '</div>' +
      '<div class="note">' + (pushed ? '현재 데이터를 서버에 올려두었습니다.' : '아직 서버에 데이터를 올리지 못했습니다. 배포 후 <b>지금 보내기</b>를 눌러 주세요.') +
      ' 이후 관리자 파일에서 무언가 수정하면 ' + meta.syncInterval + '초 안에 아버지 화면에 자동 반영됩니다.</div>',
      [{ label: '확인', value: null }]);
  } else {

      '<div style="font-size:13px;line-height:1.9">이 파일을 전달하시면 됩니다. 받는 분은 <b>더블클릭</b>만 하면 열립니다.<br>' +
      (meta.sync ? '실시간 동기화가 <b>켜져</b> 있습니다 (' + esc(meta.syncUrl) + ').' : '동기화는 <b>꺼져</b> 있습니다. 만든 시점 데이터로 고정됩니다.') +
      '</div>' +

/* ---------- 17-C. 클라우드 열람용 — 비밀번호 잠금 화면 ------------------
 *  이 파일에는 금융 데이터가 들어 있지 않다. 비밀번호가 맞아야 서버에서
 *  데이터를 받아오며, 비밀번호는 서버가 검증한다(클라이언트 우회 불가).
 * --------------------------------------------------------------------- */
const Lock = {
  render(msg, busy) {
    document.body.innerHTML =
      '<div class="lockwrap"><div class="lockbox">' +
      '<div class="lockicon">🔒</div>' +
      (ENC_VIEWER ? '' : '') +
      '<h1>IRP 포트폴리오 대시보드</h1>' +
      '<p class="lsub">' + esc(BM.notice || '열람용 페이지입니다') + '</p>' +
      '<form id="lockform" autocomplete="off">' +
      '<label class="fl">비밀번호</label>' +
      '<input type="password" id="pw" inputmode="numeric" autocomplete="current-password" placeholder="알려드린 번호를 입력하세요">' +
      '<button class="btn pri lockbtn" type="submit"' + (busy ? ' disabled' : '') + '>' +
      (busy ? '<span class="spin"></span>확인 중…' : '들어가기') + '</button>' +
      '</form>' +
      (msg ? '<div class="lockmsg">' + esc(msg) + '</div>' : '') +
      '<div class="lfoot">비밀번호는 이 창을 닫으면 지워집니다.<br>' +
      (ENC_VIEWER
        ? '내용은 <b>AES-256</b> 으로 암호화되어 있습니다. 비밀번호 없이는 누구도 열 수 없습니다.'
        : '데이터는 이 페이지가 아니라 서버에 있으며, 비밀번호가 맞아야 내려받습니다.') + '</div>' +
      '</div></div>';
    const f = $('#lockform'), pw = $('#pw');
    if (pw) pw.focus();
    if (f) f.onsubmit = async (e) => {
      e.preventDefault();
      const v = String(pw.value || '').trim();
      if (!v) { this.render('비밀번호를 입력하세요.'); return; }
      this.render('', true);
      await this.tryUnlock(v);
    };
  },
  async tryUnlock(pass) {
    // ── 암호화 파일: 서버 없이 그 자리에서 복호화 ──
    if (ENC_VIEWER) {
      try {
        const data = await Crypt.decrypt(ENC_PAYLOAD, pass);
        Store.state.meta = Object.assign(Store.state.meta, data.meta || {});
        Store.state.instruments = data.instruments || [];
        Store.state.prices = data.prices || {};
        Store.state.tickers = data.tickers || {};
        Store.state.tradeLog = data.tradeLog || [];
        Store.recompute();
        try { sessionStorage.setItem('irp_pass', pass); } catch (e) {}
        return this.enter();
      } catch (e) {
        return this.render('비밀번호가 맞지 않습니다. 대소문자와 하이픈(-)까지 그대로 입력해 주세요.');
      }
    }
    Sync.setViewToken(pass);
    try {
      const okPull = await Sync.pull(true, true);
      if (okPull) return this.enter();
      const st = Sync.lastCode;
      const vi = Sync.lastVersionInfo;
      if (st === 401 || st === 403) { Sync.clearViewToken(); return this.render('비밀번호가 맞지 않습니다. 다시 확인해 주세요.'); }
      // 비밀번호는 통과했지만(200) 서버에 아직 데이터가 없는 경우
      if (vi && !vi.hasState) return this.render('비밀번호는 맞았지만 아직 공유된 데이터가 없습니다. 관리자가 [지금 보내기]를 눌러야 합니다.');
      if (st === 404) return this.render('아직 공유된 데이터가 없습니다. 관리자가 먼저 데이터를 올려야 합니다.');
      return this.render('서버에 연결하지 못했습니다. ' + (Sync.lastErr || '') + ' — 잠시 후 다시 시도해 주세요.');
    } catch (e) {
      Sync.clearViewToken();
      return this.render('연결 오류: ' + String(e.message || e));
    }
  },
  enter() {
    document.body.innerHTML = APP_SHELL();
    applyTheme();
    Router.start();
    if (ENC_VIEWER) { Watcher.start(BM.watch); } else { Sync.start(); }
  },
  async boot() {
    if (ENC_VIEWER) {
      if (!Crypt.ok()) { this.render('이 브라우저는 암호 해제를 지원하지 않습니다. 크롬·삼성인터넷 최신 버전으로 열어 주세요.'); return; }
      let saved = null;
      try { saved = sessionStorage.getItem('irp_pass'); } catch (e) {}
      if (saved) { this.render('', true); try { await this.tryUnlock(saved); return; } catch (e) {} }
      this.render();
      return;
    }
    const saved = Sync.viewToken();
    if (saved) { this.render('', true); const ok = await Sync.pull(true, true); if (ok) return this.enter(); Sync.clearViewToken(); }
    this.render();
  },
};

/* =========================================================================
 * 17-D. 암호화 공유 — 서버 없이 링크 하나로
 *
 *  데이터를 비밀번호로 암호화해 파일 안에 넣는다.
 *  · 서버·데이터베이스·환경변수가 전혀 필요 없다 (드래그 한 번으로 배포).
 *  · 비밀번호를 모르면 복호화 자체가 불가능하다. 잠금 화면을 우회해도 소용없다.
 *  · 호스팅 업체조차 내용을 볼 수 없다.
 *  방식: PBKDF2-HMAC-SHA256(310,000회) → AES-256-GCM
 * ========================================================================= */
const Crypt = {
  ITER: 310000,
  _e: null, _d: null,
  get enc() { return this._e || (this._e = new TextEncoder()); },
  get dec() { return this._d || (this._d = new TextDecoder()); },
  ok() { try { return !!(typeof crypto !== 'undefined' && crypto.subtle && typeof TextEncoder !== 'undefined'); } catch (e) { return false; } },
  b64(buf) { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); },
  unb64(str) { const s = atob(str); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; },
  async key(pass, salt, iter) {
    const base = await crypto.subtle.importKey('raw', this.enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iter || this.ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async encrypt(obj, pass) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const k = await this.key(pass, salt);
    const data = this.enc.encode(JSON.stringify(obj));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, data);
    return { v: 1, alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: this.ITER,
      salt: this.b64(salt), iv: this.b64(iv), ct: this.b64(ct) };
  },
  async decrypt(box, pass) {
    const salt = this.unb64(box.salt), iv = this.unb64(box.iv), ct = this.unb64(box.ct);
    const k = await this.key(pass, salt, box.iter);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, ct);   // 비밀번호가 틀리면 여기서 예외
    return JSON.parse(this.dec.decode(pt));
  },
};

/** 파일이 새로 올라오면 자동으로 새로고침 — 서버 없이 '실시간'에 가깝게 */
const Watcher = {
  timer: null, tag: null,
  start(sec) {
    if (!/^https?:$/.test(location.protocol)) return;      // file:// 은 감시 불가
    this.stop();
    const ms = Math.max(20, sec || 60) * 1000;
    const check = async () => {
      try {
        const r = await fetch(location.pathname + '?_w=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
        const t = r.headers.get('etag') || r.headers.get('last-modified') || r.headers.get('content-length');
        if (!t) return;
        if (this.tag === null) { this.tag = t; return; }
        if (this.tag !== t) { this.tag = t; toast('새 자료가 올라왔습니다. 화면을 갱신합니다…', 'ok'); setTimeout(() => location.reload(), 1200); }
      } catch (e) { /* 조용히 무시 */ }
    };
    this.timer = setInterval(check, ms);
    check();
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
};

/** 지급일이 지났는데 아직 실수령으로 등록되지 않은 배당 회차를 모은다 */
function pendingDividends(todayIso) {
  const today = todayIso || Store.baseDate();
  const out = [];
  Store.view.computed.forEach((c) => {
    const inst = Store.inst(c.id);
    if (!inst || !c.schedule.length) return;
    const got = new Set((inst.dividendReceipts || []).map((d) => K.ymKey(d.date)));
    c.schedule.forEach((r) => {
      if (!r.payDate || r.payDate > today) return;
      if (r.shares <= 0) return;
      if (got.has(K.ymKey(r.payDate))) return;
      out.push({
        instId: c.id, name: c.name, code: c.code, sheet: c.sheet,
        exDate: r.exDate, payDate: r.payDate, shares: r.shares,
        perShare: r.perShare, amount: r.amount, seq: r.seq,
      });
    });
  });
  return out.sort((a, b) => (a.payDate < b.payDate ? 1 : a.payDate > b.payDate ? -1 : a.name.localeCompare(b.name, 'ko')));
}

/** 2026-08-11: "배당 자동 업데이트" 요청 — 지급일이 지났는데 아직 등록 안 된 배당을
 *  사람이 모달을 열어 확인·클릭하지 않아도 자동으로 등록한다.
 *  - 금액 산정: 이미 정확한 배당기준일(락일) 시점 보유수량 × 주당분배금 가정치를 그대로 씀
 *    (calc.js buildSchedule() 의 sharesAsOf(ex) — 매수·매도 이력 기준, 현재 보유수량이 아님).
 *  - 반영 시점: 지급일(payDate)이 지난 것만 대상으로 함 — 배당락일이 아니라 실제 입금일 기준.
 *  - 실제 운용사 공시금액을 프로그램으로 자동 조회하는 방법은 조사했으나 찾지 못했다
 *    (금융위 공식 API는 일정만 제공, KRX·운용사 사이트는 로그인 필요 또는 안정적인 API 없음).
 *    그래서 등록은 하되 kind:'자동추정' / verified:false 로 표시해 두고, 화면에서 눈에 띄게
 *    보여준 뒤 실제 공시와 대조해 사용자가 직접 확인·수정할 수 있게 한다 — "가시성" 요구사항.
 */
async function autoPostDividends() {
  if (VIEWER_MODE) return null;
  const pend = pendingDividends().filter((p) => p.amount > 0);
  if (!pend.length) return null;
  const byInst = {};
  let total = 0;
  pend.forEach((p) => {
    const inst = Store.inst(p.instId); if (!inst) return;
    inst.dividendReceipts.push({
      id: uid('div'), date: p.payDate, amount: Math.round(p.amount), kind: '자동추정', verified: false, auto: true,
      memo: '자동반영 · 배당기준일 ' + p.exDate + ' 보유 ' + FMT.qtyN(p.shares) + '주 × ' + p.perShare + '원(가정치) — 운용사 공시로 실제 금액 확인 후 "확인" 또는 수정 필요',
    });
    inst.dividendReceipts.sort((a, b) => (a.date < b.date ? -1 : 1));
    byInst[inst.name] = (byInst[inst.name] || 0) + p.amount;
    total += p.amount;
  });
  const count = pend.length;
  if (!count) return null;
  await Store.commit('배당 자동 반영', count + '건', null, { 합계: Math.round(total) },
    '지급일 경과 · 가정치 기준 자동등록(미검증) — ' + Object.keys(byInst).join(', '));
  return { count, total, byInst };
}

/* =========================================================================
 * 18. ETF 구성종목 (Look-through)
 *
 *  ETF 를 뚫고 내려가 실제로 어떤 개별 종목을 얼마나 들고 있는지 본다.
 *  여러 ETF 에 겹치는 종목은 한 줄로 합산한다.
 *    실질 보유금액 = Σ (ETF 평가금액 × 그 ETF 내 구성비중)
 *
 *  ※ 구성종목 데이터는 원본 엑셀에 없다. 프록시로 자동 조회를 시도하고,
 *    안 되면 운용사 페이지에서 복사해 붙여넣을 수 있게 한다.
 * ========================================================================= */
const TOPN = 8;

function cpx() { return Store.state.constituentPrices || (Store.state.constituentPrices = {}); }

// 2026-08-12: 해외 구성종목은 현재가가 달러로 내려오는데, 화면엔 원화 표시(CELL.price 등)를
// 그대로 써서 "숫자는 맞는데 단위가 원이 아니라 잘못돼 보인다"는 문제가 있었다. 국내코드가
// 아닌(K.isForeignCode) 종목은 Price.fx(환율)가 있으면 원화로 환산해 보여주고, 없으면 달러
// 표기($)로 구분해 최소한 혼동은 막는다.
function fxPriceCell(r, v) {
  if (!v) return '<span style="color:var(--tx3)">미조회</span>';
  if (!K.isForeignCode(r.code)) return CELL.price(r, v);
  const fx = Price.currentFx();
  if (fx && fx.rate) {
    const krw = v * fx.rate;
    return CELL.price(r, krw) + ' <span style="font-size:10px;color:var(--tx3)" title="환율 ' +
      esc(fx.rate.toLocaleString('ko-KR')) + '원/달러 (' + esc(String(fx.date || '')) + ' ' + esc(fx.source || '') +
      ') 적용 · 원가 $' + esc(v.toLocaleString('en-US')) + '">환산</span>';
  }
  return '$' + esc(v.toLocaleString('en-US')) + ' <span style="font-size:10px;color:var(--tx3)" title="환율 정보가 없어 원화 환산이 안 됐습니다 — 시세 조회를 한 번 더 눌러 주세요(koreaexim.key 필요)">달러</span>';
}
function fxChangeCell(r, v) {
  if (!r.price) return '-';
  const fx = Price.currentFx();
  const fac = (K.isForeignCode(r.code) && fx && fx.rate) ? fx.rate : 1;
  const x = K.n(v) * fac;
  return '<span class="num ' + sgn(x) + '">' + (x > 0 ? '▲ ' : x < 0 ? '▼ ' : '') + FMT.amt(Math.abs(x)) + '</span>';
}

function lookThroughView() {
  return K.lookThrough(Store.view.computed, Store.view.totals.totalAssets, cpx(), TOPN);
}

/** "삼성전자 005930 25.3%" 같은 줄을 유연하게 해석 */
function parseHoldings(text) {
  const out = [];
  String(text || '').split(/\r?\n/).forEach((line) => {
    const raw = line.trim();
    if (!raw) return;
    let s = raw.replace(/^\s*\d{1,3}\s*[.)]\s*/, '');       // "1. " / "1) " 형태의 순번 제거
    // 국내 종목코드는 6자리이며 중간에 영문이 섞일 수 있다 (예: 12AB34 형태)
    const code = (s.match(/\b([0-9]{4}[0-9A-Za-z]{2})\b/) || [])[1] || '';
    if (code) s = s.replace(code, ' ');
    const pcts = s.match(/-?\d+(?:\.\d+)?\s*%?/g) || [];
    let w = 0;
    for (let i = pcts.length - 1; i >= 0; i--) {
      const v = parseFloat(pcts[i]);
      if (isFinite(v) && v > 0 && v <= 100) { w = v; s = s.replace(pcts[i], ' '); break; }
    }
    let name = s.replace(/[\t,|]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
    name = name.replace(/^\d{1,3}\s+/, '').trim();          // 앞에 남은 순번 숫자 제거
    if (!name && !code) return;
    if (!(w > 0)) return;
    out.push({ code: code || name, name: name || code, weight: w / 100 });
  });
  return out.sort((a, b) => b.weight - a.weight).slice(0, 60);   // 전체 보관 (통합 집계는 상위 TOPN 만 사용)
}

  const f = fundLinkOf(inst.name);
  const body =
    '<div class="callout info" style="margin-bottom:11px">운용사·네이버 페이지의 <b>구성종목 표를 그대로 복사해 붙여넣으세요.</b> ' +
    '종목명·종목코드·비중을 알아서 찾아냅니다. <b>전체 목록이 저장</b>되며, 통합 집계는 상위 ' + TOPN + '개만 사용합니다.' +
    (f ? '<br><a href="' + f.url + '" target="_blank" rel="noopener">' + esc(f.key) + ' 공시 페이지 열기 ↗</a>' : '') + '</div>' +
    '<label class="fl">붙여넣기 (한 줄에 한 종목)</label>' +
    '<textarea name="paste" rows="9" placeholder="예)&#10;1  삼성전자  005930  25.30%&#10;2  SK하이닉스  000660  8.15%&#10;삼성전자 25.3&#10;005930 삼성전자 25.3%"></textarea>' +
    (cur.length ? '<div class="note">현재 저장된 ' + cur.length + '개: ' + cur.map((x) => esc(x.name) + ' ' + FMT.pct(x.weight, 1)).join(', ') + '<br>붙여넣고 저장하면 <b>덮어씁니다.</b></div>' : '') +
    '<div id="prev"></div><div id="errs"></div>';
  const r = await modal('구성종목 입력 — ' + inst.name, body, [
    { label: '취소', value: null },
    { label: '자동 조회 시도', value: 'auto' },
    { label: '저장', cls: 'pri', collect: (bg) => {
      const parsed = parseHoldings(($('[name=paste]', bg) || {}).value);
      if (!parsed.length) { $('#errs', bg).innerHTML = errBox(['비중(%)이 있는 줄을 찾지 못했습니다. 종목명과 비중이 함께 있는 표를 붙여넣어 주세요.']); return false; }
      const sum = K.sum(parsed, (x) => x.weight);
      if (sum > 1.001) { $('#errs', bg).innerHTML = errBox(['비중 합계가 ' + FMT.pct(sum, 1) + ' 로 100%를 넘습니다. 값을 확인해 주세요.']); return false; }

    const ta = $('[name=paste]', bg), pv = $('#prev', bg);

      const p = parseHoldings(ta.value);
      pv.innerHTML = p.length
        ? '<div class="note" style="margin-top:9px"><b>인식된 ' + p.length + '개</b> (합계 ' + FMT.pct(K.sum(p, (x) => x.weight), 2) + ')<br>' +

  if (r === 'auto') return fetchHoldings(instId);
  if (!r) return;
  const before = cur.length;
  inst.holdings = r;
  await Store.commit('구성종목 입력', inst.name, { 개수: before }, { 개수: r.length, 상위: r[0] && r[0].name }, '');
  toast(inst.name + ' 구성종목 ' + r.length + '개를 저장했습니다.', 'ok');
}

/** 한 종목의 구성종목을 서버에서 가져온다 (실패 시 예외) */
async function pullHoldings(code) {
  const url = Price.apiUrl('etf', 'code=' + encodeURIComponent(code));
  if (!url) throw new Error('프록시 URL이 설정되지 않았습니다.');
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 25000);
  let res; try { res = await fetch(url, { signal: ctl.signal, cache: 'no-store' }); } finally { clearTimeout(to); }
  const j = await res.json().catch(() => null);
  if (!res.ok || !j || !j.holdings || !j.holdings.length) throw new Error((j && j.error) || ('HTTP ' + res.status));
  return j;
}

/** 전 종목 구성종목 자동 조회 */
async function fetchAllHoldings() {
  try {
    // 맥쿼리인프라는 ETF가 아니라 개별 상장 인프라펀드라 "구성종목" 조회 대상이 아님(항상 자기 자신 100%로 계산됨).
    const targets = Store.view.computed.filter((c) => c.mv > 0 && Price.isValid(c.code) && c.sheet !== '맥쿼리인프라');
    if (!targets.length) { toast('조회할 ETF가 없습니다.', 'err'); return; }
    if (!Price.proxy()) { const f = await Price.autoDetect(); if (!f) { Price.showGuide(); return; } }
    if (!(await Price.needCap('etf'))) return;
    let ok = 0, ng = 0; const fails = [];
    for (let i = 0; i < targets.length; i++) {
      const c = targets[i];
      toast('구성종목 조회 중… (' + (i + 1) + '/' + targets.length + ') ' + c.name.slice(0, 16));
      try {
        const j = await pullHoldings(c.code);
        const inst = Store.inst(c.id);
        // 2026-08-11: 예전엔 상위 60개까지만 저장했음 — FunETF 소스로 바뀌면서 100종목을 넘는
        // ETF도 실측되어(주의: 종목코드를 주석에 직접 적지 말 것 — 암호화 공유 파일의 평문 코드
        // 노출 검증에 걸림), 60개 cap이 다시 완전집계를 막는 원인이 될 수 있었다. 통합 집계용
        // 상위 TOPN 컷은 K.lookThrough 에서만 적용하고, 저장은 전체 목록을 그대로 한다.
        inst.holdings = j.holdings.map((x) => ({ code: String(x.code || x.name), name: x.name || x.code, weight: K.n(x.weight) }));
        inst.holdingsSource = j.source; inst.holdingsAt = new Date().toISOString();
        ok++;
      } catch (e) { ng++; fails.push({ name: c.name, code: c.code, err: String(e.message || e) }); }
    }
    await Store.commit('구성종목 자동조회', targets.length + '종목', null, { 성공: ok, 실패: ng }, '');
    const r = await modal('구성종목 자동 조회 결과',
      '<div class="callout ' + (ok ? (ng ? 'warn' : 'ok') : 'err') + '" style="margin-bottom:11px">' +
      '<b>성공 ' + ok + '종목 / 실패 ' + ng + '종목</b></div>' +
      (fails.length
        ? '<div class="tw" style="max-height:230px"><table class="dt"><thead><tr><th class="l">종목</th><th class="l">사유</th></tr></thead><tbody>' +
          fails.map((f) => '<tr><td class="l">' + esc(f.name) + '</td><td class="l" style="font-size:11.5px;color:var(--tx3)">' + esc(f.err) + '</td></tr>').join('') +
          '</tbody></table></div>' : '') +
      '<div class="note">실패한 종목은 운용사 공시나 <b>ETF체크</b> 표를 복사해 붙여넣으시면 됩니다. ' +
      '어떤 소스가 왜 실패했는지 보려면 <b>진단</b>을 눌러 보세요.</div>',
      [{ label: '닫기', value: null }, { label: '진단 보기', value: 'diag' }]);
    if (r === 'diag') return diagHoldings(targets[0].code);
    toast('구성종목 자동 조회: 성공 ' + ok + ' / 실패 ' + ng, ng && !ok ? 'err' : 'ok');
  } catch (e) {
    console.error(e);
    await modal('구성종목 조회 중 오류', '<div class="callout err">' + esc(String(e.message || e)) + '</div>' +
      '<div class="note" style="font-size:11.5px">' + esc(String(e.stack || '').slice(0, 300)) + '</div>',
      [{ label: '닫기', value: null }]);
  }
}

/** 어떤 소스가 왜 실패했는지 서버에 물어본다 */
async function diagHoldings(code) {
  try {
    if (!Price.proxy()) { const f = await Price.autoDetect(); if (!f) { Price.showGuide(); return; } }
    const target = code || (Store.view.computed.find((c) => c.mv > 0 && Price.isValid(c.code)) || {}).code || '';
    const url = Price.apiUrl('etf/diag', 'code=' + encodeURIComponent(target));
    if (!url) { toast('프록시 URL이 없습니다.', 'err'); return; }
    toast('소스를 하나씩 확인하는 중… (최대 30초)');
    let j = null, err = null;
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 40000);
      let r; try { r = await fetch(url, { signal: ctl.signal, cache: 'no-store' }); } finally { clearTimeout(to); }
      if (r.status === 404) throw new Error('서버에 진단 기능이 없습니다 — 최신 server.js / server.ps1 로 교체하세요');
      j = await r.json();
    } catch (e) { err = String(e.message || e); }
    await modal('구성종목 소스 진단 — ' + esc(target),
      err ? '<div class="callout err">' + esc(err) + '</div>' +
            '<div class="note">주소: <code>' + esc(url) + '</code><br>브라우저에서 이 주소를 직접 열어보시면 서버 응답을 그대로 볼 수 있습니다.</div>'
        : '<div class="tw"><table class="dt"><thead><tr><th class="l">소스</th><th class="c">결과</th><th class="l">내용</th></tr></thead><tbody>' +
          ((j && j.attempts) || []).map((a) => '<tr><td class="l">' + esc(a.source) + '</td>' +
            '<td class="c">' + (a.ok ? '<span class="chip ok">성공</span>' : '<span class="chip err">실패</span>') + '</td>' +
            '<td class="l" style="font-size:11.5px">' + esc(a.detail) + '</td></tr>').join('') +
          '</tbody></table></div>' +
          (j && j.holdings ? '<div class="callout ok" style="margin-top:11px">' + j.holdings.length + '종목을 찾았습니다 · 출처 ' + esc(j.source) + '</div>' : '') +
          '<div class="note">주소: <code>' + esc(url) + '</code></div>',
      [{ label: '닫기', value: null }, { label: '원본 응답 보기', value: 'raw', cls: 'pri' }])
      .then((x) => { if (x === 'raw') rawHoldings(target); });
  } catch (e) {
    console.error(e);
    toast('진단 실패: ' + String(e.message || e), 'err');
  }
}

    let r; try { r = await fetch(url, { signal: ctl.signal, cache: 'no-store' }); } finally { clearTimeout(to); }

        '<td class="c" style="font-size:11px">' + esc(String(x.contentType || '-').split(';')[0]) + '</td>' +
        '<td class="c num" style="font-size:11px">' + FMT.qtyN(x.length) + '</td>' +
        '<td class="c" style="font-size:11px">' + (x.parsed ? ((x.parsed.holdings ? x.parsed.holdings + '종목' : '') + (x.parsed.nav ? ' NAV ' + FMT.price(x.parsed.nav) : '') || '못 찾음') : (x.error ? esc(x.error).slice(0, 30) : '-')) + '</td></tr>').join('') +

      .then((x) => { if (x === 'copy') { try { navigator.clipboard.writeText(txt); toast('복사했습니다. 붙여넣어 전달해 주세요.', 'ok'); } catch (e) { toast('복사 실패 — 텍스트를 직접 선택해 복사하세요', 'err'); } } });
  } catch (e) { toast('원본 조회 실패: ' + String(e.message || e), 'err'); }

async function fetchHoldings(instId) {
  const inst = Store.inst(instId); if (!inst) return;
  const p = Price.proxy();
  if (!p) { toast('시세 서버가 없어 자동 조회를 할 수 없습니다. 붙여넣기로 입력해 주세요.', 'err'); return formEditHoldings(instId); }
  toast('구성종목을 조회하는 중…');
  try {
    const base = p.split('?')[0].replace(/\/api\/(price|prices)$/, '/api/etf');
    const url = base + '?code=' + encodeURIComponent(inst.code);
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 12000);
    let res; try { res = await fetch(url, { signal: ctl.signal, cache: 'no-store' }); } finally { clearTimeout(to); }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const items = (j && j.holdings) || [];
    if (!items.length) throw new Error('구성종목을 찾지 못했습니다');
    // 2026-08-11: 예전에는 여기서 상위 TOPN(8)개만 잘라 저장했음 — 통합 look-through 집계에서만
    // 상위 TOPN을 쓰도록(K.lookThrough 참조) 설계되어 있는데, 저장 단계에서 먼저 잘라버리면 이
    // 종목 상세 패널(전체 목록 기준 비중 합계)이 실제보다 훨씬 낮게 보여 "구성종목이 일부만
    // 입력됨" 경고가 뜨는 원인이 됐다. 전체 목록을 그대로 저장한다(집계 단계에서만 상위 TOPN 사용).
    inst.holdings = items.map((x) => ({ code: String(x.code || x.name), name: x.name || x.code, weight: K.n(x.weight) }));
    // 2026-08-12: 전체 자동조회(fetchAllHoldings)만 출처를 기록하고 이 개별 조회 경로는 빠져
    // 있었음 — 화면에 출처 표시가 갈리지 않도록 동일하게 기록한다.
    inst.holdingsSource = j.source; inst.holdingsAt = new Date().toISOString();
    await Store.commit('구성종목 자동조회', inst.name, null, { 개수: inst.holdings.length, 출처: j.source }, '');
    toast(inst.name + ' 구성종목 ' + inst.holdings.length + '개를 가져왔습니다.', 'ok');
  } catch (e) {
    await modal('자동 조회 실패',
      '<div class="callout err" style="margin-bottom:11px">' + esc(String(e.message || e)) + '</div>' +
      '<div style="font-size:13px;line-height:1.8">ETF 구성종목은 제공되는 API 가 불안정합니다. ' +
      '운용사 공시 페이지에서 표를 복사해 붙여넣는 방법을 권합니다.</div>',
      [{ label: '닫기', value: null }, { label: '진단', value: 'diag' }, { label: '붙여넣기로 입력', value: 'manual', cls: 'pri' }])
      .then((x) => { if (x === 'manual') formEditHoldings(instId); else if (x === 'diag') diagHoldings(inst.code); });
  }
}
