/** 전체 시세 업데이트 — ETF 자체 시세·NAV 와 그 안의 구성종목(국내+해외) 시세를 한 번에 갱신
 *  2026-08-11: "전체 시세 업데이트" 통합 버튼 — 개별로 두 번 누를 필요 없이 순서대로 실행한다. */
async function refreshAllPrices() {
  await Price.refresh();
  await refreshConstituentPrices();
}

/** 구성종목 개별 시세 조회 — 기존 시세 프록시 재사용 (국내 6자리 코드 + 해외 "티커.거래소" 코드 모두 지원) */
async function refreshConstituentPrices() {
  const L = lookThroughView();
  const codes = L.rows.map((r) => r.code).filter((c) => Price.isValid(c));
  if (!codes.length) { toast('조회할 종목코드가 없습니다. 구성종목에 코드를 함께 넣어 주세요.', 'err'); return; }
  if (!Price.proxy()) { const f = await Price.autoDetect(); if (!f) { Price.showGuide(); return; } }
  toast(codes.length + '개 종목 시세를 조회하는 중…');
  // 2026-08-12: 해외 종목 원화 환산에 쓸 환율도 같이 받아둔다 — 실패해도(인증키 미설정 등)
  // 시세 조회 자체는 계속 진행하고, 화면에서는 fxPriceCell 이 "환율 미적용"으로 안내한다.
  try { await Price.fetchFx(); } catch (e) { /* 화면에서 안내, 여기선 조회를 막지 않음 */ }
  const store = cpx();
  let ok = 0, ng = 0;
  try {
    const map = await Price.fetchMany(codes);
    codes.forEach((c) => {
      const d = map[c];
      if (d && !d.error) {
        const prev = store[c] || {};
        store[c] = Object.assign({}, prev, d, { base: prev.base || { price: d.price, date: K.todayISO() } });
        ok++;
      } else ng++;
    });
  } catch (e) {
    for (const c of codes) {
      try { const d = await Price.fetchOne(c); const prev = store[c] || {};
        store[c] = Object.assign({}, prev, d, { base: prev.base || { price: d.price, date: K.todayISO() } }); ok++; }
      catch (e2) { ng++; }
    }
  }
  await Store.commit('구성종목 시세 조회', codes.length + '종목', null, { 성공: ok, 실패: ng }, '');
  toast('구성종목 시세: 성공 ' + ok + '건 / 실패 ' + ng + '건', ng && !ok ? 'err' : 'ok');
}

/* -------------------------------------------------------------------------
 * 18-B. 종목 상세용 — 이 ETF 의 구성종목 전체 목록 (현금 포함) + 실시간 수익률
 * ----------------------------------------------------------------------- */
function InstrumentHoldingsPanel(c) {
  // 현금성 항목(원화현금 등)은 비중 값과 무관하게 항상 목록 맨 아래로 보낸다.
  const hs = K.sortHoldings(c.holdings || []);
  const store = cpx();
  const wSum = K.sum(hs, (h) => K.n(h.weight));
  const cashW = Math.max(0, 1 - wSum);            // 나머지
  // 합계가 95% 미만이면 '현금'이 아니라 목록이 일부만 들어온 것으로 본다
  const partial = wSum > 0 && wSum < 0.95;
  const restLabel = partial ? '나머지 (미입력분 포함)' : '현금·기타';
  const mv = K.n(c.mv);

  // 2026-08-12: 이 구성종목이 어느 소스(FunETF/ETF체크/KRX/네이버)에서, 언제 온 것인지 화면에
  // 바로 표시 — "진단" 버튼 없이도 20종목 상한이 있는 소스가 채택됐는지 즉시 확인 가능하도록.
  const srcNote = c.holdingsSource
    ? ' · 출처: ' + esc(c.holdingsSource) + (c.holdingsAt ? ' (' + esc(String(c.holdingsAt).slice(0, 16).replace('T', ' ')) + ')' : '')
    : '';
  const head =
    '<div class="panel"><header><h2>구성종목 (Look-through)</h2>' +
    '<span class="sub">' + (hs.length ? hs.length + '개 종목 · 합계 비중 ' + FMT.pct(wSum, 2) + srcNote : '미입력') + '</span><span class="sp"></span>' +
    '<button class="btn sm" data-act="ltPrices">시세 갱신</button>' +
    ed('<button class="btn sm" data-lt-diag="' + esc(c.code) + '">진단</button>' +
       '<button class="btn sm pri" data-lt-edit="' + c.id + '">구성종목 입력</button>') +
    '<a class="btn sm" href="#/lookthrough">통합 보기 →</a></header>';

  if (!hs.length) {
    return head + '<div class="body"><div class="empty" style="padding:22px">' +
      '이 ETF의 구성종목이 아직 입력되지 않았습니다.<br>' +
      '<span style="font-size:12px">운용사 공시의 구성종목 표를 복사해 붙여넣으면, 실제 보유금액과 실시간 수익률을 볼 수 있습니다.</span>' +
      '</div></div></div>';
  }

  const rows = hs.map((h) => {
    const px = store[String(h.code).trim()] || null;
    const w = K.n(h.weight);
    const amt = mv * w;
    const cur = px ? K.n(px.price) : 0;
    const base = px && px.base ? K.n(px.base.price) : 0;
    return { name: h.name || h.code, code: h.code, weight: w, amount: amt,
      price: cur, change: px ? K.n(px.change) : 0, changeRate: px ? K.n(px.changeRate) : 0,
      basePrice: base, baseDate: px && px.base ? px.base.date : null,
      baseReturn: base > 0 && cur > 0 ? (cur - base) / base : 0,
      dayPL: cur > 0 ? amt - amt / (1 + K.n(px.changeRate) || 1) : 0, has: !!cur, isRest: false };
  });
  const priced = rows.filter((r) => r.has);
  const dayPL = K.sum(rows, (r) => r.dayPL);
  // 구성비중 가중 실시간 등락률
  const wRate = K.div(K.sum(priced, (r) => r.changeRate * r.weight), K.sum(priced, (r) => r.weight));
  const wBase = K.div(K.sum(priced, (r) => r.baseReturn * r.weight), K.sum(priced, (r) => r.weight));

  // 2026-08-11: 이 표는 원래 DataTable 프레임워크를 거치지 않는 손으로 짠 <table> 이라, 다른 표들과
  // 달리 정렬·컬럼 너비조절·순서변경이 전혀 동작하지 않는다는 보고가 있었음(사용자 실측).
  // REG 에 등록해 DataTable(cfg)+bindTables 를 타도록 바꾼다. "나머지(현금·미분류)" 행은 실제
  // 데이터가 아니라 계산된 잔여값이라, 다른 표들의 현금 항목과 같은 방식(pinBottom)으로 rows 에

/* ===================== 15. 입력 폼 (매수/매도/배당/가정치) ===================== */
function fld(label, name, type, value, opts) {
  const o = opts || {};
  return '<div><label class="fl">' + esc(label) + '</label><input class="key" type="' + type + '" name="' + name + '" value="' + esc(value === null || value === undefined ? '' : value) + '"' +
    (o.step ? ' step="' + o.step + '"' : '') + (o.min !== undefined ? ' min="' + o.min + '"' : '') + '></div>';
}
function collect(bg) {
  const o = {}; $$('input[name],select[name],textarea[name]', bg).forEach((i) => { o[i.name] = i.type === 'number' ? K.n(parseFloat(i.value)) : i.value; });
  return o;
}
function errBox(msgs) { return '<div class="callout err" style="margin-bottom:0">' + msgs.map(esc).join('<br>') + '</div>'; }

async function formTrade(instId, kind, existingId) {
  const inst = Store.inst(instId); if (!inst) return;
  const list = kind === 'buy' ? inst.buys : inst.sells;
  const cur = existingId ? list.find((x) => x.id === existingId) : null;
  const label = kind === 'buy' ? '매수' : '매도';
  const body = '<div style="font-size:12.5px;color:var(--tx2);margin-bottom:10px">' + esc(inst.name) + '</div>' +
    '<div class="frow">' +
    fld('거래일', 'date', 'date', cur ? cur.date : K.todayISO()) +
    fld('수량 (주)', 'qty', 'number', cur ? cur.qty : '', { step: '1', min: 0 }) +
    fld(label + '가격 (원)', 'price', 'number', cur ? cur.price : Math.round(K.n((Store.state.prices[inst.code] || {}).price)), { step: '5', min: 0 }) +
    fld('수수료 (원)', 'fee', 'number', cur ? K.n(cur.fee) : 0, { step: '1', min: 0 }) +
    '</div><div><label class="fl">메모</label><input type="text" name="memo" value="' + esc(cur ? cur.memo || '' : '') + '"></div>' +
    '<div id="errs"></div>';
  const r = await modal((cur ? label + ' 내역 수정' : label + ' 내역 추가'), body, [
    { label: '취소', value: null },
    { label: '저장', cls: 'pri', collect: (bg) => {
      const v = collect(bg); v.id = cur ? cur.id : uid(kind);
      const errs = K.validateTrade(v, list, kind);
      if (errs.length) { $('#errs', bg).innerHTML = errBox(errs); return false; }
      return v;
    } },
  ]);
  if (!r) return;
  const before = cur ? JSON.parse(JSON.stringify(cur)) : null;
  if (cur) Object.assign(cur, r); else list.push(r);
  list.sort((a, b) => (a.date < b.date ? -1 : 1));
  await Store.commit(cur ? label + ' 수정' : label + ' 추가', inst.name, before, r, kind);
  toast(label + ' 내역이 저장되었습니다. 전체 계산이 갱신되었습니다.', 'ok');
}

/** 자동반영(가정치)된 배당을 실제 공시금액과 대조해본 뒤, 금액이 맞으면 그냥 "확인"만 눌러
 *  verified 플래그만 세운다 — 굳이 값을 안 바꿔도 검토했다는 표시를 남길 수 있게 함. */
async function verifyDividend(instId, recId) {
  if (VIEWER_MODE) return;
  const inst = Store.inst(instId); if (!inst) return;
  const rec = (inst.dividendReceipts || []).find((x) => x.id === recId); if (!rec) return;
  const before = JSON.parse(JSON.stringify(rec));
  rec.verified = true;
  await Store.commit('배당 확인', inst.name, before, rec, '자동반영 금액을 실제 공시와 대조 확인함');
  toast('확인 처리했습니다.', 'ok');
}

/** 종목 삭제 */
async function deleteInstrument(id) {
  const inst = Store.inst(id); if (!inst) return;
  const c = Store.cinst(id);
  const n = inst.buys.length + inst.sells.length + inst.dividendReceipts.length;
  if (!(await confirmBox('종목 삭제',
    '<b>' + esc(inst.name) + '</b> 을 목록에서 삭제합니다.<br>' +
    '매수 ' + inst.buys.length + '건 · 매도 ' + inst.sells.length + '건 · 배당 ' + inst.dividendReceipts.length + '건이 함께 삭제되며, ' +
    '평가금액 ' + FMT.won0(c ? c.mv : 0) + ' 과 누적 손익이 전체 집계에서 빠집니다.<br><br>' +
    (n ? '<b>거래 내역이 있는 종목입니다.</b> 삭제 전 자동 스냅샷이 생성됩니다.<br>' : '') +
    '계속할까요?', true))) return;
  if (n) await Store.snapshot('종목 삭제 직전 자동 백업 — ' + inst.name);
  const i = Store.state.instruments.findIndex((x) => x.id === id);
  const before = { 종목명: inst.name, 종목코드: inst.code, 매수: inst.buys.length, 매도: inst.sells.length, 배당: inst.dividendReceipts.length };
  Store.state.instruments.splice(i, 1);
  await Store.commit('종목 삭제', inst.name, before, null, '');
  toast('“' + inst.name + '” 을 삭제했습니다.', 'ok');
  location.hash = '#/dashboard';
}

/* ===================== 16. 데이터 입출력 ===================== */
async function loadSheetJS() {
  if (window.XLSX) return window.XLSX;
  const urls = ['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
  for (const u of urls) {
    try {
      await new Promise((res, rej) => { const s = document.createElement('script'); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); setTimeout(rej, 12000); });
      if (window.XLSX) return window.XLSX;
    } catch (e) { /* 다음 CDN 시도 */ }
  }
  throw new Error('SheetJS를 불러올 수 없습니다(오프라인 가능성). JSON 백업 또는 CSV를 사용하세요.');
}
function pickFile(accept) {
  return new Promise((res) => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null);
    i.click();
  });
}

  XLSX.writeFile(wb, 'IRP_포트폴리오_' + K.todayISO() + '.xlsx');

}
/** 원본 엑셀 재업로드 → 매수·매도·배당·목표금액·배당가정치 갱신 */
async function importXlsx() {
  let XLSX;
  try { XLSX = await loadSheetJS(); } catch (e) { toast(e.message, 'err'); return; }
  const f = await pickFile('.xlsx,.xlsm');
  if (!f) return;
  if (!(await confirmBox('엑셀 재업로드', '업로드한 엑셀의 매수·매도·배당 수령내역, 목표금액, 배당 가정치, 현재가로 <b>현재 데이터를 덮어씁니다</b>.<br>진행 전 자동 스냅샷이 생성됩니다. 계속할까요?', true))) return;
  await Store.snapshot('엑셀 재업로드 직전 자동 백업');
  const buf = await f.arrayBuffer();
  const wb = XLSX.read(buf, { cellDates: true });
  const g = (ws, addr) => { const c = ws[addr]; return c ? c.v : null; };
  const iso = (v) => (v instanceof Date ? v.toISOString().slice(0, 10) : (v ? String(v).slice(0, 10) : null));
  let updated = 0;
  Store.state.instruments.forEach((inst, idx) => {
    const ws = wb.Sheets[inst.sheet]; if (!ws) return;
    const buys = [], sells = [], divs = [];
    for (let r = 7; r <= 26; r++) { const q = g(ws, 'C' + r), p = g(ws, 'D' + r); if (q === null || p === null) continue; buys.push({ id: 'B' + idx + '_' + r, date: iso(g(ws, 'B' + r)), qty: K.n(q), price: K.n(p), fee: 0, memo: g(ws, 'F' + r) || '' }); }
    for (let r = 31; r <= 40; r++) { const q = g(ws, 'C' + r), p = g(ws, 'D' + r); if (q === null || p === null) continue; sells.push({ id: 'S' + idx + '_' + r, date: iso(g(ws, 'B' + r)), qty: K.n(q), price: K.n(p), fee: 0, memo: g(ws, 'G' + r) || '' }); }
    for (let r = 55; r <= 62; r++) { const a = g(ws, 'C' + r); if (a === null) continue; divs.push({ id: 'D' + idx + '_' + r, date: iso(g(ws, 'B' + r)), amount: K.n(a), kind: '실수령', memo: g(ws, 'D' + r) || '' }); }
    inst.buys = buys; inst.sells = sells; inst.dividendReceipts = divs;
    const freq = g(ws, 'C67'), per = g(ws, 'C68');
    if (freq !== null) inst.dividend.freq = K.n(freq);
    if (per !== null) inst.dividend.perShare = K.n(per);
    if (g(ws, 'C65')) inst.dividend.cycle = g(ws, 'C65');
    if (g(ws, 'C66')) inst.dividend.payMonthsText = g(ws, 'C66');
    if (g(ws, 'C70')) inst.dividend.nextExDate = iso(g(ws, 'C70'));
    if (g(ws, 'C71')) inst.dividend.nextPayDate = iso(g(ws, 'C71'));
    updated++;
  });
  const wg = wb.Sheets['목표비중·리밸런싱'];
  if (wg) Store.state.instruments.forEach((inst, i) => { const v = g(wg, 'D' + (6 + i)); if (v !== null) inst.target.targetAmount = K.n(v); const o = g(wg, 'O' + (6 + i)); if (o) inst.target.irpClass = o; });
  const wc = wb.Sheets['표지·사용안내'];
  if (wc && g(wc, 'C6') !== null) Store.state.meta.portfolioTarget = K.n(g(wc, 'C6'));
  const wn = wb.Sheets['네이버현재가'];
  if (wn) for (let r = 7; r <= 103; r++) { const code = g(wn, 'C' + r); if (!code) continue; const cs = String(code).trim();
    Store.state.prices[cs] = Object.assign({}, Store.state.prices[cs], { code: cs, name: g(wn, 'D' + r), price: K.n(g(wn, 'E' + r)), asOf: iso(g(wn, 'F' + r)), marketStatus: g(wn, 'G' + r), change: K.n(g(wn, 'H' + r)), changeRate: K.n(g(wn, 'I' + r)), volume: K.n(g(wn, 'J' + r)), status: 'ok', source: '업로드 엑셀' }); }
  await Store.commit('엑셀 재업로드', f.name, null, { 갱신종목: updated }, '');
  toast(updated + '개 종목 데이터를 엑셀에서 갱신했습니다.', 'ok');
}
async function importJson() {
  const f = await pickFile('.json');
  if (!f) return;
  let obj;
  try { obj = JSON.parse(await f.text()); } catch (e) { toast('JSON 파일을 읽을 수 없습니다.', 'err'); return; }
  if (!obj || !obj.instruments) { toast('올바른 백업 파일이 아닙니다.', 'err'); return; }
  if (!(await confirmBox('JSON 복원', '백업 파일의 내용으로 <b>현재 데이터를 완전히 대체</b>합니다. 계속할까요?', true))) return;
  await Store.snapshot('JSON 복원 직전 자동 백업');
  const keep = Store.state.snapshots;
  Store.state = Object.assign(Store.seed(), obj);
  Store.state.snapshots = keep;
  await Store.commit('JSON 복원', f.name, null, null, '');
  toast('복원되었습니다.', 'ok');
}

/* ===================== 17. 이벤트 바인딩 ===================== */
function bindActions(root) {
  // 구분(그룹) 수기 입력
  $$('[data-group-name]', root).forEach((el) => el.onchange = async () => {
    const inst = Store.inst(el.dataset.groupName); if (!inst) return;
    const before = inst.target.group;
    inst.target.group = el.value.trim();
    await Store.commit('구분 변경', inst.name, before, inst.target.group, '');
  });
  // 목표금액 / 목표비중 / IRP분류 / 성장률 / 현재가 / 설정
  $$('[data-tgt]', root).forEach((el) => el.onchange = async () => {
    const inst = Store.inst(el.dataset.tgt); const before = inst.target.targetAmount;
    inst.target.targetAmount = K.n(parseFloat(el.value));
    await Store.commit('목표금액 변경', inst.name, before, inst.target.targetAmount, '');
  });
  $$('[data-tgtw]', root).forEach((el) => el.onchange = async () => {
    const inst = Store.inst(el.dataset.tgtw); const before = inst.target.targetAmount;
    inst.target.targetAmount = Math.round(K.n(parseFloat(el.value)) / 100 * K.n(Store.state.meta.portfolioTarget));
    await Store.commit('목표비중 변경', inst.name, before, inst.target.targetAmount, '비중 입력 → 금액 환산');
  });
  $$('[data-irp]', root).forEach((el) => el.onchange = async () => {
    const inst = Store.inst(el.dataset.irp); const before = inst.target.irpClass;
    inst.target.irpClass = el.value; inst.isSafe = el.value === '안전자산';
    await Store.commit('IRP분류 변경', inst.name, before, el.value, '');
  });
  $$('[data-growth]', root).forEach((el) => el.onchange = async () => {
    const inst = Store.inst(el.dataset.growth); const before = inst.growth;
    inst.growth = K.n(parseFloat(el.value)) / 100;
    await Store.commit('배당성장률 변경', inst.name, before, inst.growth, '');
  });
  $$('[data-nav]', root).forEach((el) => el.onchange = async () => {
    const code = el.dataset.nav, p2 = Store.state.prices[code] || { code };
    const before = p2.nav;
    const v = parseFloat(el.value);
    p2.nav = isFinite(v) && v > 0 ? v : null;
    Store.state.prices[code] = p2;
    await Store.commit('NAV 수동입력', code, before, p2.nav, '');
  });
  $$('[data-px]', root).forEach((el) => el.onchange = async () => {
    const code = el.dataset.px, p = Store.state.prices[code] || { code };
    const before = p.price;
    p.price = K.n(parseFloat(el.value)); p.status = 'ok'; p.source = '수동 입력'; p.asOf = new Date().toISOString(); p.error = null;
    Store.state.prices[code] = p;
    await Store.commit('현재가 수동입력', code, before, p.price, '');
  });
  $$('[data-meta]', root).forEach((el) => el.onchange = async () => {
    const k = el.dataset.meta, before = Store.state.meta[k];
    Store.state.meta[k] = K.n(parseFloat(el.value));
    await Store.commit('설정 변경', k, before, Store.state.meta[k], '');
  });
  $$('[data-set]', root).forEach((el) => el.onchange = async () => {
    const k = el.dataset.set;
    Store.state.settings[k] = (k === 'syncEnabled') ? !!el.value : (k === 'syncInterval' ? K.n(parseFloat(el.value)) : el.value);
    if (k === 'theme') applyTheme();
    await Store.commit(null);
    if (['syncEnabled', 'syncUrl', 'syncInterval'].indexOf(k) >= 0) {
      if (VIEWER_MODE) Sync.start(); else if (Store.state.settings.syncEnabled) Sync.push(true);
      Router.render();
    }
  });
  $$('[data-sc]', root).forEach((el) => el.onchange = async () => {
    const k = el.dataset.sc; let v = el.value;
    if (k === 'reinvestRate') v = K.n(parseFloat(v)) / 100;
    else if (k === 'excelMonthlyMode') v = v === '1';
    else if (['startYear', 'endYear', 'extraContribution', 'withdrawal', 'livingCost'].indexOf(k) >= 0) v = K.n(parseFloat(v));
    Store.state.scenario[k] = v;
    if (Store.state.scenario.endYear < Store.state.scenario.startYear) Store.state.scenario.endYear = Store.state.scenario.startYear;
    await Store.commit(null);
  });
  // 거래 CRUD
  $$('[data-add-buy]', root).forEach((b) => b.onclick = () => formTrade(b.dataset.addBuy, 'buy'));
  $$('[data-add-sell]', root).forEach((b) => b.onclick = () => formTrade(b.dataset.addSell, 'sell'));
  $$('[data-add-div]', root).forEach((b) => b.onclick = () => formDividend(b.dataset.addDiv));
  $$('[data-edit-divinfo]', root).forEach((b) => b.onclick = () => formDivInfo(b.dataset.editDivinfo));
  const iid = () => (Router.route.name === 'inst' ? Router.route.arg : null);
  $$('[data-edit-buy]', root).forEach((b) => b.onclick = () => formTrade(b.dataset.inst || iid(), 'buy', b.dataset.editBuy));
  $$('[data-edit-sell]', root).forEach((b) => b.onclick = () => formTrade(b.dataset.inst || iid(), 'sell', b.dataset.editSell));
  $$('[data-edit-div]', root).forEach((b) => b.onclick = () => formDividend(b.dataset.inst || iid(), b.dataset.editDiv));
  $$('[data-verify-div]', root).forEach((b) => b.onclick = () => verifyDividend(b.dataset.inst || iid(), b.dataset.verifyDiv));
  const delFrom = async (instId, listName, id, label) => {
    const inst = Store.inst(instId); if (!inst) return;
    const list = inst[listName], i = list.findIndex((x) => x.id === id); if (i < 0) return;
    if (!(await confirmBox(label + ' 삭제', '<b>' + esc(inst.name) + '</b><br>' + esc(list[i].date) + ' 건을 삭제합니다. 전체 계산이 다시 반영됩니다.', true))) return;
    const before = list[i]; list.splice(i, 1);
    await Store.commit(label + ' 삭제', inst.name, before, null, '');
    toast(label + ' 내역을 삭제했습니다.', 'ok');
  };
  $$('[data-del-buy]', root).forEach((b) => b.onclick = () => delFrom(b.dataset.inst || iid(), 'buys', b.dataset.delBuy, '매수'));
  $$('[data-del-sell]', root).forEach((b) => b.onclick = () => delFrom(b.dataset.inst || iid(), 'sells', b.dataset.delSell, '매도'));
  $$('[data-del-div]', root).forEach((b) => b.onclick = () => delFrom(b.dataset.inst || iid(), 'dividendReceipts', b.dataset.delDiv, '배당'));
  const addAny = $('[data-add-any]', root);
  if (addAny) addAny.onclick = async () => {
    const r = await pickInstrument('거래 추가');
    if (!r) return;
    if (r.kind === 'div') formDividend(r.instId); else formTrade(r.instId, r.kind);
  };
  $$('[data-refresh-one]', root).forEach((b) => b.onclick = () => Price.refresh([b.dataset.refreshOne]));
  $$('[data-lt-edit]', root).forEach((b) => b.onclick = () => formEditHoldings(b.dataset.ltEdit));
  $$('[data-lt-fetch]', root).forEach((b) => b.onclick = () => fetchHoldings(b.dataset.ltFetch));
  // 2026-08-12: "진단" 버튼이 통합 보기(ScreenLookThrough) 상단에만 있고 항상 첫 번째 ETF만
  // 진단해서, 특정 ETF(예: 20종목 상한에 걸린 6개 중 하나) 하나를 콕 집어 진단할 방법이 없었음.
  // ETF 상세 패널에 종목코드를 직접 넘기는 버튼을 추가해 그 종목만 바로 진단할 수 있게 한다.
  $$('[data-lt-diag]', root).forEach((b) => b.onclick = () => diagHoldings(b.dataset.ltDiag));
  $$('[data-lt-clear]', root).forEach((b) => b.onclick = async () => {
    const inst = Store.inst(b.dataset.ltClear); if (!inst) return;
    if (!(await confirmBox('구성종목 삭제', '<b>' + esc(inst.name) + '</b> 의 구성종목 ' + (inst.holdings || []).length + '개를 지웁니다.', true))) return;
    const before = inst.holdings; inst.holdings = [];
    await Store.commit('구성종목 삭제', inst.name, { 개수: before.length }, null, '');
  });
  $$('[data-restore]', root).forEach((b) => b.onclick = async () => {
    const s = Store.state.snapshots.find((x) => x.id === b.dataset.restore); if (!s) return;
    if (!(await confirmBox('스냅샷 복원', esc(FMT.dt(s.ts)) + ' 시점으로 되돌립니다. 계속할까요?', true))) return;
    const d = JSON.parse(s.data);
    Object.assign(Store.state, { meta: d.meta, instruments: d.instruments, prices: d.prices, scenario: d.scenario });
    await Store.commit('스냅샷 복원', FMT.dt(s.ts), null, null, '');
    toast('복원되었습니다.', 'ok');
  });
  // 일반 액션
  $$('[data-act]', root).forEach((b) => b.onclick = async () => {
    switch (b.dataset.act) {
      case 'refreshAll': return Price.refresh();
      case 'refreshAllPrices': return refreshAllPrices();
      case 'addInst': return formAddInstrument();
      case 'editInst': return formEditInstrument(b.dataset.instId);
      case 'delInst': return deleteInstrument(b.dataset.instId);
      case 'syncTotal': {
        const sum2 = Store.view.rebal.targetSum;
        if (!(await confirmBox('목표총액 동기화', '목표총액을 목표금액 합계 <b>' + FMT.won0(sum2) + '</b> 로 맞춥니다. 계속할까요?'))) return;
        const before = Store.state.meta.portfolioTarget;
        Store.state.meta.portfolioTarget = Math.round(sum2);
        await Store.commit('목표총액 동기화', '전체', before, Store.state.meta.portfolioTarget, '목표금액 합계에 맞춤');
        return toast('목표총액을 ' + FMT.won0(sum2) + ' 로 맞췄습니다.', 'ok');
      }
      case 'diagnose': return runDiagnose();
      case 'makeViewer': return makeViewerFile();
      case 'makeShared': return makeSharedFile();
      case 'divUpdate': return formDividendUpdate();
      case 'divAssume': return formDividendAssumptions();
      case 'ltEditAll': return formEditAllHoldings();
      case 'ltPrices': return refreshConstituentPrices();
      case 'ltFetchAll': return fetchAllHoldings();
      case 'navKey': return Price.officialNavGuide();
      case 'rawNav': { const t2 = Store.view.computed.find((c) => c.mv > 0 && Price.isValid(c.code)); return rawHoldings(t2 ? t2.code : '', 'nav'); }
      case 'ltRaw': { const t1 = Store.view.computed.find((c) => c.mv > 0 && Price.isValid(c.code)); return rawHoldings(t1 ? t1.code : ''); }
      case 'ltDiag': { const t0 = Store.view.computed.find((c) => c.mv > 0 && Price.isValid(c.code)); return diagHoldings(t0 ? t0.code : ''); }
      case 'navOnly': {
        // 맥쿼리인프라는 ETF가 아니라 개별 상장 인프라펀드라 NAV(순자산가치 대비 괴리) 조회 대상이 아님.
        const codes = Price.targets().filter((i) => i.sheet !== '맥쿼리인프라').map((i) => i.code);
        if (!Price.proxy()) { const f = await Price.autoDetect(); if (!f) return Price.showGuide(); }
        if (!(await Price.needCap('nav'))) return;
        toast('NAV를 조회하는 중…');
        try {
          const j = await Price.fetchNav(codes);
          let cnt = 0;
          Object.keys(j.navs || {}).forEach((c2) => { const p2 = Store.state.prices[c2]; if (!p2) return;
            p2.nav = K.n(j.navs[c2].nav); p2.navSource = j.navs[c2].source; cnt++; });
          await Store.commit('NAV 조회', codes.length + '종목', null, { 성공: cnt, 실패: (j.missing || []).length }, '');
          return toast('NAV 조회: ' + cnt + '건 성공 / ' + (j.missing || []).length + '건 실패', cnt ? 'ok' : 'err');
        } catch (e) { return toast('NAV 조회 실패 — ' + Price.explain(e, e.__url).short, 'err'); }
      }
      case 'lockOut': {
        if (!(await confirmBox('잠금', '비밀번호 화면으로 돌아갑니다. 다시 보려면 비밀번호를 입력해야 합니다.'))) return;
        Sync.clearViewToken(); Sync.stop();
        try { sessionStorage.removeItem('irp_pass'); } catch (e) {}
        location.reload(); return;
      }
      case 'syncPush': return Sync.push();
      case 'syncPull': return Sync.pull();
      case 'detectProxy': {
        toast('시세 서버를 찾는 중…');
        const found = await Price.autoDetect();
        Router.render();
        return found
          ? toast('찾았습니다: ' + found.split('/api/')[0], 'ok')
          : modal('시세 서버를 찾지 못했습니다',
              '<div class="callout" style="margin-bottom:10px">아래 주소를 확인했지만 응답이 없습니다.<br>' +
              Price.candidates().map((c) => '<code style="font-size:11.5px">' + esc(c.split('/api/')[0]) + '</code>').join('<br>') + '</div>' +
              '<div style="font-size:13px;line-height:1.9"><code>배포</code> 폴더의 <b>시세서버_실행.bat</b>(윈도우) 또는 ' +
              '<b>시세서버_실행.command</b>(맥) 을 더블클릭해 서버를 켠 뒤 다시 눌러 주세요.</div>',
              [{ label: '닫기', value: null }]);
      }
      case 'exportJson': {
        download('IRP_백업_' + K.todayISO() + '.json', JSON.stringify(Store.state, null, 1), 'application/json');
        return toast('JSON 백업을 내려받았습니다.', 'ok');
      }
      case 'importJson': return importJson();
      case 'exportCsvAll': return exportAllCsv();
      case 'exportXlsx': return exportXlsx();
      case 'importXlsx': return importXlsx();
      case 'snapshot': { const s = await Store.snapshot('수동 스냅샷'); Router.render(); return toast('스냅샷 생성: ' + FMT.dt(s.ts), 'ok'); }
      case 'resetAll': {
        if (!(await confirmBox('전체 데이터 초기화', '입력하신 <b>모든 거래·배당·목표·설정</b>이 삭제되고 원본 엑셀 초기값으로 되돌아갑니다.<br>이 작업은 되돌릴 수 없습니다. 정말 진행할까요?', true))) return;
        await Store.snapshot('초기화 직전 자동 백업');
        const keep = Store.state.snapshots;
        Store.state = Store.seed(); Store.state.snapshots = keep;
        await Store.commit('전체 초기화', '전체', null, null, '');
        return toast('원본 엑셀 초기값으로 되돌렸습니다.', 'ok');
      }
      case 'clearAudit': {
        if (!(await confirmBox('이력 비우기', '변경 이력을 모두 삭제합니다. 계속할까요?', true))) return;
        Store.state.audit = []; await Store.commit(null); return;
      }
      case 'resetTarget': {
        if (!(await confirmBox('목표값 복원', '목표금액 · IRP분류를 <b>원본 엑셀 값</b>으로 되돌립니다. 계속할까요?'))) return;
        SEED.instruments.forEach((s, i) => { const inst = Store.state.instruments[i]; inst.target.targetAmount = s.target.targetAmount; inst.target.irpClass = s.target.irpClass; inst.isSafe = s.isSafe; });
        await Store.commit('목표값 원본 복원', '전체', null, null, '');
        return toast('원본 목표값으로 복원했습니다.', 'ok');
      }
      case 'equalize': {
        if (!(await confirmBox('목표 = 현재 평가금액', '모든 종목의 목표금액을 현재 평가금액으로 설정합니다. 계속할까요?'))) return;
        Store.view.computed.forEach((c) => { Store.inst(c.id).target.targetAmount = Math.round(c.mv); });
        await Store.commit('목표금액 일괄 변경', '전체', null, null, '현재 평가금액으로 설정');
        return toast('목표금액을 현재 평가금액으로 설정했습니다.', 'ok');
      }
      case 'resetScenario': {
        Store.state.scenario = Object.assign(Store.seed().scenario, { startYear: Store.state.scenario.startYear, endYear: Store.state.scenario.endYear });
        await Store.commit(null); return toast('시나리오 가정을 기본값으로 되돌렸습니다.', 'ok');
      }
      case 'toggleTheme': {
        Store.state.settings.theme = Store.state.settings.theme === 'dark' ? 'light' : 'dark';
        applyTheme(); await Store.commit(null); return;
      }
    }
  });
}

/* ===================== 18. 라우터 / 부트스트랩 ===================== */
const HAS_VERIFY = !!(typeof VERIFY !== 'undefined' && VERIFY && VERIFY.rows && VERIFY.rows.length);
const NAV_ALL = [
  { path: 'dashboard', icon: '▤', label: '종합 대시보드' },
  { path: 'rebalance', icon: '◎', label: '자산배분·리밸런싱' },
  { path: 'dividends', icon: '₩', label: '배당 대시보드' },
  { path: 'lookthrough', icon: '⊞', label: 'ETF 구성종목' },
  { path: 'longterm', icon: '↗', label: '장기 배당 현금흐름' },
  { path: 'transactions', icon: '⇄', label: '거래·변경이력' },
  { path: 'prices', icon: '◷', label: '현재가 연동' },
  { path: 'verify', icon: '✓', label: '엑셀 대조 검증' },
  { path: 'data', icon: '⚙', label: '데이터·설정' },
];
const NAV = NAV_ALL.filter((x) => x.path !== 'verify' || HAS_VERIFY);
const Router = {
  route: { name: 'dashboard', arg: null },
  parse() {
    const h = (location.hash || '#/dashboard').replace(/^#\/?/, '').split('/');
    this.route = { name: h[0] || 'dashboard', arg: h[1] || null };
  },
  title() {
    if (this.route.name === 'inst') { const c = Store.cinst(this.route.arg); return c ? c.name : '종목 상세'; }
    const n = NAV.find((x) => x.path === this.route.name);
    return n ? n.label : '종합 대시보드';
  },
  render() {
    const viewEl = $('#view');
    if (!viewEl || !Store.view) return;          // DOM 미준비 시 안전 종료
    // 2026-08-11: 표 정렬·너비조절·순서변경·입력 저장 등 "같은 화면 안에서의 조작"도 전부
    // Store.commit()이나 Router.render()를 직접 호출하는 방식이라, 예전엔 매번 맨 위로
    // 스크롤이 튀었다(사용자 실측 불편 신고). 실제로 다른 화면으로 이동(해시가 바뀜)한 경우에만
    // 맨 위로 보내고, 같은 화면 안에서의 재렌더링이면 스크롤 위치를 그대로 복원한다.
    const sameRoute = this._lastRoute && this._lastRoute.name === this.route.name && this._lastRoute.arg === this.route.arg;
    const prevScrollY = window.scrollY;
    Object.keys(REG).forEach((k) => delete REG[k]);
    const V = Store.view, T = V.totals;
    let html;
    try {
      switch (this.route.name) {
        case 'rebalance': html = ScreenRebalance(); break;
        case 'dividends': html = ScreenDividends(); break;
        case 'lookthrough': html = ScreenLookThrough(); break;
        case 'longterm': html = ScreenLongTerm(); break;
        case 'transactions': html = ScreenTransactions(); break;
        case 'prices': html = ScreenPrices(); break;
        case 'data': html = ScreenData(); break;
        case 'verify': html = ScreenVerify(); break;
        case 'inst': html = ScreenInstrument(this.route.arg); break;
        default: html = ScreenDashboard();
      }
    } catch (e) {
      html = '<div class="callout err"><b>화면을 그리는 중 오류가 발생했습니다.</b><br>' + esc(e.message) + '<br><small>' + esc(String(e.stack || '').slice(0, 400)) + '</small></div>';
      console.error(e);
    }
    const navHtml = (cls) => NAV.map((x) => '<a href="#/' + x.path + '" class="' + (this.route.name === x.path ? 'on' : '') + '">' + (cls === 'side' ? '<span class="ic">' + x.icon + '</span>' : '') + esc(x.label) + '</a>').join('');
    const sideEl = $('#sidenav'), mobEl = $('#mobnav'), titleEl = $('#pageTitle'), infoEl = $('#topInfo');
    if (sideEl) sideEl.innerHTML = navHtml('side');
    if (mobEl) mobEl.innerHTML = navHtml('mob');
    if (titleEl) titleEl.textContent = this.title();
    if (infoEl) infoEl.innerHTML =
      (VIEWER_MODE ? '<span class="chip warn" title="이 파일은 수정 기능이 포함되어 있지 않습니다">🔒 열람 전용</span>' : '') +
      (Sync.enabled() ? '<span class="chip ' + (Sync.lastErr ? 'err' : 'ok') + '" title="' + esc(Sync.statusText()) + '">' + (VIEWER_MODE ? '↻ 동기화' : '↑ 동기화') + '</span>' : '') +
      '<span class="chip">기준일 ' + esc(Store.baseDate()) + '</span>' +
      '<span class="chip">총자산 ' + FMT.eokW(T.totalAssets) + '</span>' +
      '<span class="chip">평가 ' + FMT.eokW(T.totalMV) + '</span>' +
      '<span class="chip">현금 ' + FMT.eokW(T.cash) + '</span>' +
      '<span class="chip ' + (T.totalCombined >= 0 ? 'risk' : 'safe') + '">총손익 ' + FMT.amtS(T.totalCombined) + '원</span>';
    viewEl.innerHTML = html;
    bindTables(viewEl, REG);
    bindActions(viewEl);
    const topEl = $('#top'); if (topEl) bindActions(topEl);
    try {
      if (sameRoute) window.scrollTo({ top: prevScrollY });   // 같은 화면 재렌더링 — 보던 위치 유지
      else window.scrollTo({ top: 0 });                        // 다른 화면으로 이동 — 맨 위에서 시작
    } catch (e) { /* 지원하지 않는 환경 */ }
    this._lastRoute = { name: this.route.name, arg: this.route.arg };
  },
  start() {
    window.addEventListener('hashchange', () => { this.parse(); this.render(); });
    this.parse(); this.render();
  },
};
function applyTheme() { document.documentElement.setAttribute('data-theme', Store.state.settings.theme === 'dark' ? 'dark' : 'light'); }

var __SRC = '';

function APP_SHELL() {
  return '<div id="app">' +
    '<aside id="side"><div class="brand"><b>IRP 포트폴리오 관리</b><span>' +
    (VIEWER_MODE ? '열람 전용 · 수정할 수 없습니다' : '아버지 퇴직(IRP) 운용 대시보드') + '</span></div>' +
    '<nav id="sidenav"></nav>' +
    '<div class="sfoot">원본: 아빠_퇴직_IRP_포트폴리오_관리표_V6<br>계산 로직은 원본 엑셀 수식과 1:1 대응</div></aside>' +
    '<div id="main"><div class="mobnav" id="mobnav"></div>' +
    '<div id="top"><h1 id="pageTitle">종합 대시보드</h1><span class="sp"></span><span id="topInfo" class="pill-row"></span>' +
    '<button class="btn" data-act="refreshAll" title="전체 종목 현재가 새로고침">🔄 시세</button>' +
    '<button class="btn pri" data-act="refreshAllPrices" title="ETF 자체 시세·NAV + 그 안의 구성종목(국내·해외) 시세까지 한 번에 갱신">⚡ 전체 시세 업데이트</button>' +
    (CAN_EDIT ? '<button class="btn" data-act="divUpdate" title="실제 수령한 배당 등록 · 배당 가정치 수정">💰 배당 업데이트</button>' : '') +
    (LOCKED ? '<button class="btn" data-act="lockOut" title="비밀번호 잠금">🔒</button>' : '') +
    '<button class="btn" data-act="toggleTheme" title="라이트/다크 모드 전환">◐</button></div>' +
    '<div id="view"><div class="loading"><span class="spin"></span>데이터를 불러오는 중…</div></div></div></div>';
}

(async function boot() {
  // 열람자용 파일 생성을 위해 원본 HTML 을 미리 확보 (body 를 덮어쓰기 전에)
  try { __SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML; } catch (e) { __SRC = ''; }
  try {
    await Store.load();
    applyTheme();
    if (LOCKED) { await Lock.boot(); return; }   // 비밀번호 화면 먼저
    // 2026-08-11: 지급일 지난 배당을 사람이 클릭하지 않아도 자동 반영 (배당 대시보드 확인 필요 상태로 표시)
    const divAuto = await autoPostDividends();
    document.body.innerHTML = APP_SHELL();
    Router.start();
    if (VIEWER_MODE) { Sync.start(); }
    else if (Store.state.settings.syncEnabled) { Sync.push(true); }
    if (divAuto && divAuto.count) {
      toast('배당 ' + divAuto.count + '건을 자동 반영했습니다 (합계 ' + FMT.won0(divAuto.total) + ') — 가정치 기준이니 배당 대시보드에서 확인해 주세요.', 'ok');
    }
  } catch (e) {
    document.body.innerHTML = '<div style="padding:30px;font-family:sans-serif">' +
      '<h2 style="margin:0 0 8px">초기화 실패</h2><div>' + esc(e.message) + '</div></div>';
    console.error(e);
  }
})();

/* 디버깅·테스트용 전역 노출 (콘솔에서 IRP.Store / IRP.K 접근 가능) */
window.IRP = { Store, Router, Price, K, FMT, Chart, DB, Sync, Table: { TableState, DataTable } };
window.Store = Store; window.Price = Price;

</script>
