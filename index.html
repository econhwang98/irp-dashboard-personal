<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>IRP 포트폴리오 대시보드</title>
<style>
:root{
  --navy:#0f2547; --navy2:#173764; --blue:#1f5fbf; --blue-l:#e8f0fb; --blue-d:#123a7a;
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#fbfcfe; --line:#dde3ec; --line2:#eef2f7;
  --tx:#16233a; --tx2:#5a6b85; --tx3:#8595ac;
  --up:#c62828; --up-bg:#fdecec; --down:#1565c0; --down-bg:#e9f1fb; --flat:#5a6b85;
  --warn:#b26a00; --warn-bg:#fff5e5; --ok:#1b7a48; --ok-bg:#e8f6ee; --err:#b3261e; --err-bg:#fdecea;
  --input:#fffbe6; --input-bd:#e8d48a; --calc:#ffffff; --ext:#eef7f1; --ext-bd:#b9dfc9;
  --shadow:0 1px 2px rgba(15,37,71,.06),0 4px 16px rgba(15,37,71,.06);
  --r:10px; --mono:"SF Mono",ui-monospace,"Menlo","Consolas","D2Coding",monospace;
  /* 2026-08-12: 구성종목 "구분"(주식/채권/파생/현금) 전용 색 — 기존 상승/하락(up/down) 등과
     혼동되지 않도록 이 용도로만 쓰는 색을 따로 둔다. */
  --k-stock:#1f5fbf; --k-stock-bg:#e8f0fb; --k-bond:#7c3aed; --k-bond-bg:#f1e9fd;
  --k-deriv:#c2610a; --k-deriv-bg:#fdf0e2; --k-cash:#1b7a48; --k-cash-bg:#e8f6ee;
  --k-other:#5a6b85; --k-other-bg:#eef2f7;
}
[data-theme=dark]{
  --navy:#0b1626; --navy2:#132238; --blue:#5b9bf5; --blue-l:#16273f; --blue-d:#3d7fd8;
  --bg:#0d1420; --panel:#151f2e; --panel2:#111a27; --line:#293648; --line2:#202c3c;
  --tx:#e6ecf5; --tx2:#9fb0c7; --tx3:#71829a;
  --up:#ff6b6b; --up-bg:#3a1e1e; --down:#63a4ff; --down-bg:#152a44; --flat:#9fb0c7;
  --warn:#ffb547; --warn-bg:#3a2c14; --ok:#54c98c; --ok-bg:#12301f; --err:#ff7b72; --err-bg:#3a1c1a;
  --input:#33301c; --input-bd:#6d6233; --calc:#151f2e; --ext:#13291f; --ext-bd:#2c5a3f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  --k-stock:#63a4ff; --k-stock-bg:#152a44; --k-bond:#b794f6; --k-bond-bg:#271f3d;
  --k-deriv:#ffb066; --k-deriv-bg:#3a2814; --k-cash:#54c98c; --k-cash-bg:#12301f;
  --k-other:#9fb0c7; --k-other-bg:#202c3c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:236px;flex:0 0 236px;background:var(--navy);color:#dbe6f5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
#side .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.09)}
#side .brand b{display:block;font-size:15px;color:#fff;letter-spacing:-.3px}
#side .brand span{display:block;font-size:11px;color:#8fa9cc;margin-top:3px}
#side nav{padding:10px 8px;flex:1}
#side nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:#c3d4ea;font-size:13.5px;margin-bottom:2px}
#side nav a:hover{background:rgba(255,255,255,.07);color:#fff}
#side nav a.on{background:var(--blue);color:#fff;font-weight:600}
#side nav a .ic{width:16px;text-align:center;opacity:.85;font-size:13px}
#side .sfoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#7f97b8;line-height:1.6}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.3px}
#top .sp{flex:1}
#view{padding:18px 20px 60px;min-width:0}
.mobnav{display:none}

/* ---------- atoms ---------- */
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--tx);white-space:nowrap;transition:.12s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d);color:#fff}
.btn.dgr{color:var(--err);border-color:var(--line)}
.btn.dgr:hover{border-color:var(--err);background:var(--err-bg)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;line-height:18px;border:1px solid var(--line);background:var(--panel2);color:var(--tx2);white-space:nowrap}
.chip.risk{background:var(--up-bg);color:var(--up);border-color:transparent}
.chip.safe{background:var(--down-bg);color:var(--down);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.err{background:var(--err-bg);color:var(--err);border-color:transparent}
.chip.k-stock{background:var(--k-stock-bg);color:var(--k-stock);border-color:transparent}
.chip.k-bond{background:var(--k-bond-bg);color:var(--k-bond);border-color:transparent}
.chip.k-deriv{background:var(--k-deriv-bg);color:var(--k-deriv);border-color:transparent}
.chip.k-cash{background:var(--k-cash-bg);color:var(--k-cash);border-color:transparent}
.chip.k-other{background:var(--k-other-bg);color:var(--k-other);border-color:transparent}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
input.key{background:var(--input);border-color:var(--input-bd)}
label.fl{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:3px;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.panel>header{padding:11px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel>header h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.panel>header .sub{font-size:11.5px;color:var(--tx3)}
.panel>header .sp{flex:1}
.panel .body{padding:14px}
.panel .body.p0{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:11px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);opacity:.75}
.kpi.acc-up:before{background:var(--up)} .kpi.acc-down:before{background:var(--down)}
.kpi.acc-ok:before{background:var(--ok)} .kpi.acc-warn:before{background:var(--warn)} .kpi.acc-mut:before{background:var(--line)}
.kpi .k{font-size:11.5px;color:var(--tx2);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:20px;font-weight:700;letter-spacing:-.6px;line-height:1.22}
.kpi .s{font-size:11.5px;color:var(--tx3);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- table ---------- */
/* 2026-08-12: 헤더(thead th, top:0)·합계행(tfoot td, bottom:0)에 position:sticky 를
   줘놨는데도 종목이 많은 표(예: 개별종목 통합 59개)에서는 화면 끝까지 스크롤해야만 합계가
   보였다 — sticky 는 "가장 가까운 스크롤 컨테이너" 안에서만 뜨는데, .tw 가 세로 높이 제한이
   없어(overflow:auto 지만 내용이 넘칠 일이 없었음) 사실상 페이지 전체가 스크롤되는 것과
   같았기 때문. .tw 자체에 세로 상한을 줘서 표가 길면 "표 안에서만" 스크롤되게 하면, 그
   안에서 헤더·합계행이 실제로 화면에 붙어있게 된다(짧은 표는 스크롤이 필요 없어 그대로).*/
.tw{overflow:auto;max-width:100%;max-height:70vh;position:relative}
/* 2026-08-11: table-layout:auto(기본값)에서는 셀에 width/max-width 를 줘도 브라우저가
   그 열의 가장 넓은 내용물(white-space:nowrap 이라 줄바꿈도 안 됨) 기준으로 실제 폭을 다시 계산해버려,
   사용자가 손잡이로 줄인 너비가 다시 그려질 때마다 원래대로 돌아가 버렸다(= "저장이 안 됨").
   table-layout:fixed 로 바꿔야 명시한 width 가 실제로 유지된다. 대신 이 모드에서는 모든 열에
   예외 없이 width 를 지정해야 하므로, app2.js DataTable() 의 head/행/합계/footer 렌더가 전부
   DEFW()로 폭을 명시하도록 맞춰 두었다. */
table.dt{border-collapse:separate;border-spacing:0;min-width:100%;font-size:12.5px;white-space:nowrap;table-layout:fixed}
table.dt th,table.dt td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:right}
table.dt th{background:var(--panel2);position:sticky;top:0;z-index:2;font-weight:700;color:var(--tx2);font-size:11.5px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
table.dt th:hover{color:var(--blue)}
table.dt th.l,table.dt td.l{text-align:left}
table.dt th.c,table.dt td.c{text-align:center}
table.dt tbody tr:hover td{background:var(--blue-l)}
table.dt tfoot td{background:var(--panel2);font-weight:700;border-top:2px solid var(--line);border-bottom:none;position:sticky;bottom:0}
table.dt .stick{position:sticky;left:0;background:var(--panel);z-index:3;box-shadow:1px 0 0 var(--line)}
table.dt th.stick{z-index:4;background:var(--panel2)}
table.dt tbody tr:hover .stick{background:var(--blue-l)}
table.dt tfoot .stick{background:var(--panel2);z-index:4}
table.dt .nm{max-width:290px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
table.dt a.nm:hover{color:var(--blue);text-decoration:underline}
.sortmk{font-size:9px;opacity:.6;margin-left:2px}
/* ---------- 표 컬럼 드래그 순서변경 · 너비조절 ---------- */
/* 2026-08-11: 처음엔 손잡이(.colrz)를 th 안의 래퍼(.thwrap, height:100%)에 절대배치했는데,
   <div style="height:100%">가 <th>(테이블 셀)의 직계 자식일 때 퍼센트 높이가 제대로 안 잡히는
   건 크로미움 포함 대부분 브라우저의 공통된 한계다(셀 높이는 "지정값"이 아니라 테이블 레이아웃이
   계산한 값이라 %가 기준으로 못 삼음) — 그래서 손잡이가 세로로 아주 얇은 영역에만 배치돼 실제로는
   거의 클릭이 안 됐을 것으로 보임(Edge·Chrome 둘 다 동일 엔진이라 똑같이 실패했던 이유).
   퍼센트 높이 대신 세로 중앙 정렬(top:50%+transform)과 고정 높이로 바꿔 이 문제를 원천적으로 피함. */
table.dt th .thwrap{position:relative;display:block;width:100%;box-sizing:border-box;padding-right:12px}
table.dt th .thlb{pointer-events:none}
table.dt th.dragging{opacity:.4}
table.dt th.dragover{box-shadow:inset 2px 0 0 var(--blue),inset -2px 0 0 var(--blue)}
table.dt th .colrz{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:30px;cursor:col-resize;user-select:none;z-index:50}
table.dt th .colrz:hover{background:var(--blue-l)}
table.dt th .colrz:active{background:var(--blue)}
.tbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--panel2)}
.tbar input[type=text]{width:180px}
.tbar select{width:auto;min-width:110px}
.colpick{position:relative}
.colmenu{position:absolute;right:0;top:calc(100% + 5px);background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:9px;z-index:60;max-height:340px;overflow:auto;width:230px}
.colmenu label{display:flex;gap:7px;align-items:center;padding:3px 4px;font-size:12.5px;border-radius:5px;cursor:pointer}
.colmenu label:hover{background:var(--blue-l)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.src-in{background:var(--input);box-shadow:inset 2px 0 0 var(--input-bd)}
.src-ex{background:var(--ext);box-shadow:inset 2px 0 0 var(--ext-bd)}
.empty{padding:34px 16px;text-align:center;color:var(--tx3);font-size:13px}
.loading{padding:34px;text-align:center;color:var(--tx3)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- charts ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-size:10.5px;fill:var(--tx2);font-family:inherit}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line2);stroke-width:1;stroke-dasharray:2 3}
.chart .lbl-v{font-size:10px;fill:var(--tx3)}
.chlegend{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--tx2);margin-top:9px;justify-content:center}
.chlegend span{display:flex;align-items:center;gap:4px}
.chlegend i{width:9px;height:9px;border-radius:2px}
.dnwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* ---------- misc ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:baseline}
.kv dt{color:var(--tx2);font-size:12px}
.kv dd{margin:0;text-align:right;font-weight:600}
.note{font-size:11.5px;color:var(--tx3);line-height:1.7;margin-top:8px}
.callout{border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.65;margin-bottom:12px}
.callout.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.callout.err{border-color:var(--err);background:var(--err-bg);color:var(--err)}
.callout.info{border-color:var(--blue);background:var(--blue-l);color:var(--tx)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:600px;width:100%;max-height:88vh;overflow:auto}
.modal header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal header h3{margin:0;font-size:15px}
.modal .mb{padding:16px}
.modal footer{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:11px}
.toast{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--navy);color:#fff;padding:10px 15px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);animation:tin .22s}
.toast div.err{background:var(--err)} .toast div.ok{background:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;color:var(--tx2);font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.bar-mini{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:56px;display:inline-block;vertical-align:middle}
.bar-mini i{display:block;height:100%;background:var(--blue)}
.bar-mini i.over{background:var(--warn)}
.bar-mini i.full{background:var(--ok)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.cal .m{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel2)}
.cal .m b{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:4px}
.cal .m .amt{font-size:15px;font-weight:700}
.cal .m ul{margin:6px 0 0;padding:0;list-style:none;font-size:11px;color:var(--tx3);line-height:1.6}
.cal .m.hi{border-color:var(--blue);background:var(--blue-l)}
.rng{display:flex;align-items:center;gap:8px}
.rng input[type=range]{flex:1;min-width:90px}
.rng .val{width:66px;text-align:right;font-family:var(--mono);font-size:12px}
.hl-diff-0{color:var(--ok)} .hl-diff-x{color:var(--err);font-weight:700}
.scroll-x{overflow-x:auto}
@media(max-width:1000px){
  #side{display:none}
  .mobnav{display:flex;gap:5px;overflow:auto;padding:8px 12px;background:var(--navy);position:sticky;top:0;z-index:40}
  .mobnav a{color:#c3d4ea;padding:6px 11px;border-radius:7px;font-size:12.5px;white-space:nowrap;background:rgba(255,255,255,.07)}
  .mobnav a.on{background:var(--blue);color:#fff;font-weight:600}
  #top{top:0}
  .g2,.g3,.g4{grid-template-columns:1fr}
  #view{padding:12px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .kpi .v{font-size:17px}
}
@media print{#side,#top .btn,.tbar{display:none}body{background:#fff}}

/* ---------- 표 그룹 구분 ---------- */
table.dt tr.grouphd td{background:var(--panel2);border-top:2px solid var(--line);border-bottom:1px solid var(--line);
  padding:6px 10px;position:sticky;left:0}
table.dt tr.grouphd .gtag{display:inline-block;font-weight:700;font-size:12px;padding:1px 9px;border-radius:5px;
  background:var(--blue-l);color:var(--blue)}
table.dt tr.grouphd .gtag.risk{background:var(--up-bg);color:var(--up)}
table.dt tr.grouphd .gtag.safe{background:var(--down-bg);color:var(--down)}
table.dt tr.grouphd .gtag.cash{background:var(--line2);color:var(--tx2)}
table.dt tr.grouphd .gtag.k-stock{background:var(--k-stock-bg);color:var(--k-stock)}
table.dt tr.grouphd .gtag.k-bond{background:var(--k-bond-bg);color:var(--k-bond)}
table.dt tr.grouphd .gtag.k-deriv{background:var(--k-deriv-bg);color:var(--k-deriv)}
table.dt tr.grouphd .gtag.k-cash{background:var(--k-cash-bg);color:var(--k-cash)}
table.dt tr.grouphd .gtag.k-other{background:var(--k-other-bg);color:var(--k-other)}
table.dt tr.grouphd .gcnt{font-size:11px;color:var(--tx3);margin-left:8px}
table.dt tr.grouphd .gmeta{font-size:11.5px;color:var(--tx2);margin-left:12px;font-family:var(--mono)}
table.dt tr:hover.grouphd td{background:var(--panel2)}
.tbar .tchk{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tx2);white-space:nowrap;cursor:pointer;
  border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--panel)}
.tbar .tchk input{width:auto}

/* ---------- 비밀번호 잠금 화면 ---------- */
.lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%)}
.lockbox{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  padding:34px 30px 26px;width:100%;max-width:380px;text-align:center}
.lockicon{font-size:34px;line-height:1;margin-bottom:12px}
.lockbox h1{font-size:18px;margin:0 0 5px;letter-spacing:-.4px}
.lockbox .lsub{font-size:12.5px;color:var(--tx3);margin:0 0 22px;line-height:1.6}
.lockbox label.fl{text-align:left}
.lockbox input{font-size:16px;padding:11px 13px;text-align:center;letter-spacing:2px}
.lockbtn{width:100%;margin-top:12px;padding:11px;font-size:14px;font-weight:700}
.lockmsg{margin-top:14px;font-size:12.5px;color:var(--err);background:var(--err-bg);
  border-radius:8px;padding:9px 11px;line-height:1.6}
.lfoot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line2);
  font-size:11px;color:var(--tx3);line-height:1.7}

/* 숨긴 행 요약 */
table.dt tr.aggrow td{background:var(--panel2);border-top:1px dashed var(--line);
  border-bottom:1px dashed var(--line);color:var(--tx2);font-size:11.5px}
table.dt tr.aggrow .stick{background:var(--panel2)}
table.dt tr:hover.aggrow td{background:var(--panel2)}

</style>
